<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四种页面 · frontend-craft 0.4.1</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f7f6;color:#202522;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1160px;margin:auto;padding:42px 28px 26px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:30px}.eyebrow{font-size:12px;letter-spacing:.09em;color:#68706b;margin:0 0 10px}h1{font-size:30px;line-height:1.3;letter-spacing:-.04em;margin:0}header>p{font-size:14px;color:#656d67;margin:0 0 3px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px}.sample{display:block;text-decoration:none;color:inherit;border:1px solid #dfe2dc;background:#fff;transition:border-color .15s,transform .15s}.sample:hover{border-color:#8e9990;transform:translateY(-2px)}.sample:focus-visible{outline:3px solid #305f88;outline-offset:4px}.sample img{width:100%;aspect-ratio:2.1;object-fit:cover;object-position:top;display:block;border-bottom:1px solid #e4e6e1}.caption{padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.caption h2{font-size:19px;margin:0 0 6px;line-height:1.4}.caption p{font-size:13px;line-height:1.6;color:#747b75;margin:0}.arrow{font-size:25px;color:#626c64}footer{display:flex;justify-content:space-between;gap:16px;font-size:12px;color:#777e78;line-height:1.7;margin-top:28px}footer a{color:inherit;text-underline-offset:3px}@media(max-width:620px){main{padding:28px 18px}header{display:block}header>p{margin-top:14px}.grid{grid-template-columns:1fr;gap:20px}h1{font-size:27px}footer{display:block}footer a{display:inline-block;margin-top:10px}}@media(prefers-reduced-motion:reduce){.sample{transition:none}}
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">FRONTEND-CRAFT 0.4.1 · 2026.10.25</p><h1>四种页面，分别看看。</h1></div>
      <p>点击预览，打开完整页面。<br>每页都有少量可操作的交互。</p>
    </header>
    <div class="grid">
      <a class="sample" href="tasks.html"><img src="previews/tasks.jpg" alt="轨迹任务页的实际桌面截图"><div class="caption"><div><h2>01　轨迹 · 任务工作台</h2><p>任务列表与详情 / 筛选、完成、新建</p></div><span class="arrow" aria-hidden="true">↗</span></div></a>
      <a class="sample" href="music.html"><img src="previews/music.jpg" alt="频场音乐活动页的实际桌面截图"><div class="caption"><div><h2>02　频场 · 独立音乐周末</h2><p>活动海报与节目单 / 日期切换、收藏</p></div><span class="arrow" aria-hidden="true">↗</span></div></a>
      <a class="sample" href="journal.html"><img src="previews/journal.jpg" alt="截面城市杂志的实际桌面截图"><div class="caption"><div><h2>03　截面 · 城市观察杂志</h2><p>长文与街景插画 / 字号、目录、收藏</p></div><span class="arrow" aria-hidden="true">↗</span></div></a>
      <a class="sample" href="object.html"><img src="previews/object.jpg" alt="隅物灯具商品页的实际桌面截图"><div class="caption"><div><h2>04　隅物 · 弧光桌灯</h2><p>商品展示与细节 / 换色、灯光、心愿单</p></div><span class="arrow" aria-hidden="true">↗</span></div></a>
    </div>
    <footer><span>四页均为当前 Skill 的独立演示，使用虚构内容与原创 SVG 图形。</span><a href="README.md">制作与检查记录</a></footer>
  </main>
</body>
</html>
