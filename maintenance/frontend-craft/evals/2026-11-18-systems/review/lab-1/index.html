<!--
页面取舍（从 workbench 起步样例的共享表头、对象优先、移动重排演变）：
仪器是目录兼空档比较；日程是精确操作工作台；我的预约、管理员是记录工作台。学生反复使用，不做宣传横幅或指标看板。
颜色只强调可预约/当前选择，其他占用和历史采用中性色；危险操作以文字和边框补充。
因为只有六台仪器且无照片，所以用三列对象卡与原创线稿辨认，而不是虚构照片。
因为时段有1/2/4小时，所以卡片标最小时长，日程保留小时刻度，预约允许最小时长的整数倍。
因为培训、审批、送样是不同约束，所以分别说明，不把“未培训”伪装成满约。
因为手机主要查看自己的预约，所以记录在窄屏重排，七日日程提供独立横向滚动，不缩小文字。
因为校准数据仅到18点但任务明确全天，所以11月20日XRD按8–22点封锁，保留原数据不改。
-->
