<!doctype html>
<!--
课题组文献库 / 共读
类型：文献库是供六人反复使用的目录检索（从 catalog 起步，继承筛选、结果数、空态和上下文保留）；
单篇是连续阅读+协作记录；添加是明确保存的表单；组会是按日期排列的共享日程。不要营销横幅和虚构 PDF。
颜色与图形：深橄榄给稳定导航和主操作；琥珀给尚无人读，绿色给读完。原创书页标志、日历页和六人姓名头像构成身份，不用图片冒充论文。
因为 96 篇论文是英文长标题，所以使用宽行列表、英文衬线标题，不用等高图片卡；中文元信息另起行。
因为六人阅读状态有空缺、在读、读完，所以列表区分“无人开始”与“尚无人读完”，单篇完整列六人，避免误认重复阅读。
因为组会每周一次且手机要查看，所以桌面右栏露出下次组会、组会页按日期连续排列，手机顺序不变、不缩小表格。
因为 PDF 不存在且禁止联网，所以无打开 PDF 假入口；添加时导入只是解析，DOI/arXiv 明示手动补全。
因为本地存储不是共享服务器，所以全局明示本机存储，并提供 JSON 备份交换，不伪装同步。
-->

<div class="shell"><header class="topbar"><span id="crumb">研究空间 / 文献库</span><span>2026 年 11 月 18 日 <span class="weekday">星期三</span></span></header><main id="main" tabindex="-1"></main><footer>共读 · 把阅读留在组里 <span>示例文献与人名 · 无真实 PDF · 不联网、不实时同步</span></footer></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="schedule"><form id="scheduleform"><div class="dialog-head"><h2 id="schedule-title">安排组会</h2><button type="button" class="iconbtn" data-close="schedule" aria-label="关闭">×</button></div><p class="muted">选一篇论文，留出一起讨论的时间。</p><label for="meetingpaper">讨论文献</label><select id="meetingpaper" required></select><label for="presenter">主讲成员</label><select id="presenter" required></select><div class="two"><div><label for="meetingdate">日期</label><input id="meetingdate" type="date" min="2026-11-18" required></div><div><label for="meetingtime">时间</label><input id="meetingtime" type="time" value="15:00" required></div></div><p id="schedule-error" class="error" role="alert"></p><div class="form-actions"><button type="button" class="btn" data-close="schedule">取消</button><button class="btn primary">保存安排</button></div></form></dialog>
<dialog id="citation"><div class="dialog-head"><h2>引用文献</h2><button class="iconbtn" data-close="citation" aria-label="关闭">×</button></div><label for="citeformat">引用格式</label><select id="citeformat"><option value="bib">BibTeX</option><option value="apa">APA</option><option value="gb">GB/T 7714（简式）</option></select><label for="citetext">引用内容</label><textarea id="citetext" rows="9" readonly></textarea><div class="form-actions"><span class="muted">复制失败时，可直接选择文字复制。</span><button id="copycite" class="btn primary">复制引用</button></div></dialog>
<dialog id="confirm"><h2 id="confirm-title">确认操作</h2><p id="confirm-text"></p><div class="form-actions"><button class="btn" id="confirm-no" autofocus>取消</button><button class="btn primary" id="confirm-yes">确认</button></div></dialog>
<script src="data/papers.js"></script><script src="app.js"></script>
</body></html>
