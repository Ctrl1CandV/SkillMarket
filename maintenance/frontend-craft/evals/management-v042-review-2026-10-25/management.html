const seed=[
 {id:'CW-026',title:'最后一班渡船，和守了三十年的码头',person:'陈伯安',place:'澄湾 · 东渡口',duration:'28:42',date:'2026-10-18',collector:'许之遥',status:'pending',tags:['渡口记忆','水上交通','口述史'],note:'访谈于旧候船亭完成。受访者所述的末班船时间，与采集笔记中的冬季时刻不同，需保留季节限定。',segments:[['00:24','陈伯安','以前没有桥的时候，大家都从这里过江。早上五点多，卖菜的人就挑着担子来了。雾大的日子看不见对岸，只能听见船慢慢靠过来的声音。'],['02:16','陈伯安','我在这个码头守了三十年。夏天最后一班船是晚上九点，冬天就要早一些。那时候我们叫它“东平码头”，现在年轻人都说东渡口了。'],['04:38','陈伯安','最记得的不是哪一天人特别多，是船走以后，一下子安静下来的时候。绳子还在水里晃，亭子底下有一盏灯，照着最后一个回家的人。']],issues:[{time:'02:16',text:'旧称“东平码头”的写法',hint:'采集笔记第 3 页：东平码头。',done:false},{time:'02:16',text:'补全末班船的季节限定',hint:'当前文字保留了夏季与冬季的区别。',done:false}]},
 {id:'CW-025',title:'清晨四点，鱼市先醒来',person:'周桂芳',place:'澄湾 · 老鱼市',duration:'19:08',date:'2026-10-17',collector:'许之遥',status:'editing',tags:['市井生活','鱼市'],note:'采集环境有叫卖声。人物称呼已得到受访者确认，个别方言词保留原样。',segments:[['00:12','周桂芳','四点钟天还是黑的，街上别的店都没开门，我们先把灯拉亮。水打在石板上，声音很响，隔壁听见了就知道今天有人开张了。'],['01:56','周桂芳','我母亲叫这种小鱼“白条子”。你不要给我改成书上的名字，乡里人一直这么叫。鱼新不新鲜，拿起来看看眼睛就知道。'],['03:40','周桂芳','现在市场搬进屋里了，冬天没那么冷，是好事。就是我有时候还会想起以前那条长街，大家隔老远就互相招呼。']],issues:[{time:'01:56',text:'方言名称保留原称',hint:'已核对采集笔记：“白条子”。',done:true}]},
 {id:'CW-024',title:'一间修钟铺的午后',person:'陆闻钟',place:'澄湾 · 南巷',duration:'36:15',date:'2026-10-16',collector:'沈安',status:'pending',tags:['手艺','街巷'],note:'室内录制，背景为多只机械钟。铺面地址记录为南巷 17 号。',segments:[['00:30','陆闻钟','这些钟走起来各有各的声音，做得久了，不用看也知道是哪一只。中午一到，它们不一定一起响，总有早一点、晚一点的。'],['03:14','陆闻钟','这家铺子是父亲留下来的。我刚学的时候，拆开了装不回去，他也不骂，就让我把每个零件按顺序排在白纸上。'],['06:02','陆闻钟','有人拿着停了很多年的钟来，说不一定要修好，只想知道还能不能响。我能修的就修，实在不行也得把原因讲清楚。']],issues:[{time:'03:14',text:'补记接手店铺的年份',hint:'当前采集笔记未记录，需后续回访。',done:false}]},
 {id:'CW-023',title:'巷口那棵树，比街道名字更老',person:'吴素琴',place:'澄湾 · 榕树里',duration:'22:06',date:'2026-10-15',collector:'沈安',status:'pending',tags:['社区','地方记忆'],note:'多人在场的社区访谈节选，此记录仅保留吴素琴的发言。',segments:[['01:10','吴素琴','小时候放了学，我们就在树下等大人回来。没有约定过，走着走着就都到这里了。'],['04:22','吴素琴','这条巷子换过名字。以前写信只要写老榕树旁边，邮递员就找得到。后来门牌齐了，反而有人要问是树的哪一头。'],['07:18','吴素琴','我希望这棵树一直留着。人走远了再回来，总得有一样东西还认得他。']],issues:[{time:'04:22',text:'核对旧巷名的使用时期',hint:'社区手绘地图标注为“榕树下”，无年份。',done:false}]},
 {id:'CW-022',title:'雨落在瓦面上的声音',person:'邵明',place:'澄湾 · 北街',duration:'16:35',date:'2026-10-14',collector:'许之遥',status:'review',tags:['居住','雨声'],note:'文字校对已完成，等待另一位编辑复核。',segments:[['00:18','邵明','雨刚来的时候，是一颗一颗落在瓦上的。后来密起来，屋檐就连成了一道水帘。'],['02:47','邵明','那间房子现在已经不在了，我还记得它下雨的声音。窗户朝东，风大的时候，要拿一块旧毛巾压住窗缝。'],['05:20','邵明','你问我想留下什么，我觉得把这一段雨声留下就很好。以后小孩子听见，也知道这里以前是什么样子。']],issues:[{time:'02:47',text:'房屋朝向与笔记一致',hint:'采集笔记记载：朝东。',done:true}]},
 {id:'CW-021',title:'老车站的第一声汽笛',person:'方海生',place:'澄湾 · 旧站路',duration:'31:52',date:'2026-10-13',collector:'沈安',status:'archived',tags:['交通','铁路'],note:'已完成校对与复核，作为只读归档示例。',segments:[['00:42','方海生','第一班车进站以前，站台上已经有好些人了。有送人的，也有只是过来看看热闹的。'],['03:08','方海生','我们总觉得汽笛响起来，人就要去很远的地方。其实那时候最远也就是去省城，但对小孩子来说已经够远了。'],['05:55','方海生','后来车站搬了，我还会走到旧站路来看一眼。路还在，树还在，就是不用再赶时间了。']],issues:[]}
];
const labels={pending:'待校对',editing:'校对中',review:'待复核',archived:'已归档'};
const clone=x=>JSON.parse(JSON.stringify(x));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved=clone(seed),working={},selected=seed[0].id,scope='all',query='',statusFilter='all',activeTab='transcript',toastTimer;
function warn(message){$('storageWarning').textContent=message;$('storageWarning').hidden=false;}
try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(!Array.isArray(data))throw new Error('shape');saved=seed.map(base=>{const r=data.find(x=>x&&x.id===base.id);if(!r)return clone(base);if(!Object.hasOwn(labels,r.status)||!Array.isArray(r.segments)||r.segments.length!==base.segments.length||!r.segments.every(s=>Array.isArray(s)&&typeof s[2]==='string'&&s[2].length<=20000)||!Array.isArray(r.issues)||r.issues.length!==base.issues.length)throw new Error('shape');return {...clone(base),status:r.status,segments:base.segments.map((s,i)=>[s[0],s[1],r.segments[i][2]]),issues:base.issues.map((v,i)=>({...v,done:r.issues[i]?.done===true})),savedAt:typeof r.savedAt==='string'?r.savedAt.slice(0,40):undefined};});}}catch{warn('无法读取本机记录，已载入原始示例。当前编辑仍可继续，请在离开前确认保存结果。');}
saved.forEach(r=>working[r.id]=clone(r));
const current=()=>working[selected];
const dirty=id=>JSON.stringify(working[id])!==JSON.stringify(saved.find(r=>r.id===id));
function filtered(){return seed.map(r=>working[r.id]).filter(r=>(scope==='all'||scope==='work'&&['pending','editing'].includes(r.status)||scope==='review'&&r.status==='review')&&(statusFilter==='all'||r.status===statusFilter)&&[r.title,r.person,r.place,r.id,...r.tags].join(' ').toLowerCase().includes(query));}
function badge(r){return `<span class="badge ${esc(r.status)}">${labels[r.status]}</span>`;}
function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3500);}
function renderList(){const rows=filtered();$('resultCount').textContent=`${rows.length} / ${seed.length} 份档案`;$('queueTitle').textContent={all:'全部档案',work:'待处理档案',review:'待复核档案'}[scope];$('workCount').textContent=Object.values(working).filter(r=>['pending','editing'].includes(r.status)).length;$('allCount').textContent=seed.length;$('reviewCount').textContent=Object.values(working).filter(r=>r.status==='review').length;document.querySelectorAll('[data-scope]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scope===scope)));$('recordList').innerHTML=rows.length?rows.map(r=>`<button class="record" type="button" data-id="${r.id}" aria-pressed="${r.id===selected}"><span class="record-top"><span>${r.id}</span>${badge(r)}</span><strong>${esc(r.title)}</strong><span class="record-meta"><span>${esc(r.person)}</span><span>${esc(r.place)}</span></span><span class="record-bottom"><span>${r.duration} · ${r.date.slice(5).replace('-',' / ')}</span><span class="${r.issues.some(i=>!i.done)?'unfinished':''}">${dirty(r.id)?'有未保存修改':r.issues.some(i=>!i.done)?`${r.issues.filter(i=>!i.done).length} 处待确认`:'确认项已完成'}</span></span></button>`).join(''):'<div class="empty"><strong>没有匹配的档案</strong>试试其他关键词或状态。<br><button class="btn" type="button" id="clearFilters">清空筛选</button></div>';return rows;}
function fit(t){t.style.height='auto';t.style.height=Math.max(100,t.scrollHeight+2)+'px';}
function renderState(){const r=current();if(!r)return;const locked=['review','archived'].includes(r.status),remaining=r.issues.filter(i=>!i.done).length;$('issueCount').textContent=remaining?`${remaining} 处`:'已确认';$('saveState').classList.toggle('dirty',dirty(r.id));$('saveState').textContent=dirty(r.id)?'有未保存修改':r.savedAt?`已保存于本机 · ${r.savedAt}`:locked?'当前记录为只读状态':'尚无本次修改';$('saveButton').disabled=locked||!dirty(r.id);$('submitButton').disabled=r.status==='archived'||r.status!=='review'&&remaining>0;$('submitButton').textContent=r.status==='review'?'退回校对':r.status==='archived'?'已归档':remaining?`还有 ${remaining} 处待确认`:'提交复核 ↗';}
function setTab(name,focus=false){activeTab=name;for(const n of ['transcript','info']){$(n+'Panel').hidden=n!==name;$(n+'Tab').setAttribute('aria-selected',String(n===name));$(n+'Tab').tabIndex=n===name?0:-1;}if(focus)$(name+'Tab').focus();if(name==='transcript')document.querySelectorAll('.segment textarea').forEach(fit);}
function renderDetail(){const r=current();$('detail').hidden=!r;if(!r)return;const locked=['review','archived'].includes(r.status);$('editHint').textContent=locked?'只读内容 · 保留口述语气':'直接编辑 · 保留口述语气';$('recordId').textContent=`${r.id} / 口述访谈`;$('recordStatus').innerHTML=badge(r);$('recordTitle').textContent=r.title;$('recordMeta').innerHTML=`<span>口述 <b>${esc(r.person)}</b></span><span>${esc(r.place)}</span><span>${r.duration}</span>`;$('segments').innerHTML=r.segments.map((s,i)=>`<div class="segment"><span class="timestamp">${s[0]}</span><div><label for="segment-${i}">${esc(s[1])}</label><textarea id="segment-${i}" data-segment="${i}" aria-label="${esc(s[1])} ${s[0]} 的逐字稿" maxlength="20000" ${locked?'readonly':''}>${esc(s[2])}</textarea></div></div>`).join('');$('issues').innerHTML=r.issues.length?r.issues.map((v,i)=>`<div class="issue"><label><input type="checkbox" data-issue="${i}" ${v.done?'checked':''} ${locked?'disabled':''}><span>${esc(v.text)}</span></label><small>${v.time} · ${esc(v.hint)}</small></div>`).join(''):'<p class="aside-note">这份记录没有待确认片段。</p>';$('tags').innerHTML=r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');$('archiveInfo').innerHTML=[['档案编号',r.id],['口述者',r.person],['采集地点',r.place],['采集日期',r.date],['采集人',r.collector],['录音时长',r.duration],['录音文件','本示例未附录音，不能进行真实音频核对。'],['采集笔记',r.note],['档案状态',labels[r.status]]].map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');setTab(activeTab);renderState();}
function refresh(){const rows=filtered();if(!rows.some(r=>r.id===selected))selected=rows[0]?.id||null;if(!rows.length)document.body.classList.remove('show-detail');renderList();renderDetail();}
function persist(nextStatus){const r=current();if(!r)return false;if(!r.segments.every(s=>s[2].trim())){notify('逐字稿不能留空，请补全后再保存。');return false;}const next=clone(r);next.status=nextStatus;next.savedAt=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});const nextSaved=saved.map(v=>v.id===next.id?next:v);try{localStorage.setItem(KEY,JSON.stringify(nextSaved));}catch{warn('本机保存失败：浏览器可能禁用了存储或空间不足。修改仍保留在当前页面，请勿关闭。');return false;}saved=nextSaved;working[next.id]=clone(next);$('storageWarning').hidden=true;return true;}
$('recordList').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){selected=b.dataset.id;document.body.classList.add('show-detail');renderList();renderDetail();if(matchMedia('(max-width:700px)').matches)$('recordTitle').focus();}else if(e.target.closest('#clearFilters')){query='';scope='all';statusFilter='all';$('search').value='';$('statusFilter').value='all';refresh();$('search').focus();}});
document.querySelectorAll('[data-scope]').forEach(b=>b.addEventListener('click',()=>{scope=b.dataset.scope;statusFilter='all';$('statusFilter').value='all';document.body.classList.remove('show-detail');refresh();}));
$('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();refresh();});$('statusFilter').addEventListener('change',e=>{statusFilter=e.target.value;refresh();});
$('segments').addEventListener('input',e=>{if(!e.target.matches('[data-segment]'))return;current().segments[Number(e.target.dataset.segment)][2]=e.target.value;fit(e.target);renderList();renderState();});
$('issues').addEventListener('change',e=>{if(!e.target.matches('[data-issue]'))return;current().issues[Number(e.target.dataset.issue)].done=e.target.checked;renderList();renderState();});
$('saveButton').addEventListener('click',()=>{if(persist(current().status==='pending'?'editing':current().status)){refresh();notify('草稿已保存于本机浏览器。');}});
$('submitButton').addEventListener('click',()=>{const r=current();if(!r||r.status==='archived')return;const returning=r.status==='review';if(!returning&&r.issues.some(v=>!v.done)){notify('请先处理待确认片段。');return;}if(persist(returning?'editing':'review')){refresh();notify(returning?'已退回校对，可继续编辑。':'本机状态已更新为待复核。');}});
for(const n of ['transcript','info']){$(n+'Tab').addEventListener('click',()=>setTab(n));$(n+'Tab').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();setTab(e.key==='Home'?'transcript':e.key==='End'?'info':n==='transcript'?'info':'transcript',true);}});}
$('backToList').addEventListener('click',()=>{document.body.classList.remove('show-detail');document.querySelector(`.record[data-id="${selected}"]`)?.focus();});
window.addEventListener('beforeunload',e=>{if(seed.some(r=>dirty(r.id))){e.preventDefault();e.returnValue='';}});window.addEventListener('resize',()=>{if(activeTab==='transcript')document.querySelectorAll('.segment textarea').forEach(fit);});refresh();
</script>
