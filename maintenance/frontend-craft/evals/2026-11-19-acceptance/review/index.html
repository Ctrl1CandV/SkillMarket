<h1>统一验收盲评</h1>
<p>每道题 2 份成品，用同一份任务说明和数据，都是 gpt-6.1-sol 各跑一次。其中一份不带技能，一份带技能；每道题的顺序都单独打乱了，对应关系在 KEY.md，评完再看。</p>
<p>每道题选出你更喜欢的（多份时排个名次，比如“试剂库：乙 > 甲”），分不出高低也直接说“分不出”。有余力的话，说说最好的那份好在哪。点图片看原图，点“打开来操作”可以真的用。</p>
