<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>组会候选 · 研目</title>
<style>
:root{--bg:#f2f5f3;--paper:#fff;--ink:#233b3f;--muted:#607576;--line:#dce5e2;--brand:#28665e;--wash:#eaf2ee;--sans:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 var(--sans);line-break:strict;text-autospace:normal}button,input,select{font:inherit}button,a{color:inherit}button{cursor:pointer;border:0}button:disabled{cursor:default;opacity:.5}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #79a99e;outline-offset:4px}a{text-underline-offset:4px}header{height:76px;background:#fbfcfa;border-bottom:1px solid var(--line);padding:0 max(28px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:700;letter-spacing:.06em;color:#1b5049}.mark{width:33px;height:36px;background:var(--brand);color:white;display:grid;place-items:center;border-radius:5px}.mark svg{width:25px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.private{font-size:13px;color:var(--muted)}main{max-width:1236px;margin:auto;padding:34px 28px 40px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:26px}h1{font-size:32px;letter-spacing:-.025em;font-weight:650;line-height:1.4;margin:0}.total{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}.total strong{font:46px/1 Georgia,serif;color:var(--brand)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;align-items:start}.library{background:var(--paper);border:1px solid var(--line);border-radius:11px;overflow:hidden}.toolbar{padding:20px 22px 14px}.search{display:block;position:relative}.search svg{position:absolute;left:13px;top:13px;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:1.7}input[type=search]{width:100%;padding:10px 12px 10px 40px;min-height:44px;border:1px solid #c3d2cc;border-radius:6px;background:#fcfdfc;color:var(--ink)}.filters{display:flex;gap:4px;margin-top:13px;flex-wrap:wrap}.filters button{background:none;color:var(--muted);padding:7px 11px;border-radius:5px;font-size:13px;min-height:38px}.filters button:hover{background:#f0f5f2}.filters button[aria-pressed=true]{background:var(--wash);color:var(--brand);font-weight:600}.results{padding:10px 22px;background:#fafcfb;border-block:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:space-between}.mobile-jump{display:none}.paper{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:14px;padding:20px 22px;border-bottom:1px solid #e6ece8;align-items:start}.paper:last-child{border-bottom:0}.paper:hover{background:#fafcfb}.choose{width:18px;height:18px;margin:5px 0 0;accent-color:var(--brand)}.paper h2{font-size:16px;line-height:1.6;margin:0 0 6px;font-weight:600}.paper label{cursor:pointer}.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px 12px}.status{font-size:11px;line-height:22px;white-space:nowrap;color:#657570;background:#f0f3f1;border-radius:4px;padding:1px 8px;margin-top:3px}.status:before{content:'○';margin-right:5px}.status.read{color:#42725b;background:#edf5ef}.status.read:before{content:'●';font-size:8px}.status.reading{color:#77652f;background:#f6f2e3}.status.reading:before{content:'◐'}.note{display:flex;align-items:start;gap:7px;font-size:13px;color:var(--muted);margin:9px 0 0;line-height:1.75}.note svg{flex-shrink:0;width:14px;height:14px;margin-top:4px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}.paper.selected{background:#f0f7f3}.paper.selected:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}.export{border:1px solid var(--line);border-radius:11px;background:#fff;padding:22px;position:sticky;top:24px}.export h2{font-size:17px;margin:0 -22px 22px;padding:0 22px 18px;border-bottom:1px solid var(--line);font-weight:600}.selection{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:19px;margin-bottom:20px;border-bottom:1px solid var(--line)}.selection strong{font-size:31px;font-weight:550;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}.selection span{font-size:13px;color:var(--muted);margin-left:5px}.text-button{padding:3px 0;background:none;color:var(--brand);font-size:12px}.text-button:hover{text-decoration:underline}.formats{border:0;padding:0;margin:18px 0}.formats legend{font-size:13px;margin-bottom:10px}.format-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.format-option{border:1px solid var(--line);border-radius:6px;padding:12px 10px;cursor:pointer}.format-option:has(input:checked){border-color:#67988a;background:#f3f8f4}.format-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--brand);margin-bottom:7px}.format-option input{margin:0;width:15px;height:15px;accent-color:var(--brand)}.format-option strong{font-size:13px;font-weight:600}.format-option small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.check-label{display:flex;gap:9px;align-items:center;font-size:13px;cursor:pointer;margin:20px 0 6px}.check-label input{width:17px;height:17px;accent-color:var(--brand)}.privacy{font-size:12px;color:var(--muted);margin:0 0 20px 26px}.primary{background:var(--brand);color:white;border:1px solid var(--brand);border-radius:6px;min-height:45px;padding:11px 16px}.primary:hover:not(:disabled){background:#1b5049}.primary:disabled{background:#dfe8e2;border-color:#dfe8e2;color:#566f62;opacity:1}.export .primary{width:100%}.filename{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}.outside{font-size:12px;color:var(--muted);margin:0 0 18px;line-height:1.6}.feedback{margin-top:16px;padding:12px;background:#edf5ef;border-radius:5px;font-size:13px}.feedback.error{background:#fff0e9;color:#8e3727}.empty{padding:55px 20px;text-align:center}.empty h2{font-size:18px}.empty p{font-size:14px;color:var(--muted)}footer{margin-top:25px;display:flex;gap:20px;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}footer details summary{cursor:pointer}footer details label{display:block;padding-top:10px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}
@media(max-width:950px){.layout{grid-template-columns:minmax(0,1fr) 270px;gap:20px}.paper{grid-template-columns:20px minmax(0,1fr);padding:18px}.paper .status{grid-column:2;justify-self:start;margin-top:-7px}.export{padding:20px}.export h2{margin-inline:-20px;padding-inline:20px}.toolbar{padding-inline:18px}.results{padding-inline:18px}}
@media(max-width:680px){header{height:64px;padding:0 20px}.brand{font-size:21px}.mark{width:29px;height:32px}.private{font-size:12px}main{padding:25px 16px 32px}.page-head{margin-bottom:22px;padding:0 4px;gap:15px;align-items:start}h1{font-size:28px}.total{display:block;text-align:right;white-space:nowrap;padding-top:5px}.total strong{display:block;font-size:36px;margin-bottom:5px}.layout{display:block}.toolbar{padding:16px 14px 12px}.filters{gap:3px;justify-content:space-between}.filters button{padding-inline:10px;min-height:42px}.results{padding-inline:15px}.mobile-jump{display:inline}.paper{padding:17px 14px;gap:10px}.paper h2{font-size:16px}.meta{font-size:12px;gap:4px 10px}.note{font-size:13px}.paper .status{margin-top:-2px}.export{position:static;margin-top:24px;padding:22px}.export h2{margin-inline:-22px;padding-inline:22px}.format-option{padding:13px}.format-option small{font-size:12px}.privacy{font-size:13px}footer{display:block;line-height:1.8;padding-inline:4px}footer details{margin-top:15px}}
</style></head><body>
<header><div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 7h9a4 4 0 0 1 4 4v16a6 6 0 0 0-5-3H5z"/><path d="M18 11a4 4 0 0 1 4-4h5v17h-4a6 6 0 0 0-5 3M9 12h4M9 17h4"/></svg></span>研目</div><span class="private">个人文献库</span></header>
<main><div class="page-head"><div><h1>组会候选</h1></div><span class="total"><strong>06</strong>篇文献</span></div><div class="layout"><section class="library" aria-label="文献清单"><div class="toolbar"><label class="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="sr-only">搜索标题或作者</span><input type="search" id="search" placeholder="搜索标题或作者" autocomplete="off"></label><div class="filters" role="group" aria-label="阅读状态"><button aria-pressed="true" data-filter="全部">全部</button><button aria-pressed="false" data-filter="未读">未读</button><button aria-pressed="false" data-filter="阅读中">阅读中</button><button aria-pressed="false" data-filter="已读">已读</button></div></div><div class="results"><span id="result-count" role="status">显示 6 篇</span><a class="mobile-jump" href="#export-panel" id="mobile-selected">导出设置</a></div><div id="papers"></div><div class="empty" id="empty" hidden><h2>没有匹配的文献</h2><p>试试其他标题或作者。</p><button class="text-button" id="reset">清除搜索与筛选</button></div></section>
<aside id="export-panel" class="export" aria-labelledby="export-title"><h2 id="export-title">导出清单</h2><div class="selection"><div><strong id="selected-count">0</strong><span>篇已选</span></div><button id="clear" class="text-button" disabled>清空</button></div><p class="outside" id="outside" hidden></p><fieldset class="formats"><legend>文件格式</legend><div class="format-options"><label class="format-option"><span class="format-top">.md<input type="radio" name="format" value="md" checked></span><strong>Markdown</strong><small>保留标题与层次</small></label><label class="format-option"><span class="format-top">.txt<input type="radio" name="format" value="txt"></span><strong>纯文本</strong><small>便于复制与粘贴</small></label></div></fieldset><label class="check-label"><input id="include-notes" type="checkbox">包含私人备注</label><p class="privacy">勾选后，备注会随清单一起分享。</p><button class="primary" id="export" disabled>选择文献后导出</button><p class="filename" id="filename">组会候选.md</p><div class="feedback" id="feedback" role="status" hidden></div></aside></div>
<footer><span>示例文献，仅用于本地交互。</span><details><summary>原型状态测试</summary><label><input type="checkbox" id="fail-next"> 下一次导出失败一次</label></details></footer></main>
<script>
const papers=[{id:'P01',title:'长文档摘要中的证据定位',authors:'林知远、赵宁',year:2025,type:'会议论文',state:'已读',note:'组会上讨论如何检查摘要中的每条依据。'},{id:'P02',title:'小样本标注的一致性检查',authors:'陈晓、顾文',year:2024,type:'期刊论文',state:'阅读中',note:'需要补看附录中的标注说明。'},{id:'P03',title:'研究软件的可复现记录',authors:'许禾',year:2026,type:'技术报告',state:'未读',note:'先确认环境记录能否用于自己的项目。'},{id:'P04',title:'跨领域术语表的维护方法',authors:'王景、林知远',year:2023,type:'期刊论文',state:'已读',note:'可作为术语冲突讨论的背景材料。'},{id:'P05',title:'开放数据集的版本追踪',authors:'周简、何安',year:2025,type:'会议论文',state:'未读',note:'和本周的数据整理任务相关。'},{id:'P06',title:'人工评价中的分歧记录',authors:'宋可',year:2026,type:'技术报告',state:'阅读中',note:'重点看如何保存不同判断的理由。'}];
const $=id=>document.getElementById(id),selected=new Set();let filter='全部';
function visible(){let q=$('search').value.trim().toLowerCase();return papers.filter(p=>(filter==='全部'||p.state===filter)&&(!q||(p.title+p.authors).toLowerCase().includes(q)))}
function summary(){let n=selected.size,out=[...selected].filter(id=>!visible().some(p=>p.id===id)).length;$('selected-count').textContent=n;$('clear').disabled=!n;$('export').disabled=!n;$('export').textContent=n?`导出 ${n} 篇文献`:'选择文献后导出';$('outside').hidden=!out;$('outside').textContent=`含当前筛选外的 ${out} 篇文献。`;$('mobile-selected').textContent=n?`已选 ${n} · 导出`:'导出设置';$('filename').textContent='组会候选.'+document.querySelector('input[name=format]:checked').value;}
function render(){const list=visible();$('papers').innerHTML=list.map(p=>`<article class="paper ${selected.has(p.id)?'selected':''}"><input class="choose" type="checkbox" id="select-${p.id}" data-id="${p.id}" ${selected.has(p.id)?'checked':''}><div><h2><label for="select-${p.id}">${p.title}</label></h2><div class="meta"><span>${p.authors}</span><span>${p.year}</span><span>${p.type}</span></div><p class="note"><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M4 3h12v11l-4 3H4zM7 7h6M7 10h5"/></svg><span><span class="sr-only">私人备注：</span>${p.note}</span></p></div><span class="status ${p.state==='已读'?'read':p.state==='阅读中'?'reading':''}">${p.state}</span></article>`).join('');$('result-count').textContent=`显示 ${list.length} 篇`;$('empty').hidden=!!list.length;summary()}
$('papers').addEventListener('change',e=>{if(!e.target.dataset.id)return;let id=e.target.dataset.id;e.target.checked?selected.add(id):selected.delete(id);e.target.closest('.paper').classList.toggle('selected',e.target.checked);$('feedback').hidden=true;summary()});$('search').addEventListener('input',render);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});$('reset').onclick=()=>{$('search').value='';document.querySelector('[data-filter="全部"]').click()};$('clear').onclick=()=>{selected.clear();$('feedback').hidden=true;render()};document.querySelectorAll('input[name=format]').forEach(el=>el.onchange=summary);
$('export').onclick=()=>{if(!selected.size)return;const box=$('feedback');box.hidden=false;if($('fail-next').checked){$('fail-next').checked=false;box.className='feedback error';box.textContent='导出失败，选择与设置已保留。请重试。';$('export').textContent='重试导出';return}const list=papers.filter(p=>selected.has(p.id)),md=document.querySelector('input[name=format]:checked').value==='md',notes=$('include-notes').checked;const text=(md?'# ':'')+'组会候选\n\n'+list.map((p,i)=>(md?'## ':`${i+1}. `)+p.title+'\n\n'+(md?'- ':'')+'作者：'+p.authors+'\n'+(md?'- ':'')+'年份：'+p.year+'\n'+(md?'- ':'')+'类型：'+p.type+(notes?'\n'+(md?'- ':'')+'私人备注：'+p.note:'')).join('\n\n')+'\n';const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='组会候选.'+document.querySelector('input[name=format]:checked').value;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);box.className='feedback';box.textContent='已生成 '+a.download+'，保留当前选择。';summary()};render();
</script></body></html>
