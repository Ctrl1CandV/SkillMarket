<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>组会候选 · 研目</title>
<style>
:root{--bg:#f5f6f2;--paper:#fff;--ink:#253c32;--muted:#637168;--line:#d9e0d7;--brand:#2d5945;--wash:#e9efe5;--serif:"Songti SC",SimSun,serif;--sans:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);line-break:strict;text-autospace:normal}button,input,select{font:inherit}button,a{color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #668d72;outline-offset:4px}a{text-underline-offset:4px}button{border:0}header{height:70px;border-bottom:1px solid var(--line);padding:0 max(28px,calc((100% - 1160px)/2));display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:650;letter-spacing:.04em}.mark{width:29px;height:30px;background:var(--brand);color:white;display:grid;place-items:center;border-radius:5px;font:24px/1 var(--serif)}.private{font-size:13px;color:var(--muted)}main{max-width:1216px;margin:auto;padding:46px 28px 60px}.page-head{display:flex;align-items:baseline;gap:18px;margin-bottom:32px}h1{font-size:32px;letter-spacing:-.035em;font-weight:600;line-height:1.3;margin:0}.total{font-size:14px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:44px;align-items:start}.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px}.search{flex:1 1 240px;position:relative}.search:before{content:'⌕';position:absolute;left:13px;top:5px;font-size:25px;color:var(--muted)}input[type=search]{width:100%;padding:10px 12px 10px 40px;min-height:44px;border:1px solid #b8c6b9;border-radius:6px;background:white;color:var(--ink)}.filters{display:flex;gap:3px}.filters button{background:none;color:var(--muted);padding:8px 10px;border-radius:5px;font-size:14px;min-height:42px}.filters button[aria-pressed=true]{background:var(--wash);color:var(--brand);font-weight:600}.results{color:var(--muted);font-size:13px;margin:20px 0 1px;display:flex;align-items:center;justify-content:space-between}.mobile-jump{display:none}.paper{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:13px;padding:24px 0;border-bottom:1px solid var(--line);align-items:start}.choose{width:19px;height:19px;margin:5px 0 0;accent-color:var(--brand)}.paper h2{font-size:17px;line-height:1.5;margin:0 0 8px;font-weight:600}.paper label{cursor:pointer}.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 15px}.status{font-size:12px;line-height:27px;white-space:nowrap;color:var(--muted)}.status:before{content:'○';margin-right:6px;color:var(--brand)}.status.read:before{content:'●'}.status.reading:before{content:'◐'}.note{font-size:13px;color:var(--muted);margin-top:10px}.note summary{cursor:pointer;width:fit-content;list-style:none}.note summary:after{content:'⌄';margin-left:7px}.note[open] summary:after{content:'⌃'}.note p{margin:8px 0 0;max-width:40em}.paper.selected{background:#e9efe552;box-shadow:-12px 0 #e9efe552,12px 0 #e9efe552}.export{border:1px solid var(--line);border-radius:8px;background:#fff;padding:24px;position:sticky;top:24px}.export h2{font-size:17px;margin:0 0 24px;font-weight:600}.selection{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:20px;margin-bottom:22px;border-bottom:1px solid var(--line)}.selection strong{font-size:34px;font-weight:450;line-height:1}.selection span{font-size:13px;color:var(--muted);margin-left:5px}.text-button{padding:3px 0;background:none;color:var(--muted);font-size:13px}.text-button:hover{color:var(--brand);text-decoration:underline}.control{display:block;font-size:13px;margin:18px 0}.control>span{display:block;margin-bottom:8px}select{width:100%;background:white;color:var(--ink);border:1px solid #b8c6b9;border-radius:5px;padding:10px}.check-label{display:flex;gap:9px;align-items:center;font-size:14px;cursor:pointer;margin:19px 0 8px}.check-label input{width:17px;height:17px;accent-color:var(--brand)}.privacy{font-size:12px;color:var(--muted);margin:0 0 22px 26px}.primary{background:var(--brand);color:white;border:1px solid var(--brand);border-radius:5px;min-height:44px;padding:11px 16px}.primary:hover{background:#244835}.export .primary{width:100%}.filename{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}.outside{font-size:12px;color:var(--muted);margin:0 0 18px;line-height:1.6}.feedback{margin-top:16px;padding:12px;background:#edf2e9;border-radius:4px;font-size:13px}.feedback.error{background:#fff0e9;color:#8e3727}.empty{padding:65px 20px;text-align:center}.empty h2{font-size:19px}.empty p{font-size:14px;color:var(--muted)}footer{margin-top:36px;display:flex;gap:20px;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}footer details summary{cursor:pointer}footer details label{display:block;padding-top:10px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}
@media(max-width:850px){.layout{gap:28px;grid-template-columns:minmax(0,1fr) 250px}.export{padding:20px}.toolbar{display:block}.filters{margin-top:10px}.private{font-size:12px}}
@media(max-width:620px){header{height:62px;padding:0 20px}.brand{font-size:20px}.private{font-size:11px}main{padding:30px 20px 36px}.page-head{margin-bottom:24px}h1{font-size:28px}.layout{display:block}.toolbar{padding-bottom:15px}.filters{justify-content:space-between}.filters button{font-size:14px;padding-inline:12px}.mobile-jump{display:inline;font-size:12px}.paper{grid-template-columns:23px minmax(0,1fr);gap:10px;padding:21px 0}.paper h2{font-size:16px}.paper .status{grid-column:2;margin-top:-4px;line-height:1.4}.paper .meta{font-size:13px}.export{position:static;margin-top:32px;padding:22px}.export h2{margin-bottom:20px}.selection{margin-bottom:20px;padding-bottom:20px}.privacy{font-size:13px}footer{display:block;line-height:1.8}footer details{margin-top:15px}}
</style></head><body>
<header><div class="brand"><span class="mark" aria-hidden="true">◫</span>研目</div><span class="private">个人文献库</span></header>
<main><div class="page-head"><h1>组会候选</h1><span class="total">6 篇文献</span></div><div class="layout"><section aria-label="文献清单"><div class="toolbar"><label class="search"><span class="sr-only">搜索标题或作者</span><input type="search" id="search" placeholder="搜索标题或作者" autocomplete="off"></label><div class="filters" role="group" aria-label="阅读状态"><button aria-pressed="true" data-filter="全部">全部</button><button aria-pressed="false" data-filter="未读">未读</button><button aria-pressed="false" data-filter="阅读中">阅读中</button><button aria-pressed="false" data-filter="已读">已读</button></div></div><div class="results"><span id="result-count" role="status">显示 6 篇</span><a class="mobile-jump" href="#export-panel" id="mobile-selected">导出设置</a></div><div id="papers"></div><div class="empty" id="empty" hidden><h2>没有匹配的文献</h2><p>试试其他标题或作者。</p><button class="text-button" id="reset">清除搜索与筛选</button></div></section>
<aside id="export-panel" class="export" aria-labelledby="export-title"><h2 id="export-title">导出清单</h2><div class="selection"><div><strong id="selected-count">0</strong><span>篇已选</span></div><button id="clear" class="text-button" disabled>清空</button></div><p class="outside" id="outside" hidden></p><label class="control"><span>文件格式</span><select id="format"><option value="md">Markdown · .md</option><option value="txt">纯文本 · .txt</option></select></label><label class="check-label"><input id="include-notes" type="checkbox">包含私人备注</label><p class="privacy">备注会随清单一同分享。</p><button class="primary" id="export" disabled>选择文献后导出</button><p class="filename" id="filename">组会候选.md</p><div class="feedback" id="feedback" role="status" hidden></div></aside></div>
<footer><span>示例文献，仅用于本地交互。</span><details><summary>原型状态测试</summary><label><input type="checkbox" id="fail-next"> 下一次导出失败一次</label></details></footer></main>
<script>
const papers=[{id:'P01',title:'长文档摘要中的证据定位',authors:'林知远、赵宁',year:2025,type:'会议论文',state:'已读',note:'组会上讨论如何检查摘要中的每条依据。'},{id:'P02',title:'小样本标注的一致性检查',authors:'陈晓、顾文',year:2024,type:'期刊论文',state:'阅读中',note:'需要补看附录中的标注说明。'},{id:'P03',title:'研究软件的可复现记录',authors:'许禾',year:2026,type:'技术报告',state:'未读',note:'先确认环境记录能否用于自己的项目。'},{id:'P04',title:'跨领域术语表的维护方法',authors:'王景、林知远',year:2023,type:'期刊论文',state:'已读',note:'可作为术语冲突讨论的背景材料。'},{id:'P05',title:'开放数据集的版本追踪',authors:'周简、何安',year:2025,type:'会议论文',state:'未读',note:'和本周的数据整理任务相关。'},{id:'P06',title:'人工评价中的分歧记录',authors:'宋可',year:2026,type:'技术报告',state:'阅读中',note:'重点看如何保存不同判断的理由。'}];
const $=id=>document.getElementById(id),selected=new Set();let filter='全部';
function visible(){let q=$('search').value.trim().toLowerCase();return papers.filter(p=>(filter==='全部'||p.state===filter)&&(!q||(p.title+p.authors).toLowerCase().includes(q)))}
function summary(){let n=selected.size,out=[...selected].filter(id=>!visible().some(p=>p.id===id)).length;$('selected-count').textContent=n;$('clear').disabled=!n;$('export').disabled=!n;$('export').textContent=n?`导出 ${n} 篇文献`:'选择文献后导出';$('outside').hidden=!out;$('outside').textContent=`含当前筛选外的 ${out} 篇文献。`;$('mobile-selected').textContent=n?`已选 ${n} · 导出`:'导出设置';$('filename').textContent='组会候选.'+$('format').value;}
function render(){const list=visible();$('papers').innerHTML=list.map(p=>`<article class="paper ${selected.has(p.id)?'selected':''}"><input class="choose" type="checkbox" id="select-${p.id}" data-id="${p.id}" ${selected.has(p.id)?'checked':''}><div><h2><label for="select-${p.id}">${p.title}</label></h2><div class="meta"><span>${p.authors}</span><span>${p.year}</span><span>${p.type}</span></div><details class="note"><summary>私人备注</summary><p>${p.note}</p></details></div><span class="status ${p.state==='已读'?'read':p.state==='阅读中'?'reading':''}">${p.state}</span></article>`).join('');$('result-count').textContent=`显示 ${list.length} 篇`;$('empty').hidden=!!list.length;summary()}
$('papers').addEventListener('change',e=>{if(!e.target.dataset.id)return;let id=e.target.dataset.id;e.target.checked?selected.add(id):selected.delete(id);e.target.closest('.paper').classList.toggle('selected',e.target.checked);$('feedback').hidden=true;summary()});$('search').addEventListener('input',render);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});$('reset').onclick=()=>{$('search').value='';document.querySelector('[data-filter="全部"]').click()};$('clear').onclick=()=>{selected.clear();$('feedback').hidden=true;render()};$('format').onchange=summary;
$('export').onclick=()=>{if(!selected.size)return;const box=$('feedback');box.hidden=false;if($('fail-next').checked){$('fail-next').checked=false;box.className='feedback error';box.textContent='导出失败，选择与设置已保留。请重试。';$('export').textContent='重试导出';return}const list=papers.filter(p=>selected.has(p.id)),md=$('format').value==='md',notes=$('include-notes').checked;const text=(md?'# ':'')+'组会候选\n\n'+list.map((p,i)=>(md?'## ':`${i+1}. `)+p.title+'\n\n'+(md?'- ':'')+'作者：'+p.authors+'\n'+(md?'- ':'')+'年份：'+p.year+'\n'+(md?'- ':'')+'类型：'+p.type+(notes?'\n'+(md?'- ':'')+'私人备注：'+p.note:'')).join('\n\n')+'\n';const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='组会候选.'+$('format').value;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);box.className='feedback';box.textContent='已生成 '+a.download+'，保留当前选择。';summary()};render();
</script></body></html>
