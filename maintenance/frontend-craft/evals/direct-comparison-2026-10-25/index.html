<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>frontend-craft · 新旧页面对照</title><style>
:root{--ink:#29352f;--muted:#68736b;--line:#d6dcd4;--bg:#edf0ea;--white:#fafbf8;--active:#2b4d3b}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,a,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #6b8c75;outline-offset:3px}.app{min-height:100dvh;display:grid;grid-template-columns:196px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100dvh;background:var(--white);border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column}.logo{font-weight:650;font-size:16px;letter-spacing:-.02em;margin-bottom:5px}.subtitle{font-size:12px;color:var(--muted);margin:0 0 35px}.tasks{display:grid;gap:8px}.task{border:0;background:none;text-align:left;padding:12px 10px;border-radius:6px;line-height:1.7;font-size:13px}.task small{display:block;color:var(--muted);font-size:11px}.task[aria-pressed=true]{background:#e5ece1;color:#234831}.sidebar-footer{margin-top:auto;padding-top:40px;font-size:11px;color:var(--muted)}.sidebar-footer a{display:block;margin-top:8px;text-underline-offset:4px}.content{min-width:0;display:flex;flex-direction:column}.toolbar{position:sticky;top:0;z-index:5;padding:20px 26px 15px;display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--white);border-bottom:1px solid var(--line);flex-wrap:wrap}.versions{display:flex;gap:4px;padding:4px;background:#e9ede6;border-radius:7px}.versions button{background:none;border:0;border-radius:5px;padding:8px 14px;font-size:13px}.versions button[aria-pressed=true]{background:white;box-shadow:0 1px 4px #1a2f1c12;color:#244c34;font-weight:600}.options{display:flex;gap:12px;align-items:center;font-size:12px}.options select{border:1px solid var(--line);border-radius:5px;padding:8px;background:white;font-size:12px}.open{font-size:12px;text-underline-offset:5px}.brief{padding:13px 26px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;background:#f3f5ef}.brief strong{color:var(--ink);font-weight:500;margin-right:14px}.stage{padding:22px 20px 28px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start;flex:1}.stage.pair{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{min-width:0;display:flex;flex-direction:column;align-items:center}.panel-head{width:100%;font-size:12px;padding:0 0 10px;display:flex;justify-content:space-between;color:var(--muted)}.panel-head strong{color:var(--ink);font-weight:500}.panel-head a{color:var(--muted)}.frame-outer{width:100%;position:relative;overflow:hidden;background:white;border:1px solid #cfd6cb;box-shadow:0 8px 25px #23352909}.frame-inner{position:absolute;top:0;left:0;transform-origin:top left}iframe{border:0;display:block;background:white}.review-note{margin:0;padding:10px 26px 20px;font-size:11px;color:var(--muted)}.review-note summary{cursor:pointer}.review-note p{max-width:900px;line-height:1.8;margin:8px 0 0}[hidden]{display:none!important}@media(max-width:800px){.app{display:block}.sidebar{position:static;height:auto;padding:15px 18px 12px;border-right:0;border-bottom:1px solid var(--line);display:block}.logo{font-size:14px}.subtitle{display:none}.tasks{display:flex;gap:5px;margin-top:10px}.task{padding:8px 10px;font-size:12px}.task small{display:none}.sidebar-footer{display:none}.toolbar{position:sticky;top:0;z-index:5;padding:13px 18px;gap:12px}.versions button{padding:8px 9px;font-size:12px}.options{gap:8px}.brief{padding:10px 18px;font-size:11px}.stage{padding:15px 10px 20px}.stage.pair{grid-template-columns:1fr}.panel-head{padding-inline:4px}.review-note{padding-inline:18px}.open{font-size:11px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo">frontend-craft</div><p class="subtitle">新旧页面直接对照</p><nav class="tasks" aria-label="选择页面"><button class="task" data-task="reader" aria-pressed="true">阅读与 AI 问答<small>范围、对话、连接设置</small></button><button class="task" data-task="research" aria-pressed="false">文献清单<small>检索、选择、导出</small></button><button class="task" data-task="exhibition" aria-pressed="false">光经过纸面<small>作品、详情、到访</small></button></nav><div class="sidebar-footer">旧版 0.3.3<br>新版 0.4.0 · 反馈修订<a href="README.md" target="_blank" rel="noopener">制作说明</a></div></aside><main class="content"><header class="toolbar"><div class="versions" role="group" aria-label="对照方式"><button data-view="old" aria-pressed="false">旧版 · 0.3.3</button><button data-view="new" aria-pressed="true">新版 · 本轮修订</button><button data-view="pair" aria-pressed="false">并排</button></div><div class="options"><label><span class="sr-only">视口 </span><select id="size" aria-label="视口尺寸"><option value="desktop">桌面 · 1280</option><option value="mobile">手机 · 390</option></select></label><a class="open" id="open-current" href="new/reader.html" target="_blank" rel="noopener">独立打开 ↗</a></div></header><div class="brief"><strong id="task-name">阅读与 AI 问答</strong><span id="task-description">同一篇导读、两种阅读范围和连接设置。连接与回答均为本地模拟。</span></div><div class="stage" id="stage"><section class="panel" id="old-panel" hidden><div class="panel-head"><strong>旧 Skill · 0.3.3</strong><a id="old-link" href="old/reader.html" target="_blank" rel="noopener">原尺寸打开 ↗</a></div><div class="frame-outer"><div class="frame-inner"><iframe id="old-frame" src="old/reader.html" title="旧 Skill 页面"></iframe></div></div></section><section class="panel" id="new-panel"><div class="panel-head"><strong>新版 · 根据反馈修订</strong><a id="new-link" href="new/reader.html" target="_blank" rel="noopener">原尺寸打开 ↗</a></div><div class="frame-outer"><div class="frame-inner"><iframe id="new-frame" src="new/reader.html" title="新 Skill 页面"></iframe></div></div></section></div><details class="review-note"><summary>对照说明</summary><p>旧版沿用此前冻结的原始页面，新版根据你的反馈与修订后的 Skill 调整；需求和必要功能相同，展览三幅作品图完整沿用旧版。这里用于直接看页面与操作，不是独立重复实验。并排预览会缩放，判断小字请切到单页或原尺寸打开。</p></details></main></div><script>
const tasks={reader:{title:'阅读与 AI 问答',description:'同一篇导读、两种阅读范围和连接设置。连接与回答均为本地模拟。'},research:{title:'组会候选 · 文献清单',description:'同样的六条记录，搜索与筛选保留已选项，可导出 Markdown 或纯文本。'},exhibition:{title:'光经过纸面 · 作品展',description:'同一展览信息、同样三幅作品图。点击作品可查看大图，下方有到访信息。'}};let task='reader',view='new';const $=id=>document.getElementById(id);function resize(){let mobile=$('size').value==='mobile',w=mobile?390:1280,h=mobile?844:820;document.querySelectorAll('.panel').forEach(p=>{if(p.hidden)return;const outer=p.querySelector('.frame-outer'),inner=p.querySelector('.frame-inner'),frame=p.querySelector('iframe'),available=p.clientWidth,scale=Math.min(1,available/w);outer.style.width=(w*scale)+'px';outer.style.height=(h*scale)+'px';inner.style.width=w+'px';inner.style.height=h+'px';inner.style.transform=`scale(${scale})`;frame.style.width=w+'px';frame.style.height=h+'px'})}function update(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));$('stage').classList.toggle('pair',view==='pair');$('old-panel').hidden=view==='new';$('new-panel').hidden=view==='old';$('open-current').href=(view==='old'?'old':'new')+'/'+task+'.html';requestAnimationFrame(resize)}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;update()});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{if(task===b.dataset.task)return;task=b.dataset.task;window.scrollTo(0,0);document.querySelectorAll('[data-task]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('task-name').textContent=tasks[task].title;$('task-description').textContent=tasks[task].description;['old','new'].forEach(v=>{$(v+'-frame').src=v+'/'+task+'.html';$(v+'-link').href=v+'/'+task+'.html'});update()});$('size').onchange=resize;new ResizeObserver(resize).observe($('stage'));update();
</script></body></html>
