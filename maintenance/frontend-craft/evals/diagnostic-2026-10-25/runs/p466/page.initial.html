<dialog id="detail" aria-labelledby="detail-title" aria-describedby="detail-description"><div class="dialog-top"><span class="dialog-index" id="detail-index"></span><button type="button" class="close-button" id="close-detail" autofocus>关闭<span aria-hidden="true">×</span></button></div><div class="dialog-body"><div class="dialog-art"><img id="detail-image" alt=""></div><div class="dialog-copy"><h2 id="detail-title"></h2><p class="metadata"><span id="detail-year"></span><span class="slash">/</span>数字构成</p><p class="description" id="detail-description"></p><button type="button" class="save-button dialog-save" id="detail-save" aria-pressed="false"><svg class="bookmark" viewBox="0 0 16 20" aria-hidden="true"><path d="M3 2h10v16l-5-3-5 3Z"/></svg><span>收藏作品</span></button><p class="dialog-hint">收藏仅保留至刷新页面</p></div></div></dialog>
<script>
'use strict';
const works=[
 {title:'折线',year:'2026',description:'两次折叠形成不同朝向的纸面，斜向光线穿过它们。'},
 {title:'留白',year:'2026',description:'两张纸之间的间隙成为观看的对象。'},
 {title:'余温',year:'2025',description:'暗面边缘的一段颜色沿纸面逐渐减弱。'}
];
const saved=new Set();
let filter='all',current=null,opener=null;
const el=id=>document.getElementById(id);
const dialog=el('detail');
function updateSaveButton(button,index,isDetail=false){
 const active=saved.has(index);
 button.setAttribute('aria-pressed',String(active));
 button.setAttribute('aria-label',(active?'取消收藏':'收藏')+'《'+works[index].title+'》');
 button.querySelector('span').textContent=active?'已收藏':(isDetail?'收藏作品':'收藏');
}
function refresh(){
 el('saved-count').textContent=String(saved.size);
 el('gallery').classList.toggle('is-saved',filter==='saved');
 el('all-filter').setAttribute('aria-pressed',String(filter==='all'));
 el('saved-filter').setAttribute('aria-pressed',String(filter==='saved'));
 document.querySelectorAll('[data-work]').forEach(card=>{card.hidden=filter==='saved'&&!saved.has(Number(card.dataset.work));});
 document.querySelectorAll('[data-save]').forEach(button=>updateSaveButton(button,Number(button.dataset.save)));
 const empty=filter==='saved'&&saved.size===0;
 el('gallery').hidden=empty;
 el('empty').hidden=!empty;
 if(current!==null)updateSaveButton(el('detail-save'),current,true);
}
function changeFilter(value){
 filter=value;refresh();
 el('status').textContent=value==='all'?'显示全部 3 件作品':'显示已收藏的 '+saved.size+' 件作品';
}
function toggleSave(index){
 const removed=saved.has(index);
 if(removed)saved.delete(index);else saved.add(index);
 refresh();
 el('status').textContent='《'+works[index].title+'》'+(removed?'已取消收藏':'已收藏')+'，共收藏 '+saved.size+' 件作品。';
 if(removed&&filter==='saved'&&!dialog.open)el('saved-filter').focus();
}
function openWork(index,trigger){
 const work=works[index];current=index;opener=trigger;
 el('detail-title').textContent=work.title;
 el('detail-year').textContent=work.year;
 el('detail-description').textContent=work.description;
 el('detail-index').textContent=String(index+1).padStart(2,'0')+' / 03';
 el('detail-image').src=el('image-'+index).src;
 el('detail-image').alt=el('image-'+index).alt;
 updateSaveButton(el('detail-save'),index,true);
 dialog.showModal();document.body.classList.add('scroll-locked');
 dialog.scrollTop=0;el('close-detail').focus();
}
document.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>openWork(Number(button.dataset.open),button)));
document.querySelectorAll('[data-save]').forEach(button=>button.addEventListener('click',()=>toggleSave(Number(button.dataset.save))));
el('all-filter').addEventListener('click',()=>changeFilter('all'));
el('saved-filter').addEventListener('click',()=>changeFilter('saved'));
el('return-all').addEventListener('click',()=>{changeFilter('all');el('all-filter').focus();});
el('detail-save').addEventListener('click',()=>{if(current!==null)toggleSave(current);});
el('close-detail').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const box=dialog.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)dialog.close();}});
dialog.addEventListener('close',()=>{document.body.classList.remove('scroll-locked');current=null;const card=opener&&opener.closest('[data-work]');if(opener&&card&&!card.hidden)opener.focus();else el(filter==='all'?'all-filter':'saved-filter').focus();});
refresh();
</script>
</body>
