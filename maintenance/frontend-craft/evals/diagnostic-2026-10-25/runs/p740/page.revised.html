const saved = new Set();
const gallery = document.getElementById('gallery');
const dialog = document.getElementById('art-dialog');
const allFilter = document.getElementById('filter-all');
const savedFilter = document.getElementById('filter-saved');
const status = document.getElementById('status');
const bookmark = '<svg viewBox="0 0 16 20" aria-hidden="true"><path d="M3 2h10v16l-5-3-5 3Z" stroke-linejoin="round"/></svg>';
let filter = 'all';
let current = 0;
let opener = null;
const twoDigits = number => String(number).padStart(2, '0');
function announce(message) { status.textContent = message; if (dialog.open) document.getElementById('detail-status').textContent = message; }
function saveLabel(art) { return saved.has(art.id) ? '已收藏' : '收藏'; }
function updateCounts() {
  document.getElementById('saved-count').textContent = twoDigits(saved.size);
  savedFilter.setAttribute('aria-label', `已收藏，${saved.size} 件作品`);
  allFilter.setAttribute('aria-pressed', String(filter === 'all'));
  savedFilter.setAttribute('aria-pressed', String(filter === 'saved'));
}
function renderGallery() {
  const visible = artworks.filter(art => filter === 'all' || saved.has(art.id));
  gallery.innerHTML = visible.length ? visible.map(art => {
    const index = artworks.indexOf(art);
    return `<article class="work" data-id="${art.id}"><button class="art-button" id="open-${art.id}" type="button" data-open="${index}" aria-label="查看《${art.title}》大图与详情"><img class="art-image" src="${art.image}" width="${art.width}" height="${art.height}" alt="${art.title}：${art.description}"></button><div class="caption"><div class="title-group"><span class="art-index" aria-hidden="true">${twoDigits(index + 1)}</span><h2>${art.title}</h2></div><button class="save" id="save-${art.id}" type="button" data-save="${index}" aria-pressed="${saved.has(art.id)}" aria-label="${saved.has(art.id) ? '取消收藏' : '收藏'}《${art.title}》">${bookmark}<span>${saveLabel(art)}</span></button></div><p class="work-meta"><span>${art.year}</span><span>${art.medium}</span></p><p class="work-description">${art.description}</p></article>`;
  }).join('') : `<div class="empty"><div class="empty-symbol" aria-hidden="true">${bookmark}</div><h2>还没有收藏作品</h2><p>挑选想在选题会上讨论的作品。</p><button class="primary" id="browse-all" type="button">浏览全部作品 <span aria-hidden="true">→</span></button></div>`;
  updateCounts();
}
function setFilter(value) {
  filter = value;
  renderGallery();
  announce(value === 'all' ? '已显示全部 3 件作品。' : `已显示收藏，共 ${saved.size} 件作品。`);
}
function updateDetail() {
  const art = artworks[current];
  const image = document.getElementById('detail-image');
  image.src = art.image;
  image.alt = `${art.title}：${art.description}`;
  image.width = art.width;
  image.height = art.height;
  document.getElementById('detail-title').textContent = art.title;
  document.getElementById('detail-index').textContent = `${twoDigits(current + 1)} / ${twoDigits(artworks.length)}`;
  document.getElementById('detail-year').textContent = art.year;
  document.getElementById('detail-medium').textContent = art.medium;
  document.getElementById('detail-description').textContent = art.description;
  const button = document.getElementById('detail-save');
  button.innerHTML = `${bookmark}<span>${saved.has(art.id) ? '已收藏 · 取消收藏' : '收藏这件作品'}</span>`;
  button.setAttribute('aria-pressed', String(saved.has(art.id)));
  button.setAttribute('aria-label', `${saved.has(art.id) ? '取消收藏' : '收藏'}《${art.title}》`);
}
function toggleSave(index, origin) {
  const art = artworks[index];
  if (saved.has(art.id)) saved.delete(art.id); else saved.add(art.id);
  renderGallery();
  if (dialog.open) updateDetail();
  if (origin === 'gallery') {
    const target = document.getElementById(`save-${art.id}`) || gallery.querySelector('[data-save]') || document.getElementById('browse-all');
    if (target) target.focus();
  }
  announce(`${saved.has(art.id) ? '已收藏' : '已取消收藏'}《${art.title}》，共收藏 ${saved.size} 件作品。`);
}
function openWork(index, trigger) {
  current = index;
  opener = trigger.id;
  updateDetail();
  dialog.showModal();
  document.body.style.overflow = 'hidden';
}
gallery.addEventListener('click', event => {
  const openButton = event.target.closest('[data-open]');
  const saveButton = event.target.closest('[data-save]');
  if (openButton) openWork(Number(openButton.dataset.open), openButton);
  else if (saveButton) toggleSave(Number(saveButton.dataset.save), 'gallery');
  else if (event.target.closest('#browse-all')) { setFilter('all'); allFilter.focus(); }
});
allFilter.addEventListener('click', () => setFilter('all'));
savedFilter.addEventListener('click', () => setFilter('saved'));
document.getElementById('detail-save').addEventListener('click', () => toggleSave(current, 'dialog'));
document.getElementById('close-dialog').addEventListener('click', () => dialog.close());
dialog.addEventListener('close', () => {
  document.body.style.overflow = '';
  const target = document.getElementById(opener) || (filter === 'saved' ? savedFilter : allFilter);
  target.focus();
});
dialog.addEventListener('click', event => {
  if (event.target !== dialog) return;
  const rect = dialog.getBoundingClientRect();
  if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
});
function stepWork(delta) {
  current = (current + delta + artworks.length) % artworks.length;
  updateDetail();
  announce(`正在查看《${artworks[current].title}》，第 ${current + 1} 件，共 3 件作品。`);
}
document.getElementById('previous-work').addEventListener('click', () => stepWork(-1));
document.getElementById('next-work').addEventListener('click', () => stepWork(1));
renderGallery();
</script>
</body>
</html>
