ck;margin-top:6px}.sidebar-note{padding-left:4px;padding-right:4px}.acceptance{margin-left:4px;margin-right:4px}}

<body>
<header><div class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 7h9a4 4 0 0 1 4 4v16a6 6 0 0 0-5-3H5z"/><path d="M18 11a4 4 0 0 1 4-4h5v17h-4a6 6 0 0 0-5 3M9 12h4M9 17h4"/></svg></span>研目</div><div class="top-context">我的文献 / 文献清单</div><div class="session"><span class="session-dot"></span>本地会话</div></div></header>
<main>
<section class="page-heading" aria-labelledby="page-title"><div><div class="eyebrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h5l3 3h8a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>我的集合</div><h1 id="page-title">组会候选</h1><p class="intro">选好要讨论的文献，把清单分享给同学。</p></div><div class="collection-count"><strong>06</strong><span>篇文献记录<br><span class="types">3 种文献类型</span></span></div></section>
<div class="workspace">
<section class="library" aria-label="文献列表">
<div class="toolbar"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="sr-only">搜索标题或作者</span><input id="search" type="search" placeholder="搜索标题或作者" autocomplete="off"></label><div class="filter-row"><div class="filters" role="group" aria-label="按阅读状态筛选"><button class="filter" type="button" data-filter="全部" aria-pressed="true">全部<span class="filter-count">6</span></button><button class="filter" type="button" data-filter="未读" aria-pressed="false">未读<span class="filter-count">2</span></button><button class="filter" type="button" data-filter="阅读中" aria-pressed="false">阅读中<span class="filter-count">2</span></button><button class="filter" type="button" data-filter="已读" aria-pressed="false">已读<span class="filter-count">2</span></button></div><span id="result-count" class="result-count" role="status">显示 6 篇</span></div></div>
<div class="list-caption"><span>选择文献 · 按记录顺序排列</span><span>阅读状态</span></div>
<div id="papers"></div>
<div id="empty" class="empty" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m14.5 14.5 5 5M7 10h6"/></svg><h3>没有找到匹配的文献</h3><p>换个关键词，或查看全部阅读状态。</p><button id="reset-filters" class="text-button" type="button">清除搜索与筛选</button></div>
</section>

<div class="selection-wrap"><div class="selection-summary"><div class="selection-number">已选 <strong id="selected-count">0</strong> 篇</div><button id="clear-selection" class="text-button" type="button" disabled>清空选择</button></div><p class="scope" id="selection-scope" role="status">在左侧勾选文献，开始准备清单。</p></div>
<hr class="export-divider">
<fieldset><legend>文件格式</legend><div class="formats"><label class="format"><span class="format-top"><span>.md</span><input type="radio" name="format" value="md" checked></span><span class="format-name">Markdown</span><span class="format-desc">保留标题与层次</span></label><label class="format"><span class="format-top"><span>.txt</span><input type="radio" name="format" value="txt"></span><span class="format-name">纯文本</span><span class="format-desc">便于复制与粘贴</span></label></div></fieldset>
<div class="export-options"><label class="include-note"><input id="include-notes" type="checkbox"><span><strong>包含私人备注</strong><small>勾选后，备注会随清单一起分享。</small></span></label></div>
<div class="file-preview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3H6v18h12V8zM13 3v5h5"/></svg><span id="filename">组会候选.md</span></div>

<script>
'use strict';
const records = [
{id:'P01',title:'长文档摘要中的证据定位',authors:'林知远、赵宁',year:2025,type:'会议论文',status:'已读',note:'组会上讨论如何检查摘要中的每条依据。'},
{id:'P02',title:'小样本标注的一致性检查',authors:'陈晓、顾文',year:2024,type:'期刊论文',status:'阅读中',note:'需要补看附录中的标注说明。'},
{id:'P03',title:'研究软件的可复现记录',authors:'许禾',year:2026,type:'技术报告',status:'未读',note:'先确认环境记录能否用于自己的项目。'},
{id:'P04',title:'跨领域术语表的维护方法',authors:'王景、林知远',year:2023,type:'期刊论文',status:'已读',note:'可作为术语冲突讨论的背景材料。'},
{id:'P05',title:'开放数据集的版本追踪',authors:'周简、何安',year:2025,type:'会议论文',status:'未读',note:'和本周的数据整理任务相关。'},
{id:'P06',title:'人工评价中的分歧记录',authors:'宋可',year:2026,type:'技术报告',status:'阅读中',note:'重点看如何保存不同判断的理由。'}
];
const state = {selected:new Set(),filter:'全部',query:'',format:'md',notes:false,failNext:false,failed:false};
const $ = id => document.getElementById(id);
const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
function visibleRecords(){const query=state.query.trim().toLocaleLowerCase();return records.filter(record=>(state.filter==='全部'||record.status===state.filter)&&(!query||record.title.toLocaleLowerCase().includes(query)||record.authors.toLocaleLowerCase().includes(query)));}
function selectedRecords(){return records.filter(record=>state.selected.has(record.id));}
function renderList(){
 const visible=visibleRecords();
 $('papers').innerHTML=visible.map(record=>`<article class="paper${state.selected.has(record.id)?' selected':''}" data-id="${record.id}"><label class="paper-label"><input class="paper-check" type="checkbox" value="${record.id}" ${state.selected.has(record.id)?'checked':''} aria-label="选择文献：${escapeHtml(record.title)}"><span class="paper-content"><span class="paper-title">${escapeHtml(record.title)}</span><span class="paper-meta"><span>${escapeHtml(record.authors)}</span><span class="sep" aria-hidden="true"></span><span>${record.year}</span><span class="sep" aria-hidden="true"></span><span>${record.type}</span><span class="paper-id">${record.id}</span></span><span class="paper-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v12H9l-5 4zM8 9h8M8 13h5"/></svg><span><span class="sr-only">私人备注：</span>${escapeHtml(record.note)}</span></span></span><span class="status status-${record.status==='已读'?'read':record.status==='阅读中'?'reading':'unread'}">${record.status}</span></label></article>`).join('');
 $('empty').hidden=visible.length>0;$('result-count').textContent=`显示 ${visible.length} 篇`;
 document.querySelectorAll('.filter').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.filter===state.filter)));
 updateSelection();
}
function updateSelection(){
 const count=state.selected.size;const visibleIds=new Set(visibleRecords().map(record=>record.id));const outside=selectedRecords().filter(record=>!visibleIds.has(record.id)).length;
 $('selected-count').textContent=count;$('clear-selection').disabled=count===0;$('export').disabled=count===0;
 $('selection-scope').textContent=count===0?'勾选文献，开始准备清单。':outside?`将导出全部 ${count} 篇，含当前筛选之外的 ${outside} 篇。`:`将导出全部 ${count} 篇；更改筛选会保留选择。`;
 $('export-hint').textContent=count===0?'请先选择至少一篇文献':'按原始记录顺序导出';
}
function buildExport(items,format,includeNotes){
 if(format==='md')return '# 组会候选\n\n'+items.map(record=>`## ${record.title}\n\n- 作者：${record.authors}\n- 年份：${record.year}\n- 类型：${record.type}${includeNotes?`\n- 私人备注：${record.note}`:''}`).join('\n\n')+'\n';
 return '组会候选\n\n'+items.map((record,index)=>`${index+1}. ${record.title}\n作者：${record.authors}\n年份：${record.year}\n类型：${record.type}${includeNotes?`\n私人备注：${record.note}`:''}`).join('\n\n')+'\n';
}
function showFeedback(type,title,description){const box=$('feedback');box.hidden=false;box.className=`feedback ${type}`;box.setAttribute('role',type==='error'?'alert':'status');box.innerHTML=`<strong>${escapeHtml(title)}</strong>${escapeHtml(description)}`;}
function downloadFile(content,format){const blob=new Blob(['\uFEFF',content],{type:format==='md'?'text/markdown;charset=utf-8':'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`组会候选.${format}`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportSelection(){
 if(state.selected.size===0)return;
 if(state.failNext){state.failNext=false;state.failed=true;$('arm-failure').disabled=false;$('failure-status').textContent='已触发一次失败。重试将正常生成文件。';$('export-label').textContent='重试导出';showFeedback('error','这次导出未完成','文件尚未下载，所选文献与导出设置已保留。请重试。');return;}
 try{downloadFile(buildExport(selectedRecords(),state.format,state.notes),state.format);state.failed=false;$('export-label').textContent='再次下载清单';showFeedback('success','清单已生成，已发起下载',`共 ${state.selected.size} 篇文献${state.notes?'，包含私人备注':'，不含私人备注'}。选择已保留。`);}catch(error){state.failed=true;$('export-label').textContent='重试导出';showFeedback('error','这次导出未完成','文件未能生成，所选文献与导出设置已保留。请重试。');}
}
$('search').addEventListener('input',event=>{state.query=event.target.value;renderList();});
document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{state.filter=button.dataset.filter;renderList();}));
$('papers').addEventListener('change',event=>{if(!event.target.classList.contains('paper-check'))return;const checkbox=event.target;if(checkbox.checked)state.selected.add(checkbox.value);else state.selected.delete(checkbox.value);checkbox.closest('.paper').classList.toggle('selected',checkbox.checked);updateSelection();});
$('clear-selection').addEventListener('click',()=>{state.selected.clear();state.failed=false;$('export-label').textContent='下载清单';$('feedback').hidden=true;renderList();});
$('reset-filters').addEventListener('click',()=>{state.query='';state.filter='全部';$('search').value='';renderList();$('search').focus();});
document.querySelectorAll('input[name=format]').forEach(input=>input.addEventListener('change',()=>{state.format=input.value;$('filename').textContent=`组会候选.${state.format}`;}));
$('include-notes').addEventListener('change',event=>{state.notes=event.target.checked;});
$('arm-failure').addEventListener('click',()=>{state.failNext=true;$('arm-failure').disabled=true;$('failure-status').textContent='已设置：下一次导出将失败，重试可正常下载。';});
$('export').addEventListener('click',exportSelection);
renderList();
</script>
</body>
</html>
