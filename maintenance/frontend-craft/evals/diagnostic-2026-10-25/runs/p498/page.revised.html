1px solid #e7ece7;align-items:start}.paper-row:last-child{border-bottom:0}.paper-row.selected{background:#f2f7f2}.paper-check{margin-top:5px!important}.paper-title{font-size:16px;font-weight:600;line-height:1.5;display:block;cursor:pointer;text-wrap:pretty}.paper-meta{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin-top:3px;color:#5f7166;font-size:13px;line-height:1.6}.paper-meta span+span:before{content:"·";margin:0 8px;color:#b4beb6}.paper-note{display:flex;gap:5px;align-items:baseline;margin-top:5px;font-size:13px;color:#607366;line-height:1.6}.paper-note svg{width:12px;height:12px;transform:translateY(2px)}.status{margin-top:1px;padding:2px 7px;border-radius:5px;white-space:nowrap;font-size:12px;background:#f0f3f0;color:#5f6e63}.status.read{background:#e9f0e9;color:#527359}.status.reading{background:#f3efe3;color:#7b693f}.empty{padding:60px 24px;text-align:center}.empty svg{width:35px;height:35px;color:#a2b3a7;margin-bottom:12px}.empty h2{font-size:17px;margin-bottom:6px}.empty p{color:var(--muted);font-size:13px}.text-button{background:none;padding:0;color:var(--teal);font-size:12px}.text-button:hover{text-decoration:underline}.text-button:disabled{color:#a9b3ac;text-decoration:none}.reset-filter{margin-top:15px}.export-panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}.panel-heading{display:flex;align-items:center;gap:9px}.panel-heading h2{font-size:17px;font-weight:600}.panel-heading svg{width:19px;height:19px}.selection-box{margin:20px 0 22px;border-bottom:1px solid var(--line);padding-bottom:19px}.selection-top{display:flex;align-items:baseline;justify-content:space-between}.selection-count{font-size:13px;color:var(--muted)}.selection-count strong{font-size:32px;font-weight:600;color:var(--teal);line-height:1.3;margin:0 5px;font-variant-numeric:tabular-nums}.selection-context{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.7;min-height:21px}.setting-label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}.format-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.format-option{position:relative;cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:10px 10px 9px;display:flex;gap:7px;align-items:flex-start}.format-option:has(input:checked){background:#f2f6f1;border-color:#739783}.format-option input{width:13px;height:13px;margin:5px 0 0;flex-shrink:0;cursor:pointer}.format-name{font-size:12px;font-weight:600;display:block}.format-ext{font-family:var(--sans);font-size:11px;color:var(--muted);display:block;margin-top:1px}.notes-option{margin-top:23px;display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer}.notes-hint{font-size:12px;line-height:1.65;color:var(--muted);margin:5px 0 0 26px}.file-preview{display:flex;align-items:center;gap:8px;background:#f6f8f4;padding:10px 11px;margin-top:23px;border-radius:6px;font-size:12px;color:#6a7b6f;overflow-wrap:anywhere}.file-preview svg{width:16px;height:16px}.export-button{width:100%;margin-top:13px;min-height:43px;border-radius:7px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600}.export-button svg{width:16px;height:16px}.export-button:hover:not(:disabled){background:var(--teal-dark)}.export-button:disabled{background:#e3e9e2;color:#98a69a}.included-fields{font-size:12px;line-height:1.8;color:var(--muted);text-align:center;margin-top:10px}.export-message{font-size:12px;line-height:1.8;padding:10px 12px;border-radius:6px;margin-top:14px;background:#edf3ec;color:var(--teal)}.export-message.error{background:#f8eeea;color:#9a5945}.export-message[hidden]{display:none}.export-message strong{font-size:13px;display:block;margin-bottom:2px}.selection-tip{display:flex;gap:8px;margin:15px 4px 0;color:var(--muted);font-size:12px;line-height:1.8}.selection-tip svg{width:15px;height:15px;margin-top:3px}.diagnostic{margin:22px 4px 0;border-top:1px solid var(--line);padding-top:12px;color:#8c988f;font-size:11px}.diagnostic summary{cursor:pointer;width:fit-content}.diagnostic button{margin-top:10px;padding:6px 9px;border:1px solid #d9e2d8;border-radius:4px;background:#fff;color:#637b68;font-size:11px}.diagnostic button:disabled{color:#9ba79e;background:#edf1eb}.diagnostic p{margin-top:5px}.page-footer{font-size:12px;color:#637369;margin-top:17px;display:flex;justify-content:space-between;gap:10px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.skip-link{position:absolute;top:-60px;left:20px;background:var(--teal);color:#fff;padding:9px 16px;z-index:5;border-radius:4px}.skip-link:focus{top:10px}

@media(max-width:720px){.topbar{height:60px}.topbar-inner{padding:0 20px;gap:28px}.brand{font-size:20px}.brand-mark{width:28px;height:28px}.space-label{font-size:11px}.space-label svg{display:none}.nav-label{font-size:12px}main{padding:24px 16px}.page-heading{margin:0 4px 22px}.heading-art{display:none}h1{font-size:27px}.description{font-size:12px}.workspace{grid-template-columns:minmax(0,1fr);gap:22px}.filters{padding:16px 16px 0}.search-box{height:44px}.tabs{justify-content:space-between;gap:10px}.tab{padding-top:12px;padding-bottom:13px}.list-toolbar{padding:11px 16px}.visible-count{display:none}.mobile-export{display:block;text-decoration:none;font-size:12px}.paper-row{grid-template-columns:17px minmax(0,1fr) auto;padding:17px 15px;gap:10px}.paper-title{font-size:16px;line-height:1.6}.paper-meta{font-size:12px;row-gap:2px}.paper-meta span+span:before{margin:0 5px}.paper-note{font-size:12px;margin-top:7px;line-height:1.7}.paper-note svg{display:none}.status{margin-top:4px;font-size:11px;padding:1px 5px}.export-panel{padding:22px;scroll-margin-top:18px}.selection-box{margin-top:17px}.selection-context{min-height:0}.format-option{padding:12px}.format-name{font-size:13px}.notes-hint,.included-fields{font-size:12px}.export-button{min-height:46px;font-size:14px}.selection-tip{margin-left:6px;margin-right:6px;font-size:12px}.page-footer{font-size:12px;display:block;margin:20px 4px 0}.page-footer span{display:block}.diagnostic{margin-top:18px}.empty{padding:45px 20px}}

<body>
<a class="skip-link" href="#search">跳转到文献搜索</a>
<header class="topbar"><div class="topbar-inner"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5h6.5L12 7l1.5-1.5H20v14h-6.5L12 21l-1.5-1.5H4z"/><path d="M12 7v14M7 10h2M15 10h2M7 13h2M15 13h2"/></svg></span>研目</div><span class="nav-label">我的文献</span><span class="space-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>个人空间</span></div></header>
<main>
<div class="page-heading"><div><div class="eyebrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v11H3zM3 7V4h7l2 3h9v2"/></svg>我的集合</div><div class="heading-line"><h1>组会候选</h1><span class="collection-count">6 篇文献</span></div><p class="description">挑选值得讨论的文献，整理一份组会清单。</p></div><svg class="heading-art" viewBox="0 0 80 70" aria-hidden="true"><path d="M17 13l38-5 7 47-38 5z"/><path d="M26 8h38v48H26z"/><path d="M32 19h23M32 26h23M32 33h16M32 44h8"/><path d="M55 8v10l4-3 5 3"/></svg></div>
<div class="workspace">
<section class="library" aria-label="组会候选文献列表">
<div class="filters"><div class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><label class="sr-only" for="search">搜索标题或作者</label><input type="search" id="search" placeholder="搜索标题或作者" autocomplete="off"><button type="button" class="search-clear" id="search-clear" aria-label="清除搜索" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
<div class="tabs" role="group" aria-label="按阅读状态筛选"><button type="button" class="tab" data-filter="全部" aria-pressed="true">全部<span>6</span></button><button type="button" class="tab" data-filter="未读" aria-pressed="false">未读<span>2</span></button><button type="button" class="tab" data-filter="阅读中" aria-pressed="false">阅读中<span>2</span></button><button type="button" class="tab" data-filter="已读" aria-pressed="false">已读<span>2</span></button></div></div>
<div class="list-toolbar"><label class="select-all"><input id="select-visible" type="checkbox"><span>选择当前结果</span></label><span class="visible-count" id="visible-count">显示 6 篇文献</span><a class="mobile-export" href="#export-panel">前往导出 <span id="mobile-count">0</span> 篇 ↓</a></div>
<div id="paper-list"></div><p class="sr-only" id="results-live" aria-live="polite" aria-atomic="true"></p>
</section>
<aside class="export-column" aria-label="导出设置">
<section class="export-panel" id="export-panel" tabindex="-1"><div class="panel-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3H5v18h14V9zM13 3v6h6M8 13h8M8 17h6"/></svg><h2>导出清单</h2></div><div class="selection-box"><div class="selection-top"><p class="selection-count">已选 <strong id="selected-count">0</strong> 篇</p><button type="button" class="text-button" id="clear-selection" disabled>清空选择</button></div><p class="selection-context" id="selection-context" aria-live="polite">从左侧勾选要在组会讨论的文献。</p></div>
<fieldset><legend class="setting-label">文件格式</legend><div class="format-options"><label class="format-option"><input type="radio" name="format" value="md" checked><span><span class="format-name">Markdown</span><span class="format-ext">.md</span></span></label><label class="format-option"><input type="radio" name="format" value="txt"><span><span class="format-name">纯文本</span><span class="format-ext">.txt</span></span></label></div></fieldset>
<label class="notes-option"><input id="include-notes" type="checkbox">包含私人备注</label><p class="notes-hint">勾选后，你的备注也会出现在分享文件中。</p>
<div class="file-preview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3H5v18h14V9zM13 3v6h6"/></svg><span id="file-name">组会候选.md</span></div><button type="button" class="export-button" id="export-button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg><span id="export-label">选择文献后导出</span></button><p class="included-fields">包含标题、作者、年份与类型</p><div class="export-message" id="export-message" role="status" aria-live="polite" hidden></div>
</section>
<p class="selection-tip"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg><span>切换搜索或筛选会保留选择。<br>导出包含全部已选文献。</span></p>
<details class="diagnostic"><summary>验收入口</summary><button type="button" id="fail-next">使下一次导出失败</button><p id="failure-armed" aria-live="polite">仅用于检查失败后的重试流程。</p></details>
</aside>
</div>
<footer class="page-footer"><span>以上为原型样例记录，不对应真实出版记录。</span></footer>
</main>
<script>
'use strict';
const papers = [
{id:'P01',title:'长文档摘要中的证据定位',authors:'林知远、赵宁',year:2025,type:'会议论文',status:'已读',note:'组会上讨论如何检查摘要中的每条依据。'},
{id:'P02',title:'小样本标注的一致性检查',authors:'陈晓、顾文',year:2024,type:'期刊论文',status:'阅读中',note:'需要补看附录中的标注说明。'},
{id:'P03',title:'研究软件的可复现记录',authors:'许禾',year:2026,type:'技术报告',status:'未读',note:'先确认环境记录能否用于自己的项目。'},
{id:'P04',title:'跨领域术语表的维护方法',authors:'王景、林知远',year:2023,type:'期刊论文',status:'已读',note:'可作为术语冲突讨论的背景材料。'},
{id:'P05',title:'开放数据集的版本追踪',authors:'周简、何安',year:2025,type:'会议论文',status:'未读',note:'和本周的数据整理任务相关。'},
{id:'P06',title:'人工评价中的分歧记录',authors:'宋可',year:2026,type:'技术报告',status:'阅读中',note:'重点看如何保存不同判断的理由。'}
];
const selected = new Set();
let query = '', filter = '全部', failNext = false, exportFailed = false;
const $ = id => document.getElementById(id);
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function visiblePapers(){const term=query.trim().toLocaleLowerCase();return papers.filter(p=>(filter==='全部'||p.status===filter)&&(!term||p.title.toLocaleLowerCase().includes(term)||p.authors.toLocaleLowerCase().includes(term)));}
function selectedPapers(){return papers.filter(p=>selected.has(p.id));}
function selectedFormat(){return document.querySelector('input[name="format"]:checked').value;}
function updateSelection(){
 const visible=visiblePapers(), visibleSelected=visible.filter(p=>selected.has(p.id)).length, hidden=selected.size-visibleSelected;
 $('selected-count').textContent=selected.size;
 $('mobile-count').textContent=selected.size;
 $('clear-selection').disabled=selected.size===0;
 $('export-button').disabled=selected.size===0;
 $('export-label').textContent=selected.size===0?'选择文献后导出':exportFailed?'重试导出':`导出 ${selected.size} 篇文献`;
 $('selection-context').textContent=selected.size===0?'勾选要在组会讨论的文献。':hidden?`其中 ${hidden} 篇不在当前结果中，将一并导出。`:'已选文献将按集合原有顺序导出。';
 $('select-visible').checked=visible.length>0&&visibleSelected===visible.length;
 $('select-visible').indeterminate=visibleSelected>0&&visibleSelected<visible.length;
 $('select-visible').disabled=visible.length===0;
 document.querySelectorAll('.paper-check').forEach(input=>{input.checked=selected.has(input.value);input.closest('.paper-row').classList.toggle('selected',input.checked);});
}
function render(){
 const visible=visiblePapers();
 $('visible-count').textContent=`显示 ${visible.length} 篇文献`;
 $('results-live').textContent=`找到 ${visible.length} 篇文献，已选 ${selected.size} 篇。`;
 $('search-clear').hidden=!query;
 $('paper-list').innerHTML=visible.length?visible.map(p=>`<article class="paper-row${selected.has(p.id)?' selected':''}"><input class="paper-check" type="checkbox" id="select-${p.id}" value="${p.id}" aria-labelledby="title-${p.id}" ${selected.has(p.id)?'checked':''}><div><label class="paper-title" id="title-${p.id}" for="select-${p.id}">${esc(p.title)}</label><div class="paper-meta"><span>${esc(p.authors)}</span><span>${p.year}</span><span>${esc(p.type)}</span></div><p class="paper-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span><span class="sr-only">私人备注：</span>${esc(p.note)}</span></p></div><span class="status ${p.status==='已读'?'read':p.status==='阅读中'?'reading':''}">${esc(p.status)}</span></article>`).join(''):`<div class="empty"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><h2>没有找到匹配的文献</h2><p>试试其他标题、作者，或调整阅读状态。</p><button type="button" class="text-button reset-filter" id="reset-filter">清除搜索与筛选</button></div>`;
 updateSelection();
}
function clearMessage(){exportFailed=false;$('export-message').hidden=true;}
function buildExport(items,format,withNotes){
 if(format==='md') return '# 组会候选\n\n'+items.map(p=>`## ${p.title}\n\n- 作者：${p.authors}\n- 年份：${p.year}\n- 类型：${p.type}${withNotes?'\n- 私人备注：'+p.note:''}`).join('\n\n')+'\n';
 return '组会候选\n\n'+items.map((p,i)=>`${i+1}. ${p.title}\n作者：${p.authors}\n年份：${p.year}\n类型：${p.type}${withNotes?'\n私人备注：'+p.note:''}`).join('\n\n')+'\n';
}
function showExportError(){exportFailed=true;const message=$('export-message');message.className='export-message error';message.setAttribute('role','alert');message.setAttribute('aria-live','assertive');message.innerHTML='<strong>导出未完成</strong><p>文件未下载，选择与设置已保留。</p><p>请点击上方“重试导出”。</p>';message.hidden=false;updateSelection();}
function exportSelection(){
 if(selected.size===0)return;
 if(failNext){failNext=false;$('fail-next').disabled=false;$('failure-armed').textContent='失败已触发，重试将正常生成文件。';showExportError();return;}
 let url=null, link=null;
 try{
  const format=selectedFormat(), items=selectedPapers();
  const content=buildExport(items,format,$('include-notes').checked);
  const blob=new Blob(['\uFEFF',content],{type:format==='md'?'text/markdown;charset=utf-8':'text/plain;charset=utf-8'});
  url=URL.createObjectURL(blob);link=document.createElement('a');link.href=url;link.download=`组会候选.${format}`;document.body.appendChild(link);link.click();link.remove();link=null;
  const createdUrl=url;setTimeout(()=>URL.revokeObjectURL(createdUrl),1000);url=null;
  exportFailed=false;const message=$('export-message');message.className='export-message';message.setAttribute('role','status');message.setAttribute('aria-live','polite');message.textContent=`已生成 ${items.length} 篇文献，下载已发起。选择已保留。`;message.hidden=false;updateSelection();
 }catch(error){if(link)link.remove();if(url)URL.revokeObjectURL(url);showExportError();}
}
$('search').addEventListener('input',event=>{query=event.target.value;render();});
$('search-clear').addEventListener('click',()=>{query='';$('search').value='';render();$('search').focus();});
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(tab=>tab.setAttribute('aria-pressed',String(tab===button)));render();}));
$('paper-list').addEventListener('change',event=>{if(!event.target.matches('.paper-check'))return;event.target.checked?selected.add(event.target.value):selected.delete(event.target.value);clearMessage();updateSelection();});
$('paper-list').addEventListener('click',event=>{if(event.target.id!=='reset-filter')return;query='';filter='全部';$('search').value='';document.querySelectorAll('[data-filter]').forEach(tab=>tab.setAttribute('aria-pressed',String(tab.dataset.filter==='全部')));render();$('search').focus();});
$('select-visible').addEventListener('change',event=>{visiblePapers().forEach(p=>event.target.checked?selected.add(p.id):selected.delete(p.id));clearMessage();updateSelection();});
$('clear-selection').addEventListener('click',()=>{selected.clear();clearMessage();updateSelection();});
document.querySelectorAll('input[name="format"]').forEach(input=>input.addEventListener('change',()=>{$('file-name').textContent=`组会候选.${selectedFormat()}`;clearMessage();updateSelection();}));
$('include-notes').addEventListener('change',()=>{clearMessage();updateSelection();});
$('fail-next').addEventListener('click',()=>{failNext=true;$('fail-next').disabled=true;$('failure-armed').textContent='已设置：下一次导出会失败，且不会下载文件。';});
$('export-button').addEventListener('click',exportSelection);
render();
</script>
</body>
