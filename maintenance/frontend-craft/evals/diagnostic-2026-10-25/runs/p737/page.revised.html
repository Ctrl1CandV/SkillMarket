<header class="site-header shell">

<main class="shell">

  </section>
  <section id="collection" aria-label="专题作品" tabindex="-1">
    <div class="collection-bar">

      <p class="view-hint">点击作品查看大图 <span aria-hidden="true">↗</span></p>
    </div>
    <ul class="work-grid" id="work-grid"></ul>
    <div class="empty" id="empty-state" hidden>
      <svg class="bookmark" aria-hidden="true" viewBox="0 0 18 22"><path d="M3 2h12v18l-6-4-6 4Z"/></svg>
      <h2>还没有收藏的作品</h2>
      <p>浏览作品，收藏你想在选题会上讨论的作品。</p>
      <button class="return-all" id="return-all" type="button">浏览全部作品 <span aria-hidden="true">↗</span></button>
    </div>
  </section>
</main>
<footer class="page-footer shell"><p class="footer-name">页间 / 纸面研究</p><p>收藏仅在当前页面保留，刷新后清空。</p></footer>
<p class="sr-only" id="status" role="status" aria-live="polite" aria-atomic="true"></p>
<dialog id="detail-dialog" aria-labelledby="detail-title" aria-describedby="detail-description">
  <button type="button" class="close-detail" id="close-detail" aria-label="关闭作品查看" autofocus>关闭 <span aria-hidden="true">×</span></button>
  <div class="detail-layout">
    <div class="detail-art"><img id="detail-image" alt=""></div>
    <div class="detail-copy">
      <p class="detail-index" id="detail-index"></p>
      <h2 class="detail-title" id="detail-title"></h2>
      <p class="detail-meta" id="detail-meta"></p>
      <p class="detail-description" id="detail-description"></p>
      <button class="save detail-save" id="detail-save" type="button" aria-pressed="false"></button>
      <p class="detail-footnote">按 Esc 或点击右上角关闭</p>
    </div>
  </div>
</dialog>

const saved = new Set();
let filter = "all";
let currentWork = null;
let lastTrigger = null;
const grid = document.getElementById("work-grid");
const dialog = document.getElementById("detail-dialog");
const allButton = document.getElementById("filter-all");
const savedButton = document.getElementById("filter-saved");
const detailSave = document.getElementById("detail-save");
const status = document.getElementById("status");
const bookmark = '<svg class="bookmark" aria-hidden="true" viewBox="0 0 18 22"><path d="M3 2h12v18l-6-4-6 4Z"/></svg>';
works.forEach((work,index) => {
  const card = document.createElement("li");
  card.className = "work-card";
  card.dataset.id = work.id;
  card.innerHTML = '<button class="work-open" type="button" aria-label="查看《'+work.title+'》的作品详情"><span class="image-frame"><img class="work-image" src="'+work.image+'" width="'+work.width+'" height="'+work.height+'" alt="'+work.title+'：'+work.description+'"><span class="image-cue" aria-hidden="true">↗</span></span><span class="caption"><span class="work-title-row"><span class="work-number" aria-hidden="true">0'+(index+1)+'</span><span class="work-title">'+work.title+'</span></span><span class="work-meta">'+work.year+' · '+work.medium+'</span></span></button><button class="save card-save" type="button" aria-pressed="false"></button>';
  card.querySelector(".work-open").addEventListener("click",event => openWork(work,event.currentTarget));
  card.querySelector(".card-save").addEventListener("click",() => toggleSave(work));
  grid.appendChild(card);
});
function updateSaveButton(button,work,isDetail) {
  const active = saved.has(work.id);
  button.setAttribute("aria-pressed",String(active));
  button.setAttribute("aria-label",(active ? "取消收藏" : "收藏")+"《"+work.title+"》");
  button.innerHTML = bookmark+'<span>'+(active ? "已收藏" : isDetail ? "收藏作品" : "收藏")+'</span>';
}
function render() {
  allButton.setAttribute("aria-pressed",String(filter === "all"));
  savedButton.setAttribute("aria-pressed",String(filter === "saved"));
  document.getElementById("saved-count").textContent = String(saved.size);
  let focusWasHidden = false;
  works.forEach(work => {
    const card = grid.querySelector('[data-id="'+work.id+'"]');
    const shouldHide = filter === "saved" && !saved.has(work.id);
    if (shouldHide && card.contains(document.activeElement)) focusWasHidden = true;
    card.hidden = shouldHide;
    updateSaveButton(card.querySelector(".card-save"),work,false);
  });
  const isEmpty = filter === "saved" && saved.size === 0;
  grid.hidden = isEmpty;
  document.getElementById("empty-state").hidden = !isEmpty;
  if (currentWork) updateSaveButton(detailSave,currentWork,true);
  if (focusWasHidden && !dialog.open) savedButton.focus();
}
function setFilter(nextFilter) {
  filter = nextFilter;
  render();
  status.textContent = nextFilter === "all" ? "显示全部 3 件作品。" : "显示 "+saved.size+" 件已收藏作品。";
}
function toggleSave(work) {
  const wasSaved = saved.has(work.id);
  if (wasSaved) saved.delete(work.id); else saved.add(work.id);
  render();
  status.textContent = (wasSaved ? "已取消收藏" : "已收藏")+"《"+work.title+"》，共 "+saved.size+" 件收藏。";
}
function openWork(work,trigger) {
  currentWork = work;
  lastTrigger = trigger;
  const img = document.getElementById("detail-image");
  img.src = work.image;
  img.alt = work.title+"："+work.description;
  img.width = work.width;
  img.height = work.height;
  document.getElementById("detail-title").textContent = work.title;
  document.getElementById("detail-index").textContent = "0"+(works.indexOf(work)+1)+" / 03";
  document.getElementById("detail-meta").textContent = work.year+" · "+work.medium;
  document.getElementById("detail-description").textContent = work.description;
  updateSaveButton(detailSave,work,true);
  dialog.showModal();
  document.body.classList.add("modal-open");
  document.getElementById("close-detail").focus();
}
allButton.addEventListener("click",() => setFilter("all"));
savedButton.addEventListener("click",() => setFilter("saved"));
document.getElementById("return-all").addEventListener("click",() => {setFilter("all");allButton.focus();});
detailSave.addEventListener("click",() => {if(currentWork) toggleSave(currentWork);});
document.getElementById("close-detail").addEventListener("click",() => dialog.close());
dialog.addEventListener("click",event => {
  if (event.target !== dialog) return;
  const rect = dialog.getBoundingClientRect();
  if(event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
});
dialog.addEventListener("close",() => {
  document.body.classList.remove("modal-open");
  const visibleTrigger = lastTrigger && !lastTrigger.closest(".work-card").hidden;
  (visibleTrigger ? lastTrigger : savedButton).focus();
  currentWork = null;
});
render();
</script>
</body>
