<dialog id="work-dialog" aria-labelledby="detail-title" aria-describedby="detail-description"><button type="button" class="detail-close" id="close-dialog" aria-label="关闭作品详情">×</button><div class="detail-layout"><div class="detail-art"><img id="detail-image" alt=""></div><div class="detail-info"><span class="detail-id" id="detail-id"></span><h2 id="detail-title"></h2><div class="detail-meta"><span id="detail-year"></span><span aria-hidden="true">/</span><span>数字构成</span></div><p class="detail-description" id="detail-description"></p><button type="button" class="save-button detail-save" id="detail-save" aria-pressed="false"><svg viewBox="0 0 12 16" aria-hidden="true"><path d="M1.5 1.5h9v13l-4.5-3-4.5 3z"/></svg><span>收藏作品</span></button><p class="detail-session">纸面研究 · 页间<br>按 Esc 或点击右上角关闭，返回作品列表。</p></div></div></dialog>
<script>
'use strict';
const works = [
  { title: '折线', year: '2026', description: '两次折叠形成不同朝向的纸面，斜向光线穿过它们。' },
  { title: '留白', year: '2026', description: '两张纸之间的间隙成为观看的对象。' },
  { title: '余温', year: '2025', description: '暗面边缘的一段颜色沿纸面逐渐减弱。' }
];
const saved = new Set();
let activeFilter = 'all';
let currentWork = null;
let opener = null;
const allButton = document.getElementById('filter-all');
const savedButton = document.getElementById('filter-saved');
const gallery = document.getElementById('gallery');
const cards = [...document.querySelectorAll('[data-work]')];
const saveButtons = [...document.querySelectorAll('[data-save]')];
const dialog = document.getElementById('work-dialog');
const detailSave = document.getElementById('detail-save');
const liveStatus = document.getElementById('live-status');
function updateSaveButton(button, index, detail = false) {
  const isSaved = saved.has(index);
  button.setAttribute('aria-pressed', String(isSaved));
  button.setAttribute('aria-label', `${isSaved ? '取消收藏' : '收藏'}《${works[index].title}》`);
  button.querySelector('span').textContent = isSaved ? '已收藏' : (detail ? '收藏作品' : '收藏');
}
function render() {
  allButton.setAttribute('aria-pressed', String(activeFilter === 'all'));
  savedButton.setAttribute('aria-pressed', String(activeFilter === 'saved'));
  document.getElementById('saved-count').textContent = String(saved.size);
  cards.forEach((card, index) => { card.hidden = activeFilter === 'saved' && !saved.has(index); });
  const empty = activeFilter === 'saved' && saved.size === 0;
  gallery.hidden = empty;
  document.getElementById('empty-state').hidden = !empty;
  saveButtons.forEach(button => updateSaveButton(button, Number(button.dataset.save)));
  if (currentWork !== null) updateSaveButton(detailSave, currentWork, true);
}
function setFilter(filter) {
  activeFilter = filter;
  render();
  liveStatus.textContent = filter === 'all' ? '显示全部 3 件作品。' : `显示已收藏的 ${saved.size} 件作品。`;
}
function toggleSave(index, source) {
  const wasSaved = saved.has(index);
  if (wasSaved) saved.delete(index); else saved.add(index);
  render();
  liveStatus.textContent = `${wasSaved ? '已取消收藏' : '已收藏'}《${works[index].title}》。当前已收藏 ${saved.size} 件作品。`;
  if (activeFilter === 'saved' && wasSaved && !dialog.open && source) savedButton.focus();
}
function openWork(index, trigger) {
  currentWork = index;
  opener = trigger;
  const work = works[index];
  const source = cards[index].querySelector('img');
  const image = document.getElementById('detail-image');
  image.src = source.src;
  image.alt = source.alt;
  document.getElementById('detail-id').textContent = `作品 ${String(index + 1).padStart(2, '0')} / 03`;
  document.getElementById('detail-title').textContent = work.title;
  document.getElementById('detail-year').textContent = work.year;
  document.getElementById('detail-description').textContent = work.description;
  updateSaveButton(detailSave, index, true);
  dialog.showModal();
  document.getElementById('close-dialog').focus();
}
allButton.addEventListener('click', () => setFilter('all'));
savedButton.addEventListener('click', () => setFilter('saved'));
document.getElementById('back-all').addEventListener('click', () => { setFilter('all'); allButton.focus(); });
document.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => openWork(Number(button.dataset.open), button)));
saveButtons.forEach(button => button.addEventListener('click', () => toggleSave(Number(button.dataset.save), button)));
detailSave.addEventListener('click', () => { if (currentWork !== null) toggleSave(currentWork, detailSave); });
document.getElementById('close-dialog').addEventListener('click', () => dialog.close());
dialog.addEventListener('click', event => {
  if (event.target !== dialog) return;
  const bounds = dialog.getBoundingClientRect();
  if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close();
});
dialog.addEventListener('close', () => {
  const returnTarget = opener && !opener.closest('[data-work]').hidden ? opener : (activeFilter === 'all' ? allButton : savedButton);
  currentWork = null;
  returnTarget.focus();
});
render();
</script>
</body>
