];
const saved = new Set();
let filter = "all";
let activeIndex = 0;
let origin = null;
const el = id => document.getElementById(id);
const dialog = el("detail-dialog");
const bookmark = '<svg class="bookmark" viewBox="0 0 14 18" aria-hidden="true"><path d="M2 1.5h10v15l-5-3.5-5 3.5z"/></svg>';
const pad = number => String(number).padStart(2,"0");
function announce(message){el("announcement").textContent=message;}
function renderGallery(){
  const visible=works.filter(work=>filter==="all"||saved.has(work.id));
  el("gallery").innerHTML=visible.map(work=>{
    const index=works.indexOf(work);
    const selected=saved.has(work.id);
    return '<article class="work" aria-labelledby="title-'+work.id+'"><button class="work-view" data-open="'+index+'" aria-label="查看《'+work.title+'》作品详情"><img class="work-image" src="'+work.image+'" width="'+work.width+'" height="'+work.height+'" alt="'+work.alt+'"><span class="open-mark" aria-hidden="true">↗</span></button><div class="work-head"><div class="work-title"><span class="work-number" aria-hidden="true">'+pad(index+1)+'</span><h2 id="title-'+work.id+'"><button class="title-button" data-open="'+index+'" aria-label="查看《'+work.title+'》作品详情">'+work.title+'</button></h2></div><button class="save-button" data-save="'+index+'" aria-pressed="'+selected+'" aria-label="'+(selected?'取消收藏':'收藏')+'《'+work.title+'》">'+bookmark+'<span>'+(selected?'已收藏':'收藏')+'</span></button></div><p class="work-meta"><span>'+work.year+'</span><span class="meta-dot" aria-hidden="true"></span><span>'+work.medium+'</span></p></article>';
  }).join("");
  el("gallery").hidden=visible.length===0;
  el("empty").hidden=visible.length!==0;
  el("header-count").textContent=saved.size;
  el("tab-count").textContent=pad(saved.size);
  el("header-saved").setAttribute("aria-label","查看我的收藏，共 "+saved.size+" 件作品");
  el("all-tab").setAttribute("aria-pressed",String(filter==="all"));
  el("saved-tab").setAttribute("aria-pressed",String(filter==="saved"));
}
function setFilter(next,focusTab=false){
  filter=next;
  renderGallery();
  if(focusTab)el(next==="all"?"all-tab":"saved-tab").focus();
  announce(next==="all"?"显示全部 3 件作品":"显示已收藏的 "+saved.size+" 件作品");
}
function toggleSave(index){
  const work=works[index];
  const wasSaved=saved.has(work.id);
  if(wasSaved)saved.delete(work.id);else saved.add(work.id);
  const restoreCardFocus=document.activeElement?.matches("[data-save]");
  renderGallery();
  if(dialog.open)renderDetail();
  if(restoreCardFocus){
    const target=document.querySelector('[data-save="'+index+'"]');
    (target||el(filter==="all"?"all-tab":"saved-tab")).focus();
  }
  announce((wasSaved?"已取消收藏":"已收藏")+"《"+work.title+"》，当前共收藏 "+saved.size+" 件作品。");
}
function renderDetail(){
  const work=works[activeIndex];
  el("dialog-image").src=work.image;
  el("dialog-image").alt=work.alt;
  el("dialog-title").textContent=work.title;
  el("dialog-year").textContent=work.year;
  el("dialog-medium").textContent=work.medium;
  el("dialog-description").textContent=work.description;
  el("dialog-index").textContent=pad(activeIndex+1)+" / 03";
  el("dialog-save").innerHTML=bookmark+"<span>"+(saved.has(work.id)?"已收藏 · 取消收藏":"收藏这件作品")+"</span>";
  el("dialog-save").setAttribute("aria-pressed",String(saved.has(work.id)));
  el("dialog-save").setAttribute("aria-label",(saved.has(work.id)?"取消收藏":"收藏")+"《"+work.title+"》");
}
function openDetail(index){
  activeIndex=index;
  origin=document.activeElement;
  renderDetail();
  dialog.showModal();
  document.body.style.overflow="hidden";
}
function navigateDetail(direction){
  activeIndex=(activeIndex+direction+works.length)%works.length;
  renderDetail();
  announce("正在查看《"+works[activeIndex].title+"》，第 "+(activeIndex+1)+" 件，共 3 件。");
}
el("gallery").addEventListener("click",event=>{
  const openButton=event.target.closest("[data-open]");
  const saveButton=event.target.closest("[data-save]");
  if(openButton)openDetail(Number(openButton.dataset.open));
  if(saveButton)toggleSave(Number(saveButton.dataset.save));
});
el("all-tab").addEventListener("click",()=>setFilter("all"));
el("saved-tab").addEventListener("click",()=>setFilter("saved"));
el("header-saved").addEventListener("click",()=>{setFilter("saved",true);el("saved-tab").scrollIntoView({block:"center"});});
el("back-all").addEventListener("click",()=>setFilter("all",true));
el("dialog-save").addEventListener("click",()=>toggleSave(activeIndex));
el("close-dialog").addEventListener("click",()=>dialog.close());
el("previous-work").addEventListener("click",()=>navigateDetail(-1));
el("next-work").addEventListener("click",()=>navigateDetail(1));
dialog.addEventListener("keydown",event=>{
  if(event.key==="ArrowLeft"){event.preventDefault();navigateDetail(-1);}
  if(event.key==="ArrowRight"){event.preventDefault();navigateDetail(1);}
});
dialog.addEventListener("click",event=>{
  if(event.target!==dialog)return;
  const rect=dialog.getBoundingClientRect();
  if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();
});
dialog.addEventListener("close",()=>{
  document.body.style.overflow="";
  if(origin?.isConnected)origin.focus();
  else{
    const card=document.querySelector('[data-open="'+activeIndex+'"]');
    (card||el(filter==="all"?"all-tab":"saved-tab")).focus();
  }
});
renderGallery();
</script>
</body>
</html>
