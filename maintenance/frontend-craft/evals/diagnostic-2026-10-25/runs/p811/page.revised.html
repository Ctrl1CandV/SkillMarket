  <div class="detail-layout">
    <div class="detail-image-wrap"><img class="detail-image" id="detail-image" alt=""></div>
    <div class="detail-copy">
      <p class="detail-index" id="detail-index"></p><h2 id="detail-title"></h2><p class="detail-meta" id="detail-meta"></p><p class="detail-description" id="detail-description"></p>
      <button class="save-button detail-save" id="detail-save" type="button" aria-pressed="false"><svg viewBox="0 0 18 22" aria-hidden="true"><path d="M3.5 2.5h11v17L9 16l-5.5 3.5Z"/></svg><span>收藏作品</span></button>

    </div>

<script>
'use strict';
const works = [
  { title: '折线', year: '2026', medium: '数字构成', description: '两次折叠形成不同朝向的纸面，斜向光线穿过它们。' },
  { title: '留白', year: '2026', medium: '数字构成', description: '两张纸之间的间隙成为观看的对象。' },
  { title: '余温', year: '2025', medium: '数字构成', description: '暗面边缘的一段颜色沿纸面逐渐减弱。' }
];
const saved = new Set();
let currentFilter = 'all';
let currentWork = 0;
let opener = null;
const cards = Array.from(document.querySelectorAll('[data-work]'));
const filters = Array.from(document.querySelectorAll('[data-filter]'));
const detail = document.getElementById('detail');
const status = document.getElementById('status');
const detailSave = document.getElementById('detail-save');
const gallery = document.getElementById('gallery');
const empty = document.getElementById('empty');
function renderSave(button, index, inDetail = false) {
  const selected = saved.has(index);
  button.setAttribute('aria-pressed', String(selected));
  button.setAttribute('aria-label', (selected ? '取消收藏' : '收藏') + '《' + works[index].title + '》');
  button.querySelector('span').textContent = selected ? '已收藏' : (inDetail ? '收藏作品' : '收藏');
}
function renderGallery() {
  document.getElementById('saved-count').textContent = String(saved.size);
  for (const button of filters) button.setAttribute('aria-pressed', String(button.dataset.filter === currentFilter));
  for (const card of cards) card.hidden = currentFilter === 'saved' && !saved.has(Number(card.dataset.work));
  document.querySelectorAll('[data-save]').forEach(button => renderSave(button, Number(button.dataset.save)));
  gallery.classList.toggle('saved-view', currentFilter === 'saved');
  const noResults = currentFilter === 'saved' && saved.size === 0;
  gallery.hidden = noResults;
  empty.hidden = !noResults;
  if (detail.open) renderSave(detailSave, currentWork, true);
}
function selectFilter(filter) {
  currentFilter = filter;
  renderGallery();
  const count = filter === 'saved' ? saved.size : works.length;
  status.textContent = (filter === 'saved' ? '已收藏' : '全部作品') + '，' + count + ' 件作品';
}
function toggleSave(index) {
  const selected = saved.has(index);
  selected ? saved.delete(index) : saved.add(index);
  const activeElement = document.activeElement;
  renderGallery();
  status.textContent = (selected ? '已取消收藏' : '已收藏') + '《' + works[index].title + '》，共收藏 ' + saved.size + ' 件作品';
  if (!detail.open && currentFilter === 'saved' && selected && cards[index].contains(activeElement)) {
    const nextCard = cards.find(card => !card.hidden);
    if (nextCard) nextCard.querySelector('[data-save]').focus();
    else document.getElementById('return-all').focus();
  }
}
function renderDetail(index) {
  currentWork = index;
  const work = works[index];
  const sourceImage = cards[index].querySelector('img');
  const image = document.getElementById('detail-image');
  image.src = sourceImage.src;
  image.alt = sourceImage.alt;
  image.width = Number(sourceImage.getAttribute('width'));
  image.height = Number(sourceImage.getAttribute('height'));
  document.getElementById('detail-title').textContent = work.title;
  document.getElementById('detail-meta').textContent = work.year + ' / ' + work.medium;
  document.getElementById('detail-description').textContent = work.description;
  document.getElementById('detail-index').textContent = String(index + 1).padStart(2, '0') + ' / 03';
  document.getElementById('previous').disabled = index === 0;
  document.getElementById('next').disabled = index === works.length - 1;
  renderSave(detailSave, index, true);
}
function openDetail(index, trigger) {
  opener = trigger;
  renderDetail(index);
  detail.showModal();
  document.body.style.overflow = 'hidden';
  document.getElementById('close-detail').focus();
}
document.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => openDetail(Number(button.dataset.open), button)));
document.querySelectorAll('[data-save]').forEach(button => button.addEventListener('click', () => toggleSave(Number(button.dataset.save))));
filters.forEach(button => button.addEventListener('click', () => selectFilter(button.dataset.filter)));
document.getElementById('return-all').addEventListener('click', () => {
  selectFilter('all');
  document.getElementById('all-filter').focus();
});
detailSave.addEventListener('click', () => toggleSave(currentWork));
document.getElementById('close-detail').addEventListener('click', () => detail.close());
detail.addEventListener('close', () => {
  document.body.style.overflow = '';
  const card = opener && opener.closest('[data-work]');
  if (opener && opener.isConnected && (!card || !card.hidden)) opener.focus();
  else document.getElementById(currentFilter === 'saved' ? 'saved-filter' : 'all-filter').focus();
});
detail.addEventListener('click', event => {
  if (event.target !== detail) return;
  const rect = detail.getBoundingClientRect();
  if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) detail.close();
});
function navigateDetail(offset) {
  const nextIndex = currentWork + offset;
  if (nextIndex < 0 || nextIndex >= works.length) return;
  renderDetail(nextIndex);
  document.getElementById('close-detail').focus();
}
document.getElementById('previous').addEventListener('click', () => navigateDetail(-1));
document.getElementById('next').addEventListener('click', () => navigateDetail(1));
renderGallery();
</script>
