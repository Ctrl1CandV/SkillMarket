<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>慢火咖啡 · 订单</title>
<style>
:root {
  --bg: oklch(97.4% 0.009 75);
  --paper: oklch(99.4% 0.004 80);
  --surface: oklch(95% 0.014 70);
  --line: oklch(90% 0.016 65);
  --line-2: oklch(82% 0.022 60);
  --muted: oklch(49% 0.028 55);
  --ink: oklch(25% 0.022 50);

  --roast: oklch(29% 0.042 48);
  --roast-2: oklch(34.5% 0.048 50);
  --roast-3: oklch(41% 0.055 52);
  --roast-line: oklch(40% 0.04 50);
  --cream: oklch(95.5% 0.02 80);
  --cream-2: oklch(80% 0.03 72);

  --caramel: oklch(77% 0.135 70);
  --caramel-ink: oklch(49% 0.12 58);
  --caramel-soft: oklch(95.5% 0.035 82);
  --red: oklch(52% 0.17 27);
  --red-soft: oklch(95.5% 0.025 25);
  --blue: oklch(50% 0.085 240);
  --green: oklch(52% 0.085 152);
  --grey: oklch(60% 0.015 60);

  --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  --serif: "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", SimSun, serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 40px;
  --r1: 6px; --r2: 10px;
  --side-w: 264px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 14px/1.5 var(--sans);
  color: var(--ink);
  background: var(--bg);
  line-break: strict;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--caramel-ink); outline-offset: 2px; }
.num, .no, .money { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
mark { background: oklch(90% 0.09 90); color: inherit; border-radius: 2px; padding: 0 1px; }
[hidden] { display: none !important; }

/* ---------- 骨架 ---------- */
.app {
  display: grid;
  height: 100dvh;
  grid-template-columns: var(--side-w) minmax(360px, 430px) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top top" "ov list detail";
}
.top { grid-area: top; }
.side { display: contents; }
.ov { grid-area: ov; overflow: auto; }
.list-pane { grid-area: list; overflow: auto; }
.detail-pane { grid-area: detail; overflow: auto; }

/* ---------- 顶栏 ---------- */
.top {
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr) auto;
  align-items: center;
  background: var(--roast);
  color: var(--cream);
  border-bottom: 1px solid var(--roast-line);
  min-height: 60px;
}
.brand { display: flex; align-items: baseline; gap: var(--s2); padding: 0 var(--s5); margin: 0; font-weight: 400; }
.brand .name { font-family: var(--serif); font-size: 21px; letter-spacing: .04em; }
.brand .sub { font-size: 13px; color: var(--cream-2); }
.search {
  display: flex; align-items: center; gap: var(--s2);
  max-width: 560px; margin: 0 var(--s4);
  background: var(--cream); color: var(--ink);
  border-radius: var(--r1); padding: 0 var(--s3); height: 38px;
}
.search svg { flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; height: 100%; outline: none; font-size: 14px; }
.search input::placeholder { color: oklch(56% 0.02 60); }
.search input::-webkit-search-cancel-button { display: none; }
.search kbd, .search .clear {
  flex: none; font: 12px/1 var(--mono); color: var(--muted);
  border: 1px solid var(--line-2); border-radius: 4px; padding: 3px 6px; background: transparent;
}
.search .clear { font-family: var(--sans); border: 0; padding: 4px 6px; }
.search:focus-within { box-shadow: 0 0 0 2px var(--caramel); }
.today-line { padding: 0 var(--s5); color: var(--cream-2); font-size: 13px; white-space: nowrap; }
.today-line b { color: var(--cream); font-weight: 400; }

/* ---------- 今日概览（深色侧栏） ---------- */
.ov {
  background: var(--roast);
  color: var(--cream);
  padding: var(--s4) var(--s4) var(--s5);
  display: flex; flex-direction: column; gap: var(--s5);
}
.ov-btn {
  display: block; width: 100%; text-align: left; border: 0; background: transparent; color: inherit;
  border-radius: var(--r1);
}
.ov-btn[aria-pressed="true"] { background: var(--roast-3); box-shadow: inset 3px 0 0 var(--caramel); }
.ov-btn:not([aria-pressed="true"]):hover { background: var(--roast-2); }

.todo-block { display: flex; flex-direction: column; gap: var(--s2); }
.todo-head { padding: var(--s2) var(--s3); display: flex; align-items: baseline; justify-content: space-between; }
.todo-head .t { font-size: 15px; font-weight: 700; }
.todo-head .c { color: var(--cream-2); font-size: 13px; }
.todo-head .c b { color: var(--cream); font-size: 15px; }
.tiles { display: grid; gap: var(--s2); }
.tile {
  display: grid; grid-template-columns: auto 1fr; column-gap: var(--s3); align-items: baseline;
  padding: var(--s3) var(--s3) var(--s3) var(--s4);
  background: var(--roast-2);
}
.tile .n { font-size: 32px; line-height: 1.1; font-weight: 700; color: var(--caramel); font-variant-numeric: tabular-nums; grid-row: span 2; }
.tile.refund .n { color: oklch(76% 0.12 30); }
.tile .t { font-size: 15px; font-weight: 700; }
.tile .s { font-size: 12.5px; color: var(--cream-2); }
.tile.zero .n { color: var(--cream-2); }

.others { display: flex; flex-direction: column; gap: 2px; }
.others .cap, .pick .cap { font-size: 12px; color: var(--cream-2); padding: 0 var(--s3) var(--s1); letter-spacing: .02em; }
.others .ov-btn { display: flex; justify-content: space-between; align-items: baseline; padding: 6px var(--s3); font-size: 14px; }
.others .ov-btn .c { color: var(--cream-2); font-variant-numeric: tabular-nums; }

.pick { border-top: 1px solid var(--roast-line); padding-top: var(--s4); }
.pick summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; padding: 0 var(--s3) var(--s2); }
.pick summary::-webkit-details-marker { display: none; }
.pick summary .t { font-size: 14px; font-weight: 700; }
.pick summary .c { font-size: 12.5px; color: var(--cream-2); }
.pick ul { list-style: none; margin: 0; padding: 0 var(--s3); display: flex; flex-direction: column; }
.pick li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s3); padding: 5px 0; border-bottom: 1px dashed var(--roast-line); font-size: 13px; color: var(--cream); }
.pick li:last-child { border-bottom: 0; }
.pick li .q { font-variant-numeric: tabular-nums; color: var(--caramel); font-weight: 700; }
.pick .empty { font-size: 13px; color: var(--cream-2); padding: 0 var(--s3); margin: 0; }
.notice { margin: auto 0 0; padding: 0 var(--s3); font-size: 12px; line-height: 1.6; color: var(--cream-2); }

/* ---------- 列表 ---------- */
.list-pane { background: var(--paper); border-right: 1px solid var(--line); }
.list-head {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap;
  padding: var(--s4) var(--s4) var(--s3);
  background: var(--paper); border-bottom: 1px solid var(--line);
}
.list-head h2 { margin: 0; font-size: 17px; }
.list-head .meta { color: var(--muted); font-size: 13px; }
.list-head .clear-q { margin-left: auto; border: 0; background: none; color: var(--caramel-ink); font-size: 13px; padding: 0; }
.group-h {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: var(--s4) var(--s4) var(--s2);
  font-size: 12.5px; color: var(--muted); font-weight: 700;
}
.group-h .gc { font-weight: 400; }
.group-h.refund { color: var(--red); }
.rows { list-style: none; margin: 0; padding: 0; }
.row {
  display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; column-gap: var(--s2); row-gap: 2px;
  width: 100%; text-align: left; border: 0; background: transparent;
  padding: 10px var(--s4) 11px var(--s3);
  border-top: 1px solid var(--line);
  align-items: baseline;
}
.rows li:first-child .row { border-top-color: transparent; }
.row:hover { background: oklch(97.2% 0.012 75); }
.row[aria-current="true"] { background: var(--caramel-soft); box-shadow: inset 3px 0 0 var(--caramel-ink); }
.row .mk { grid-row: 1; align-self: center; }
.row .r1 { grid-column: 2; display: flex; align-items: baseline; gap: var(--s2); min-width: 0; }
.row .amt { grid-column: 3; grid-row: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.row .r2 { grid-column: 2 / 4; display: flex; align-items: baseline; gap: var(--s3); min-width: 0; color: var(--muted); font-size: 13px; }
.row .items { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .items .q { color: var(--ink); font-weight: 700; }
.row .when { flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .wait { color: var(--caramel-ink); font-weight: 700; }
.row .r3 { grid-column: 2 / 4; font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.no { font-family: var(--mono); font-size: 13px; color: var(--muted); letter-spacing: -.01em; white-space: nowrap; }
.no b { color: var(--ink); font-weight: 700; }
.row .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-size: 14.5px; }
.row .who .city { color: var(--muted); font-size: 13px; }
.tag { display: inline-block; font-size: 12px; line-height: 1.5; padding: 0 6px; border-radius: 4px; white-space: nowrap; flex: none; }
.tag.note { background: var(--caramel-soft); color: var(--caramel-ink); border: 1px solid oklch(88% 0.06 80); margin-right: 6px; }
.tag.reason { background: var(--red-soft); color: var(--red); border: 1px solid oklch(88% 0.05 25); margin-right: 6px; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; white-space: nowrap; flex: none; }

/* 状态标记：颜色 + 形状 */
.mk { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.mk.s-待发货 { background: var(--caramel-ink); }
.mk.s-待付款 { border: 1.5px solid var(--grey); }
.mk.s-已发货 { background: linear-gradient(90deg, var(--blue) 50%, transparent 50%); border: 1.5px solid var(--blue); }
.mk.s-已完成 { background: var(--green); width: 9px; height: 9px; }
.mk.s-退款中 { background: var(--red); border-radius: 2px; transform: rotate(45deg); width: 9px; height: 9px; }
.mk.s-已退款 { border: 1.5px solid var(--grey); border-radius: 2px; transform: rotate(45deg); width: 9px; height: 9px; }

.empty-state { padding: var(--s6) var(--s5); text-align: center; color: var(--muted); }
.empty-state h3 { margin: 0 0 var(--s2); font-size: 16px; color: var(--ink); }
.empty-state p { margin: 0 0 var(--s4); font-size: 13px; }

/* ---------- 详情（小票） ---------- */
.detail-pane { background: var(--bg); }
.detail { max-width: 600px; padding: var(--s5) var(--s5) var(--s6); display: flex; flex-direction: column; gap: var(--s4); }
.back { display: none; }
.d-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--s1); }
.d-head .line1 { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.d-no { font-family: var(--mono); font-size: 22px; letter-spacing: -.01em; color: var(--muted); margin: 0; font-weight: 400; }
.d-no b { color: var(--ink); }
.d-head .who { font-size: 15px; }
.d-head .who .city { color: var(--muted); }
.d-head .meta { color: var(--muted); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--surface); }
.chip.s-待发货 { background: var(--caramel-soft); color: var(--caramel-ink); }
.chip.s-退款中 { background: var(--red-soft); color: var(--red); }
.chip.s-已发货 { color: var(--blue); }
.chip.s-已完成 { color: var(--green); }

.callout { border-radius: var(--r1); padding: var(--s3) var(--s4); font-size: 14.5px; line-height: 1.6; }
.callout .lb { display: block; font-size: 12px; font-weight: 700; margin-bottom: 2px; }
.callout.note { background: var(--caramel-soft); border: 1px solid oklch(88% 0.06 80); }
.callout.note .lb { color: var(--caramel-ink); }
.callout.reason { background: var(--red-soft); border: 1px solid oklch(87% 0.05 25); }
.callout.reason .lb { color: var(--red); }
.callout.info { background: var(--surface); }
.callout.info .lb { color: var(--muted); }

/* 进度 */
.track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); }
.track li { position: relative; padding-top: 18px; font-size: 13px; min-width: 0; }
.track li::before { content: ""; position: absolute; top: 4px; left: 0; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--paper); z-index: 1; }
.track li::after { content: ""; position: absolute; top: 9px; left: 12px; right: 4px; height: 1.5px; background: var(--line); }
.track li:last-child::after { display: none; }
.track li.done::before { background: var(--roast-3); border-color: var(--roast-3); }
.track li.done::after { background: var(--roast-3); }
.track li.now::before { border-color: var(--caramel-ink); border-width: 2px; box-shadow: 0 0 0 3px var(--caramel-soft); }
.track li.alert::before { background: var(--red); border-color: var(--red); border-radius: 2px; transform: rotate(45deg); width: 9px; height: 9px; }
.track li.off::before { background: var(--grey); border-color: var(--grey); border-radius: 2px; transform: rotate(45deg); width: 9px; height: 9px; }
.track .k { font-weight: 700; display: block; }
.track .v { color: var(--muted); display: block; font-size: 12.5px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.track li.alert .k { color: var(--red); }

.receipt {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r1);
  padding: var(--s4) var(--s4) var(--s3);
}
.receipt h3 { margin: 0 0 var(--s2); font-size: 12.5px; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
.receipt h3 span { font-weight: 400; }
.rc-items { list-style: none; margin: 0; padding: 0; }
.rc-items li { display: grid; grid-template-columns: minmax(0, 1fr) auto 5.5em; gap: var(--s3); padding: 7px 0; align-items: baseline; }
.rc-items .nm { font-size: 14.5px; }
.rc-items .px { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rc-items .px b { color: var(--ink); }
.rc-items .lt { text-align: right; font-variant-numeric: tabular-nums; }
.rc-sum { border-top: 1px dashed var(--line-2); margin-top: var(--s2); padding-top: var(--s2); display: grid; grid-template-columns: 1fr auto; row-gap: 4px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rc-sum dt, .rc-sum dd { margin: 0; }
.rc-sum dd { text-align: right; }
.rc-sum .total { color: var(--ink); font-size: 15px; font-weight: 700; padding-top: 4px; }
.rc-sum .refunded { color: var(--red); font-weight: 700; }
.rc-ship { border-top: 1px dashed var(--line-2); margin-top: var(--s3); padding-top: var(--s2); font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.rc-ship .tn { font-family: var(--mono); color: var(--ink); }

/* 操作区 */
.act { background: var(--paper); border: 1px solid var(--line-2); border-radius: var(--r2); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.act.primary-act { border-color: oklch(80% 0.07 70); box-shadow: 0 1px 0 oklch(90% 0.03 70); }
.act h3 { margin: 0; font-size: 16px; }
.act .sub { margin: -6px 0 0; color: var(--muted); font-size: 13px; }
.fields { display: flex; flex-wrap: wrap; gap: var(--s3); }
.fld { display: flex; flex-direction: column; gap: var(--s1); font-size: 12.5px; color: var(--muted); }
.fld.grow { flex: 1 1 14rem; }
.fld input, .fld select, .fld textarea {
  height: 40px; border: 1px solid var(--line-2); border-radius: var(--r1); background: #fff; padding: 0 var(--s3); font-size: 15px; color: var(--ink);
}
.fld textarea { height: auto; min-height: 72px; padding: var(--s2) var(--s3); resize: vertical; line-height: 1.6; font-size: 14px; }
.fld input.tn-in { font-family: var(--mono); letter-spacing: .02em; text-transform: uppercase; }
.fld input[aria-invalid="true"] { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.money-in { position: relative; display: flex; align-items: center; }
.money-in span { position: absolute; left: var(--s3); color: var(--muted); font-size: 15px; }
.money-in input { padding-left: 26px; width: 9em; font-variant-numeric: tabular-nums; }
.err { margin: 0; color: var(--red); font-size: 13px; }
.btns { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); }
.btn { height: 40px; padding: 0 var(--s4); border-radius: var(--r1); border: 1px solid var(--line-2); background: #fff; font-size: 14.5px; font-weight: 700; white-space: nowrap; }
.btn:hover { background: var(--surface); }
.btn.primary { background: var(--roast); border-color: var(--roast); color: var(--cream); }
.btn.primary:hover { background: var(--roast-3); }
.btn.danger { background: #fff; border-color: oklch(80% 0.07 27); color: var(--red); }
.btn.danger:hover { background: var(--red-soft); }
.btn.link { border: 0; background: none; color: var(--muted); padding: 0; height: auto; font-weight: 400; text-decoration: underline; text-underline-offset: 3px; }
.btn.link:hover { color: var(--ink); background: none; }
.hint { color: var(--muted); font-size: 12.5px; }
.secondary-act { display: flex; flex-direction: column; gap: var(--s3); border-top: 1px dashed var(--line-2); padding-top: var(--s3); }
.log { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted); }
.log li { padding: 2px 0; }
.log b { color: var(--ink); font-weight: 400; }

.d-empty { padding: var(--s6) var(--s5); color: var(--muted); }
.d-empty h2 { font-size: 17px; color: var(--ink); margin: 0 0 var(--s2); }

/* ---------- 提示条 ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  display: flex; align-items: center; gap: var(--s4);
  background: var(--roast); color: var(--cream); border-radius: var(--r2);
  padding: 10px var(--s3) 10px var(--s4); font-size: 14px; max-width: calc(100vw - 32px);
  box-shadow: 0 8px 24px oklch(20% 0.03 50 / .28);
  z-index: 50;
}
.toast button { border: 0; background: var(--roast-3); color: var(--cream); border-radius: var(--r1); padding: 4px 12px; font-weight: 700; }

/* ---------- 中等宽度：概览移到列表上方 ---------- */
@media (max-width: 1099px) {
  .app { grid-template-columns: minmax(330px, 400px) minmax(0, 1fr); grid-template-areas: "top top" "side detail"; }
  .top { grid-template-columns: auto minmax(0, 1fr) auto; }
  .side { display: block; grid-area: side; overflow: auto; background: var(--paper); border-right: 1px solid var(--line); }
  .ov, .list-pane { overflow: visible; }
  .list-pane { border-right: 0; }
  .ov { gap: var(--s4); padding: var(--s3) var(--s4) var(--s4); }
  .tiles { grid-template-columns: 1fr 1fr; }
  .tile { padding: var(--s2) var(--s3); column-gap: var(--s2); }
  .tile .n { font-size: 26px; }
  .others { flex-direction: row; flex-wrap: wrap; gap: var(--s2); }
  .others .cap { display: none; }
  .others .ov-btn { flex: none; width: auto; gap: var(--s2); border: 1px solid var(--roast-line); border-radius: 999px; padding: 4px 12px; }
  .others .ov-btn[aria-pressed="true"] { box-shadow: none; border-color: var(--caramel); }
  .pick { padding-top: var(--s3); }
  .pick summary { padding: 0 var(--s1); }
  .pick summary .t::after { content: " ▾"; color: var(--cream-2); font-weight: 400; }
  .pick[open] summary .t::after { content: " ▴"; }
  .pick ul { padding: var(--s2) var(--s1) 0; }
  .notice { padding: 0 var(--s1); }
  .today-line .new { display: none; }
}

/* ---------- 手机：列表与详情分两步 ---------- */
@media (max-width: 759px) {
  .app { display: block; height: auto; }
  .top { grid-template-columns: 1fr auto; grid-template-areas: "brand date" "search search"; row-gap: var(--s2); padding: var(--s3) var(--s4) var(--s3); }

const md = d => `${d.getMonth() + 1}月${d.getDate()}日`;

const cmp = dir => (a, b) => (a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : a.order_no.localeCompare(b.order_no)) * (dir === 'asc' ? 1 : -1);

function computeList() {
  const toks = tokens(state.q);
  if (toks.length) {
    const arr = orders.filter(o => { const h = hay(o); return toks.every(t => h.includes(t)); }).sort(cmp('desc'));
    return { groups: groupByDate(arr), flat: arr, mixed: true, toks, search: true, group: 'date' };
  }
  const v = VIEWS[state.view];
  const arr = orders.filter(v.match).sort(cmp(v.order));
  let groups;
  if (v.group === 'status') {
    groups = [
      { key: 'refund', title: '退款申请', cls: 'refund', items: arr.filter(o => o.status === '退款中') },
      { key: 'ship', title: '待发货 · 先下单的排在前面', cls: '', items: arr.filter(o => o.status === '待发货') }
    ].filter(g => g.items.length);
  } else groups = groupByDate(arr);
  return { groups, flat: groups.flatMap(g => g.items), mixed: !!v.mixed, toks: [], search: false, group: v.group };
}
function groupByDate(arr) {
  const out = [];
  for (const o of arr) {
    const k = o.created_at.slice(0, 10);
    let g = out[out.length - 1];
    if (!g || g.key !== k) { g = { key: k, title: dayHeader(k), items: [] }; out.push(g); }
    g.items.push(o);
  }
  return out;
}

/* ---------- 概览 ---------- */
function renderOverview() {
  const count = s => orders.filter(o => o.status === s).length;

  const refund = orders.filter(o => o.status === '退款中');
  $('#cTodo').textContent = ship.length + refund.length;
  $('#cShip').textContent = ship.length;
  $('#cRefund').textContent = refund.length;
  $('.tile.ship').classList.toggle('zero', !ship.length);
  $('.tile.refund').classList.toggle('zero', !refund.length);
  const oldest = ship.reduce((m, o) => Math.max(m, ageDays(o.created_at)), -1);
  $('#sShip').textContent = !ship.length ? '都发完了' : oldest >= 2 ? `最久的已等 ${oldest} 天` : oldest === 1 ? '最早是昨天下的单' : '都是今天下的单';
  $('#sRefund').textContent = refund.length ? `涉及 ${money(refund.reduce((a, o) => a + o.paid, 0))}` : '没有待处理的申请';
  for (const s of ['待付款', '已发货', '已完成', '已退款']) $('#c' + s).textContent = count(s);
  $('#vRefunded').hidden = !count('已退款');
  $('#cAll').textContent = orders.length;
  $('#newToday').textContent = ` · 今天新订单 ${orders.filter(o => ageDays(o.created_at) === 0).length} 单`;

  const pick = new Map();
  for (const o of ship) for (const i of o.items) pick.set(i.item, (pick.get(i.item) || 0) + i.qty);
  const rows = [...pick].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh'));
  const total = rows.reduce((a, r) => a + r[1], 0);
  $('#pickC').textContent = total ? `${ship.length} 单 · ${total} 件` : '';
  $('#pickList').innerHTML = rows.length
    ? rows.map(([n, q]) => `<li><span>${esc(n)}</span><span class="q">×${q}</span></li>`).join('')
    : '<li class="empty">没有要发的货</li>';

  const active = state.q ? null : state.view;
  document.querySelectorAll('.ov [data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === active)));

/* ---------- 列表 ---------- */

/* ---------- 详情 ---------- */

  return `<ol class="track">${steps.map(s => {

let shownNo = null;

/* ---------- 渲染与选择 ---------- */
function render(opts = {}) {
  renderOverview();
  const L = renderList();
  if (!opts.keepSel || !L.flat.some(o => o.order_no === state.sel)) {
    if (!L.flat.some(o => o.order_no === state.sel)) state.sel = isNarrow() ? null : (L.flat[0] && L.flat[0].order_no) || null;
  }
  markSelected();
  renderDetail();
}
function markSelected() {
  document.querySelectorAll('.row').forEach(r => r.setAttribute('aria-current', String(r.dataset.no === state.sel)));
}
function select(no, { open = true, scroll = false, focus = false } = {}) {
  if (state.sel !== no) state.panel = null;
  state.sel = no;
  markSelected();
  renderDetail();
  $('#detailPane').scrollTop = 0;
  const row = document.querySelector(`.row[data-no="${no}"]`);
  if (row && scroll) row.scrollIntoView({ block: 'nearest' });
  if (row && focus) row.focus({ preventScroll: !scroll });
  if (isNarrow() && open) openDetail();
}
function openDetail() { $('#app').classList.add('show-detail'); document.body.classList.add('lock'); $('#detailPane').scrollTop = 0; setTimeout(() => { const b = $('.back'); b && b.focus({ preventScroll: true }); }, 30); }
function closeDetail() {
  $('#app').classList.remove('show-detail'); document.body.classList.remove('lock');
  const row = document.querySelector(`.row[data-no="${state.sel}"]`); row && row.focus({ preventScroll: false });
}
function setView(v) {
  state.view = v; state.q = ''; $('#q').value = ''; syncSearchUI();
  state.sel = null; state.panel = null;
  render();
  $('.list-pane').scrollTop = 0;

}

/* ---------- 操作 ---------- */
function draft(no) { return (state.drafts[no] ||= { carrier: '顺丰速运', tn: '', err: '' }); }
function validateTN(carrier, raw, selfNo) {
  const tn = raw.replace(/\s+/g, '').toUpperCase();
  if (!tn) return [tn, '请填写运单号。'];
  if (carrier === '顺丰速运' && !/^SF\d{12,13}$/.test(tn)) return [tn, '顺丰运单号是 SF 加 12 位数字，请对照面单再看一下。'];
  if (carrier !== '顺丰速运' && !/^[A-Z0-9]{8,20}$/.test(tn)) return [tn, '运单号应为 8–20 位字母或数字。'];
  const dup = orders.find(o => o.order_no !== selfNo && o.tracking_no && o.tracking_no.toUpperCase() === tn);
  if (dup) return [tn, `这个运单号已经用在订单 ${dup.order_no}（${dup.customer}）上了。`];
  return [tn, ''];
}
function doShip(o) {
  const d = draft(o.order_no);
  d.carrier = $('#carrier').value; d.tn = $('#tn').value;
  const [tn, err] = validateTN(d.carrier, d.tn, o.order_no);
  if (err) { d.err = err; renderDetail(); const i = $('#tn'); i.focus(); i.select(); return; }
  const nxt = nextInList(o.order_no);
  const prev = { status: o.status, tracking_no: o.tracking_no, carrier: o.carrier, log: [...o.log] };
  o.status = '已发货'; o.tracking_no = tn; o.carrier = d.carrier;
  o.log.push({ t: `今天 ${nowStamp()}`, text: `发货：${d.carrier} ${tn}` });
  delete state.drafts[o.order_no];
  state.sel = nxt ? nxt.order_no : null; state.panel = null;
  render({ keepSel: true });
  if (state.sel) { const r = document.querySelector(`.row[data-no="${state.sel}"]`); r && r.scrollIntoView({ block: 'nearest' }); }
  if (!state.sel && isNarrow()) closeDetail();
  else if (state.sel && !isNarrow()) setTimeout(() => { const i = $('#tn'); i && i.focus(); }, 0);
  toast(`${o.order_no.slice(-4)} ${o.customer} 已发货 · ${d.carrier} ${tn}`, () => {
    Object.assign(o, prev); state.drafts[o.order_no] = { carrier: prev.carrier || d.carrier, tn, err: '' };
    state.sel = o.order_no; render({ keepSel: true }); select(o.order_no, { scroll: true });
    toast(`已撤销 ${o.order_no.slice(-4)} 的发货`);
  });
}
function doRefund(o) {
  const d = draft(o.order_no);
  const raw = $('#ramt').value.trim(); d.amt = raw;
  const n = Number(raw);
  let err = '';
  if (!raw || !Number.isFinite(n) || n <= 0) err = '请填写大于 0 的退款金额。';
  else if (n > o.paid) err = `退款金额不能超过实付 ${money(o.paid)}。`;
  else if (!/^\d+(\.\d{1,2})?$/.test(raw)) err = '金额最多保留两位小数。';
  if (err) { d.rerr = err; renderDetail(); const i = $('#ramt'); i.focus(); i.select(); return; }
  const amt = Math.round(n * 100) / 100;
  const rn = $('#rnote') ? $('#rnote').value.trim() : '';
  const wasRequest = o.status === '退款中';
  const nxt = nextInList(o.order_no);
  o.status = '已退款'; o.refunded = amt;
  o.log.push({ t: `今天 ${nowStamp()}`, text: `${wasRequest ? '同意退款申请' : '退款'} ${money(amt)}${amt < o.paid ? '（部分）' : ''}${rn ? '：' + rn : ''}` });
  delete state.drafts[o.order_no]; state.panel = null;
  if (wasRequest || state.view !== 'all') state.sel = nxt ? nxt.order_no : null;
  render({ keepSel: true });
  if (!state.sel && isNarrow()) closeDetail();
  toast(`已给 ${o.customer} 退款 ${money(amt)}（${o.order_no.slice(-4)}）`);
}
function doReject(o) {
  const d = draft(o.order_no);
  d.reason = $('#rreason').value.trim();
  if (!d.reason) { d.jerr = '请写上拒绝理由。'; renderDetail(); $('#rreason').focus(); return; }
  const back = o.tracking_no ? '已发货' : '待发货';
  const nxt = nextInList(o.order_no);
  o.status = back;
  o.log.push({ t: `今天 ${nowStamp()}`, text: `拒绝退款申请：${d.reason}` });
  delete state.drafts[o.order_no]; state.panel = null;
  state.sel = o.order_no;
  render({ keepSel: true });
  toast(`已拒绝 ${o.order_no.slice(-4)} 的退款申请，订单回到${back}`);
}

let toastTimer;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">撤销</button>' : ''}`;
  t.hidden = false;
  if (undo) t.querySelector('button').onclick = () => { t.hidden = true; undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 7000 : 4000);
}

/* ---------- 事件 ---------- */
function syncSearchUI() { const has = !!$('#q').value; $('#qClear').hidden = !has; $('#kbd').hidden = has; }
$('#q').addEventListener('input', e => { state.q = e.target.value; syncSearchUI(); state.panel = null; render(); $('.list-pane').scrollTop = 0; });
function clearQ() { $('#q').value = ''; state.q = ''; syncSearchUI(); render(); }
$('#qClear').addEventListener('click', () => { clearQ(); $('#q').focus(); });
$('#listClear').addEventListener('click', clearQ);

document.querySelector('.ov').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
$('#list').addEventListener('click', e => {
  const r = e.target.closest('.row'); if (r) return select(r.dataset.no);
  if (e.target.closest('[data-act="clear-q"]')) clearQ();
  const go = e.target.closest('[data-view-go]'); if (go) setView(go.dataset.viewGo);
});
$('#detailPane').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const o = byNo(state.sel); const act = b.dataset.act;
  if (act === 'back') return closeDetail();
  if (!o) return;
  if (act === 'ship') doShip(o);
  else if (act === 'refund') doRefund(o);
  else if (act === 'reject-open') { state.panel = 'reject'; renderDetail(); $('#rreason').focus(); }
  else if (act === 'self-refund-open') { state.panel = 'self-refund'; renderDetail(); $('#ramt').focus(); }
  else if (act === 'panel-close') { state.panel = null; renderDetail(); }
  else if (act === 'reject') doReject(o);
});
$('#detailPane').addEventListener('input', e => {
  const o = byNo(state.sel); if (!o) return;
  const d = draft(o.order_no);
  if (e.target.id === 'tn') { d.tn = e.target.value; if (d.err) { d.err = ''; e.target.setAttribute('aria-invalid', 'false'); $('#tnErr').hidden = true; } }
  if (e.target.id === 'ramt') { d.amt = e.target.value; d.rerr = ''; $('#rErr').hidden = true; $('#refundBtn').textContent = ($('#refundBtn').textContent.startsWith('同意') ? '同意退款 ' : '确认退款 ') + fmtAmt(e.target.value); }
  if (e.target.id === 'rreason') { d.reason = e.target.value; if (d.jerr) { d.jerr = ''; $('#jErr').hidden = true; } }
  if (e.target.id === 'rnote') d.rnote = e.target.value;
});
$('#detailPane').addEventListener('change', e => {
  if (e.target.id !== 'carrier') return;
  const d = draft(state.sel); d.carrier = e.target.value; d.err = '';
  $('#tn').placeholder = d.carrier === '顺丰速运' ? 'SF 加 12 位数字' : '快递面单上的单号';
  $('#tnErr').hidden = true; $('#tn').setAttribute('aria-invalid', 'false');
});
$('#detailPane').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const o = byNo(state.sel); if (!o) return;
  if (e.target.id === 'tn') { e.preventDefault(); doShip(o); }
  else if (e.target.id === 'ramt' || e.target.id === 'rnote') { e.preventDefault(); doRefund(o); }
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); if (isNarrow()) closeDetail(); $('#q').focus(); $('#q').select(); return; }
  if (e.key === 'Escape') {
    if ($('#app').classList.contains('show-detail')) return closeDetail();
    if (state.panel) { state.panel = null; renderDetail(); return; }
    if (document.activeElement === $('#q') && $('#q').value) return clearQ();
    if (typing) document.activeElement.blur();
    return;
  }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !typing && !isNarrow()) {
    const f = current.flat; if (!f.length) return;
    e.preventDefault();
    let i = f.findIndex(o => o.order_no === state.sel);
    i = e.key === 'ArrowDown' ? Math.min(f.length - 1, i + 1) : Math.max(0, i - 1);
    select(f[i].order_no, { scroll: true, focus: true, open: false });
  }
});
$('#q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && current.flat.length) { e.preventDefault(); select(state.sel || current.flat[0].order_no, { scroll: true, focus: true, open: false }); }
  if (e.key === 'Enter' && current.flat.length === 1) { select(current.flat[0].order_no); }
});
matchMedia('(max-width: 759px)').addEventListener('change', () => { $('#app').classList.remove('show-detail'); document.body.classList.remove('lock'); render({ keepSel: true }); });
matchMedia('(max-width: 1099px)').addEventListener('change', setPickOpen);
function setPickOpen() { $('#pick').open = !matchMedia('(max-width: 1099px)').matches; }

setPickOpen();
render();
</script>
</body>
