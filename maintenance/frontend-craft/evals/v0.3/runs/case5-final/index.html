<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>订单 · 慢火咖啡</title>
<style>
:root{
  --h: 240;
  --bg:        oklch(98.4% .004 var(--h));
  --paper:     #fff;
  --surface:   oklch(96.6% .007 var(--h));
  --surface-2: oklch(94.2% .010 var(--h));
  --line:      oklch(91% .008 var(--h));
  --line-2:    oklch(85% .012 var(--h));
  --muted:     oklch(52% .018 var(--h));
  --ink-2:     oklch(38% .022 var(--h));
  --ink:       oklch(25% .025 var(--h));
  --brand:     oklch(44% .07 var(--h));
  --brand-dk:  oklch(38% .07 var(--h));
  --brand-soft:oklch(95.5% .012 var(--h));
  --crema:     oklch(64% .06 60);
  --warn:      oklch(52% .07 70);
  --warn-soft: oklch(96.5% .015 75);
  --danger:    oklch(50% .09 22);
  --danger-soft: oklch(96.5% .010 22);
  --ok:        oklch(50% .06 175);
  --ok-soft:   oklch(96.5% .012 175);

  --sans: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",sans-serif;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Ubuntu Mono",monospace;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:40px;
  --r1:6px; --r2:10px;
  --top: 56px;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);line-break:strict;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.nw{white-space:nowrap}
mark{background:oklch(93% .045 85);color:inherit;border-radius:2px;padding:0 1px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 骨架：顶栏 + 三栏工作区 ---------- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr) 472px;grid-template-rows:var(--top) minmax(0,1fr);height:100vh;height:100dvh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:var(--s5);padding:0 var(--s4);background:var(--paper);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;width:232px;flex:none;font-size:16px;font-weight:700;letter-spacing:.02em}
.brand svg{flex:none}
.brand small{font-size:14px;font-weight:400;color:var(--muted);padding-left:10px;border-left:1px solid var(--line-2);letter-spacing:0}
.search{flex:1;max-width:540px;display:flex;align-items:center;gap:var(--s2);height:38px;padding:0 6px 0 12px;background:var(--surface);border:1px solid transparent;border-radius:var(--r1)}
.search:focus-within{background:var(--paper);border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:14px}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{font:12px/18px var(--mono);color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 6px;background:var(--paper)}
.search .x{border:0;background:none;color:var(--muted);height:28px;padding:0 8px;border-radius:4px;font-size:13px}
.search .x:hover{background:var(--surface-2);color:var(--ink)}

.keys{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.keys kbd{font:11px/16px var(--mono);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;margin-right:2px;background:var(--paper)}
.side{display:contents}
.rail{grid-column:1;grid-row:2;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:var(--s4) var(--s4) var(--s6);display:flex;flex-direction:column;gap:20px}
.list{grid-column:2;grid-row:2;overflow:auto;background:var(--paper)}
.detail{grid-column:3;grid-row:2;overflow:auto;background:var(--paper);border-left:1px solid var(--line)}

/* ---------- 左栏：今天要处理 ---------- */
.today{display:grid;gap:var(--s2)}
.eyebrow{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:var(--s2)}
.eyebrow b{color:var(--ink-2);font-weight:600}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.numbtn{display:grid;align-content:start;gap:2px;text-align:left;padding:12px 12px 10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);min-width:0}
.numbtn:hover{border-color:var(--line-2)}
.numbtn .big{font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.numbtn .lbl{font-size:14px;font-weight:600;color:var(--ink)}
.numbtn small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.numbtn.ship .big{color:var(--brand)}
.numbtn.refund .big{color:var(--danger)}
.numbtn.zero .big{color:var(--line-2)}
.numbtn[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}

.nav{display:grid;gap:2px}
.nav h2{font-size:12px;font-weight:400;color:var(--muted);margin:0 0 var(--s1) 10px}
.navbtn{display:flex;align-items:center;gap:var(--s2);height:32px;padding:0 10px;border:0;background:transparent;border-radius:var(--r1);text-align:left;color:var(--ink-2)}
.navbtn:hover{background:var(--surface-2)}
.navbtn .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.navbtn[aria-pressed="true"]{background:var(--paper);color:var(--brand);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.navbtn[aria-pressed="true"] .n{color:var(--brand)}
.mk{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.mk.s-refund{background:var(--danger)}
.mk.s-ship{background:var(--brand)}
.mk.s-unpaid{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.mk.s-sent{background:var(--ok)}
.mk.s-done{background:var(--line-2)}
.mk.s-closed{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.mk.s-todo{background:linear-gradient(90deg,var(--danger) 50%,var(--brand) 50%)}

/* 备货单：像吧台出的小票 */
.pick{position:relative;background:var(--paper);padding:14px 14px 16px;margin-bottom:8px;border-radius:var(--r1) var(--r1) 0 0}
.pick::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:7px;
  background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/10px 7px repeat-x,
             linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/10px 7px repeat-x}
.pick summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px var(--s2)}
.pick summary::-webkit-details-marker{display:none}
.pick summary h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.pick summary h2::before{content:"";width:6px;height:14px;border-radius:2px;background:var(--crema)}
.pick summary .tot{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pick summary p{grid-column:1/-1;font-size:12px;color:var(--muted)}
.pick .chev{display:none}
.receipt{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px dashed var(--line-2)}
.receipt li button{display:grid;grid-template-columns:1fr auto;gap:var(--s3);width:100%;text-align:left;border:0;background:none;padding:5px 4px;margin:0 -4px;width:calc(100% + 8px);border-radius:4px;font-size:13px;line-height:1.4;color:var(--ink-2)}
.receipt li button:hover{background:var(--surface)}
.receipt li button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}
.receipt li span:first-child{word-break:keep-all;overflow-wrap:anywhere}
.receipt .qty{font:600 13px var(--mono);color:var(--ink)}
.receipt-foot{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-2);font-size:12px;color:var(--muted)}
.receipt-foot b{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pick-empty{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2);font-size:13px;color:var(--muted)}

/* ---------- 中栏：订单列表 ---------- */
.list-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--s1) var(--s3);padding:14px var(--s4) 12px}
.list-head h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
.list-head h1 .c{font-size:14px;font-weight:400;color:var(--muted);margin-left:6px}
.qinfo{font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in oklch,var(--brand) 35%,transparent)}
.linkbtn:hover{text-decoration-color:var(--brand)}

.grp-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:var(--s2);padding:8px var(--s4);background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink)}
.grp-h .n{font-weight:400;color:var(--muted)}
.grp-h .meta{margin-left:auto;font-weight:400;color:var(--muted);white-space:nowrap}
.rows{list-style:none;margin:0;padding:0}
.rows li+li .row{border-top:1px solid var(--line)}
.row{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:2px var(--s3);width:100%;padding:12px var(--s4);border:0;background:none;text-align:left;align-items:start}
.row:hover{background:var(--bg)}
.row[aria-current="true"]{background:var(--brand-soft)}
.row[aria-current="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.row:focus-visible{outline-offset:-2px}
.when{display:grid;font-size:13px;line-height:1.4;color:var(--muted);padding-top:2px}
.when b{font-weight:500;color:var(--ink-2)}
.row.late .when b{color:var(--warn);font-weight:600}
.main{display:grid;gap:3px;min-width:0}
.who{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px;font-size:15px;font-weight:600;line-height:1.4}
.who .city{font-size:13px;font-weight:400;color:var(--muted)}
.what{font-size:13px;line-height:1.55;color:var(--ink-2);word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.what .it+.it::before{content:"、";color:var(--muted)}
.q{display:inline-block;margin-left:4px;padding:0 5px;border-radius:4px;background:var(--surface-2);font:600 12px/18px var(--sans);color:var(--ink);font-variant-numeric:tabular-nums;vertical-align:1px}
.reason{font-size:13px;color:var(--danger)}
.say{display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--warn)}
.say svg{flex:none;margin-top:3px}
.amt{display:grid;justify-items:end;gap:3px;text-align:right;padding-top:1px}
.amt b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.4}
.amt b.dim{color:var(--muted);font-weight:500}
.amt .sub{font-size:12px;color:var(--muted)}
.ono{font:12px/1.4 var(--mono);color:var(--muted);letter-spacing:.01em}
.amt .mwhen{display:none;font-size:12px;color:var(--muted)}

.empty{padding:var(--s6) var(--s4);display:grid;gap:var(--s2);justify-items:start;max-width:30em}
.empty b{font-size:16px}
.empty p{color:var(--muted)}
.list-foot{padding:var(--s4) var(--s4) var(--s6);display:grid;gap:var(--s3);font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.list-foot .local{font-size:12px}

/* ---------- 右栏：订单详情与处理 ---------- */
.dbar{display:none}
.d{padding:20px var(--s5) var(--s6);display:grid;gap:20px}
.d-head{display:grid;gap:6px}
.d-l1{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2) var(--s3)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.pill.s-refund{background:var(--danger-soft);color:var(--danger)}
.pill.s-ship{background:var(--brand-soft);color:var(--brand)}
.pill.s-sent{background:var(--ok-soft);color:var(--ok)}
.pill.s-unpaid,.pill.s-done,.pill.s-closed{background:var(--surface-2);color:var(--ink-2)}
.d-l1 .ono{font-size:13px;color:var(--ink-2)}
.copy{border:1px solid var(--line);background:var(--paper);border-radius:4px;height:24px;padding:0 8px;font-size:12px;color:var(--muted)}
.copy:hover{color:var(--ink);border-color:var(--line-2)}
.d-who{font-size:22px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.d-who span{font-size:15px;font-weight:400;color:var(--ink-2)}
.d-meta{font-size:13px;color:var(--muted)}
.d-meta .late{color:var(--warn);font-weight:600}

.flow{list-style:none;margin:6px 0 0;padding:0;display:flex;font-size:12px;color:var(--muted)}
.flow li{flex:1;display:grid;justify-items:start;gap:4px;position:relative;min-width:0}
.flow li::before{content:"";width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-2);background:var(--paper);position:relative;z-index:1}
.flow li::after{content:"";position:absolute;left:9px;right:0;top:4px;height:1.5px;background:var(--line)}
.flow li:last-child::after{display:none}
.flow li.done::before{background:var(--ink-2);box-shadow:none}
.flow li.done::after{background:var(--ink-2)}
.flow li.cur{color:var(--ink);font-weight:600}
.flow li.cur::before{box-shadow:0 0 0 3px var(--brand-soft),inset 0 0 0 2px var(--brand)}
.flow.refund li.cur{color:var(--danger)}
.flow.refund li.cur::before{box-shadow:0 0 0 3px var(--danger-soft),inset 0 0 0 2px var(--danger)}

.sec{display:grid;gap:10px}
.sec h3{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:baseline;gap:var(--s2)}
.sec h3 .n{font-weight:400}
.notice{display:grid;gap:6px;padding:12px 14px;border-radius:var(--r2);background:var(--warn-soft);border:1px solid color-mix(in oklch,var(--warn) 18%,transparent)}
.notice.refund{background:var(--danger-soft);border-color:color-mix(in oklch,var(--danger) 16%,transparent)}
.notice .k{font-size:12px;font-weight:600;color:var(--warn)}
.notice.refund .k{color:var(--danger)}
.notice .v{font-size:15px;line-height:1.6;color:var(--ink)}
.checks{list-style:none;margin:2px 0 0;padding:8px 0 0;border-top:1px dashed color-mix(in oklch,var(--ink) 15%,transparent);display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.checks li{display:flex;gap:6px}
.checks li::before{content:"核对";flex:none;font-size:11px;line-height:18px;height:18px;padding:0 5px;border-radius:3px;background:var(--paper);color:var(--warn);font-weight:600;margin-top:1px}

.items{width:100%;border-collapse:collapse;font-size:14px}
.items td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.items tr:first-child td{border-top:1px solid var(--line)}
.items .nm{padding-right:var(--s3);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.items .pr{text-align:right;white-space:nowrap;color:var(--muted);font-size:13px;padding-right:var(--s4);font-variant-numeric:tabular-nums}
.items .sm{text-align:right;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums;width:72px}
.items .ck{width:30px}
.items input[type=checkbox]{width:16px;height:16px;margin:3px 0 0;accent-color:var(--brand)}
.items tr.off .nm,.items tr.off .sm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.totals{display:flex;justify-content:flex-end;align-items:baseline;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted)}
.totals b{font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
.totals .paid{color:var(--ink)}
.totals .paid b{font-size:18px;font-weight:700;color:var(--ink)}

.act{display:grid;gap:14px;padding:16px;border-radius:var(--r2);background:var(--surface)}
.act > h3{font-size:15px;font-weight:700;color:var(--ink)}
.fields{display:grid;grid-template-columns:132px minmax(0,1fr);gap:var(--s3)}
.field{display:grid;gap:5px;font-size:13px;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;height:40px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--paper);color:var(--ink);font-size:15px}
.field textarea{height:auto;min-height:72px;padding:8px 10px;line-height:1.6;resize:vertical;font-size:14px}
.field input.mono{font-family:var(--mono);letter-spacing:.03em}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.field.bad input,.field.bad textarea{border-color:var(--danger)}
.field.bad input:focus,.field.bad textarea:focus{box-shadow:0 0 0 3px var(--danger-soft)}
.err{font-size:13px;color:var(--danger)}
.btns{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3)}
.btn{height:40px;padding:0 18px;border-radius:var(--r1);border:1px solid var(--line-2);background:var(--paper);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dk);border-color:var(--brand-dk)}
.btn.primary:disabled{background:var(--line-2);border-color:var(--line-2);cursor:not-allowed}
.btn.quiet{border-color:transparent;background:transparent;color:var(--danger);padding:0 10px}
.btn.quiet:hover{background:var(--danger-soft)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.hint{font-size:12px;color:var(--muted)}
.amtline{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2) var(--s3)}
.amtline label{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.amtline .money{display:flex;align-items:center;height:40px;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--paper);padding:0 0 0 10px}
.amtline .money:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.amtline .money.bad{border-color:var(--danger)}
.amtline input{width:84px;height:100%;border:0;outline:none;background:transparent;font:600 16px var(--sans);font-variant-numeric:tabular-nums;padding:0 8px 0 4px}
.reject{display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.record{display:grid;gap:4px;padding:14px 16px;border-radius:var(--r2);background:var(--surface);font-size:14px}
.record .k{font-size:12px;color:var(--muted)}
.record .mono{font-size:15px;letter-spacing:.02em}
.record .line{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.d-empty{padding:var(--s6) var(--s5);color:var(--muted);display:grid;gap:6px}
.d-empty b{color:var(--ink);font-size:15px}

/* ---------- 提示条 ---------- */
.toast{position:fixed;left:0;right:0;margin-inline:auto;width:max-content;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateY(20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:var(--s3);max-width:calc(100vw - 32px);padding:10px 10px 10px 16px;border-radius:var(--r2);background:var(--ink);color:#fff;font-size:14px;box-shadow:0 8px 24px oklch(20% .03 var(--h) / .22);transition:opacity .18s,transform .18s;z-index:50}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast.bad{background:var(--danger)}
.toast button{flex:none;white-space:nowrap;border:0;background:oklch(100% 0 0 / .14);color:#fff;height:30px;padding:0 12px;border-radius:var(--r1);font-weight:600}
.toast button:hover{background:oklch(100% 0 0 / .24)}

/* ---------- 中等宽度：左栏收到列表上方 ---------- */
@media (max-width:1179px){
  .app{grid-template-columns:minmax(0,1fr) 440px}
  .side{display:block;grid-column:1;grid-row:2;overflow:auto;background:var(--paper)}

  return out;
}

/* ---------- 列表计算 ---------- */
function compute() {
  const os = all(), toks = tokens(), searching = toks.length > 0;
  const f = searching ? {title:'搜索结果', statuses:null} : FILTERS[st.filter];
  const inFilter = os.filter(o => !f.statuses || f.statuses.includes(o.status));
  const itemOk = o => !st.item || o.items.some(i => i.item === st.item);
  const shown = inFilter.filter(o => (searching || itemOk(o)) && (!searching || matches(o, toks)));
  const statuses = f.statuses || GROUPS.map(g => g.s);
  const groups = statuses.map(s => {
    const g = GMAP[s];
    const rows = shown.filter(o => o.status === s).sort((a, b) => g.asc ? a.created_at.localeCompare(b.created_at) : b.created_at.localeCompare(a.created_at));
    return {...g, rows, total: os.filter(o => o.status === s).length};
  });
  const flat = groups.flatMap(g => g.rows);
  return {os, toks, f, groups, flat, searching};
}

/* ---------- 中栏 ---------- */
function itemHTML(name, qty) {

/* ---------- 右栏 ---------- */

  const shipRow = pickable && o.shipping_fee > 0 ? `<tr class="${r.ship ? '' : 'off'}"><td class="ck"><input type="checkbox" data-pick="ship" ${r.ship ? 'checked' : ''} aria-label="退运费"></td><td class="nm">运费</td><td class="pr"></td><td class="sm">${yuan(o.shipping_fee)}</td></tr>` : '';

function totalsHTML(o) {

function refundSum(o) {

  return o.items.reduce((a, i, k) => a + (r.items[k] ? i.price * i.qty : 0), 0) + (r.ship ? o.shipping_fee : 0);

    h += `<div class="record"><span class="k">已同意退款</span><span><b>${yuan(o.refund_amount)}</b>${o.refund_items?.length ? ` · ${esc(o.refund_items.join('、'))}` : ''}</span><span class="hint">${esc(o.refunded_at)} 在本页记录</span></div>`;
  } else if (o.status === '退款已拒绝') {

/* ---------- 交互 ---------- */
function render(opts = {}) {
  app.classList.toggle('searching', tokens().length > 0);
  renderRail();
  const flat = renderList();
  if (!mqPhone.matches && (!st.sel || !flat.some(o => o.order_no === st.sel))) {
    if (!opts.keepSel) st.sel = flat[0]?.order_no || null;
    markSel();
  }
  renderDetail();
}
function markSel() { elList.querySelectorAll('.row').forEach(b => b.setAttribute('aria-current', String(b.dataset.id === st.sel))); }
function select(id, {focus = false, open = false} = {}) {
  if (st.sel !== id) st.rejectOpen = false;
  st.sel = id; markSel(); renderDetail();
  elDetail.scrollTop = 0;
  const row = elList.querySelector(`.row[data-id="${id}"]`);
  if (row) { row.scrollIntoView({block:'nearest'}); if (focus) row.focus({preventScroll:true}); }
  if (open && mqPhone.matches) openPhoneDetail();
}
function openPhoneDetail() {
  if (!app.classList.contains('show-detail')) { app.classList.add('show-detail'); history.pushState({detail:1}, ''); }
  document.documentElement.style.overflow = 'hidden';
  setTimeout(() => elDetail.querySelector('.dbar button')?.focus({preventScroll:true}), 30);
}
function closePhoneDetail(fromUI) {

  app.classList.remove('show-detail'); document.documentElement.style.overflow = '';
  if (fromUI && history.state && history.state.detail) history.back();

}
addEventListener('popstate', () => closePhoneDetail(false));

function setFilter(f) { st.filter = f; st.item = null; st.wipeArmed = false; clearQ(); render(); elList.scrollTop = 0; document.getElementById('side').scrollTop = 0; }
function clearQ() { st.q = ''; elQ.value = ''; syncQ(); }
function syncQ() { elQx.hidden = !elQ.value; document.querySelector('.search kbd').hidden = !!elQ.value; }

let toastTimer;
function toast(msg, undo, bad) {
  const t = document.getElementById('toast');
  t.className = 'toast on' + (bad ? ' bad' : '');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">撤销</button>' : ''}`;
  if (undo) t.querySelector('button').onclick = () => { undo(); t.className = 'toast'; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', undo ? 7000 : 3200);
}
function commit(no, rec, msg, nextPick) {
  const prev = records[no];
  const before = compute().flat.map(o => o.order_no);
  records[no] = rec;
  if (!rec) delete records[no];
  saveRecords();
  st.rejectOpen = false; delete st.refund[no]; delete st.drafts[no];
  if (nextPick) {
    const os = all(), idx = before.indexOf(no);
    const next = before.slice(idx + 1).concat(before.slice(0, idx)).map(n => os.find(o => o.order_no === n)).find(o => o && o.status === '待发货');
    st.sel = next ? next.order_no : no;
    if (!next && mqPhone.matches) closePhoneDetail(true);
  }
  render({keepSel:true});
  markSel();
  const row = elList.querySelector(`.row[data-id="${st.sel}"]`); if (row) row.scrollIntoView({block:'nearest'});
  elDetail.scrollTop = 0;
  if (msg) toast(msg, () => {
    if (prev) records[no] = prev; else delete records[no];
    saveRecords(); st.sel = no; render({keepSel:true}); markSel();
  });
}

function doShip(o) {
  const courier = document.getElementById('sc').value;
  const no = document.getElementById('sn').value.replace(/\s+/g, '').toUpperCase();
  const fail = m => { const e = document.getElementById('serr'); e.textContent = m; e.hidden = false; document.getElementById('snf').classList.add('bad'); document.getElementById('sn').focus(); };
  if (!no) return fail('请先填运单号。');
  if (!/^[A-Z0-9]{8,24}$/.test(no)) return fail('运单号只含字母和数字，长度 8 到 24 位。');
  const dup = all().find(x => x.tracking_no === no && x.order_no !== o.order_no);
  if (dup) return fail(`这个运单号已经用在 ${dup.order_no}（${dup.customer}，${dup.city}）。`);
  commit(o.order_no, {status:'已发货', tracking_no:no, courier, shipped_at:nowText()}, `${o.customer}（${o.city}）的订单已发货`, true);
}
function syncRefund(o) {
  const r = st.refund[o.order_no], sum = refundSum(o);
  const input = document.getElementById('ramt'); if (!input) return;
  if (r.amount == null) input.value = sum;
  const v = Number(input.value), ok = input.value.trim() !== '' && v > 0 && v <= o.paid && /^\d+(\.\d{1,2})?$/.test(input.value.trim());
  const btn = document.getElementById('rbtn'), err = document.getElementById('rerr');
  btn.disabled = !ok; btn.textContent = ok ? `同意退款 ${yuan(v)}` : '同意退款';
  document.getElementById('rmoney').classList.toggle('bad', !ok);
  err.hidden = ok; err.textContent = ok ? '' : (v > o.paid ? `不能超过实付 ${yuan(o.paid)}。` : '请填一个大于 0 的金额，最多两位小数。');
}
function doRefund(o) {
  const r = st.refund[o.order_no], v = Number(document.getElementById('ramt').value);
  const names = o.items.filter((i, k) => r.items[k]).map(i => i.item);
  if (r.ship && o.shipping_fee) names.push('运费');
  commit(o.order_no, {status:'已退款', refund_amount:v, refund_items:names, refunded_at:nowText()}, `已记为同意退款 ${yuan(v)}`, false);
}
function doReject(o) {
  const reason = document.getElementById('rjr').value.trim();
  if (!reason) { const e = document.getElementById('rjerr'); e.textContent = '写一句拒绝理由，方便之后回复买家。'; e.hidden = false; document.getElementById('rjf').classList.add('bad'); document.getElementById('rjr').focus(); return; }
  commit(o.order_no, {status:'退款已拒绝', reject_reason:reason, rejected_at:nowText()}, '已记为拒绝退款', false);
}
async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
  }
  toast(ok ? `已复制 ${text}` : '没能复制，请手动选中', null, !ok);
}

elRail.addEventListener('click', e => {
  const f = e.target.closest('[data-f]'); if (f) return setFilter(f.dataset.f);
  const it = e.target.closest('[data-item]');
  if (it) { const n = it.dataset.item; st.item = st.item === n ? null : n; st.filter = '待发货'; clearQ(); render(); elList.scrollTop = 0; if (mqPhone.matches || !mqWide.matches) document.querySelector('.list-head')?.scrollIntoView({block:'start'}); }
});
elList.addEventListener('click', e => {
  const row = e.target.closest('.row'); if (row) return select(row.dataset.id, {open:true});
  const f = e.target.closest('[data-f]'); if (f) return setFilter(f.dataset.f);
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'clear') { st.item = null; setQuery(''); }
  if (a.dataset.act === 'wipe') {
    if (!st.wipeArmed) { st.wipeArmed = true; renderList(); markSel(); return; }
    records = {}; saveRecords(); st.wipeArmed = false; render(); toast('已清除本机处理记录');
  }
});
elDetail.addEventListener('click', e => {
  const o = st.sel && byNo(st.sel);
  const c = e.target.closest('[data-copy]'); if (c) return copyText(c.dataset.copy, c);
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'back') return closePhoneDetail(true);
  if (!o) return;
  if (act === 'ship') doShip(o);
  if (act === 'refund') doRefund(o);
  if (act === 'reject-open') { st.rejectOpen = true; renderDetail(); document.getElementById('rjr')?.focus(); }
  if (act === 'reject-cancel') { st.rejectOpen = false; renderDetail(); }
  if (act === 'reject') doReject(o);
  if (act === 'revert') commit(o.order_no, null, `已恢复成“${DATA.orders.find(x => x.order_no === o.order_no).status}”`, false);
});
elDetail.addEventListener('input', e => {
  const o = st.sel && byNo(st.sel); if (!o) return;
  if (e.target.id === 'sn' || e.target.id === 'sc') {
    st.drafts[o.order_no] = {courier: document.getElementById('sc').value, no: document.getElementById('sn').value};
    if (e.target.id === 'sn') { document.getElementById('serr').hidden = true; document.getElementById('snf').classList.remove('bad'); }
  }
  if (e.target.id === 'ramt') { st.refund[o.order_no].amount = e.target.value; syncRefund(o); }
  if (e.target.id === 'rjr') { st.refund[o.order_no].reason = e.target.value; document.getElementById('rjerr').hidden = true; document.getElementById('rjf').classList.remove('bad'); }
});
elDetail.addEventListener('change', e => {
  const o = st.sel && byNo(st.sel); if (!o || !e.target.dataset.pick) return;
  const r = st.refund[o.order_no], k = e.target.dataset.pick;
  if (k === 'ship') r.ship = e.target.checked; else r.items[+k] = e.target.checked;
  r.amount = null;
  e.target.closest('tr').classList.toggle('off', !e.target.checked);
  syncRefund(o);
});
elDetail.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'sn') { e.preventDefault(); const o = byNo(st.sel); if (o) doShip(o); }
});

elQ.addEventListener('input', () => { st.q = elQ.value; st.item = null; syncQ(); render(); elList.scrollTop = 0; });
elQx.addEventListener('click', () => { setQuery(''); elQ.focus(); });

addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); elQ.focus(); elQ.select(); return; }
  if (e.key === 'Escape') {
    if (document.activeElement === elQ) { if (elQ.value) setQuery(''); else elQ.blur(); return; }
    if (app.classList.contains('show-detail')) return closePhoneDetail(true);
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (['ArrowDown','ArrowUp','j','k'].includes(e.key)) {
    const flat = compute().flat; if (!flat.length) return;
    e.preventDefault();
    let i = flat.findIndex(o => o.order_no === st.sel);
    i = (e.key === 'ArrowDown' || e.key === 'j') ? Math.min(flat.length - 1, i + 1) : Math.max(0, i - 1);
    select(flat[i].order_no, {focus:true});
  }
});
mqPhone.addEventListener('change', () => { if (!mqPhone.matches) { app.classList.remove('show-detail'); document.documentElement.style.overflow = ''; } render(); });

function setPlaceholder() { elQ.placeholder = mqPhone.matches ? '订单号、买家、商品…' : '订单号、买家、城市、商品或运单号'; }
mqPhone.addEventListener('change', setPlaceholder); setPlaceholder();
render();
</script>
</body>
