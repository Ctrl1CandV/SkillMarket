:root {
  color-scheme: light;
  --bg: #f4f2ec;
  --surface: #fffdf8;
  --ink: #1f1d1a;
  --ink-2: #4b4640;
  --muted: #76705f;
  --line: #e2dccf;
  --line-strong: #c9c1b0;
  --note-bg: #f8f4ea;
  --accent: #2c5a4c;
  --accent-soft: #e3ece8;
  --accent-on: #ffffff;
  --read: #2f6e4f;
  --read-bg: #e2f0e7;
  --reading: #8c5c10;
  --reading-bg: #f8eed6;
  --unread: #4c5d76;
  --unread-bg: #e8ecf2;
  --font-serif: "Source Han Serif SC", "思源宋体", "Noto Serif SC", "Songti SC", serif;
  --font-sans: "Source Han Sans SC", "思源黑体", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.page { max-width: 1240px; margin: 0 auto; padding: 32px 24px 56px; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* masthead */
.eyebrow { margin: 0 0 6px; font-size: 13px; color: var(--muted); letter-spacing: .04em; }
h1 { margin: 0; font-family: var(--font-serif); font-weight: 700; font-size: 30px; line-height: 1.25; }
.hint { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); }
.progress { display: flex; height: 8px; margin-top: 18px; max-width: 520px; border-radius: 999px; overflow: hidden; background: var(--line); }
.progress span { display: block; height: 100%; }
.p-read { background: var(--read); }
.p-reading { background: var(--reading); }
.p-unread { background: var(--unread); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-2); }
.dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--c); vertical-align: 1px; }
.s-read { --c: var(--read); --cbg: var(--read-bg); }
.s-reading { --c: var(--reading); --cbg: var(--reading-bg); }
.s-unread { --c: var(--unread); --cbg: var(--unread-bg); }

/* layout */
.layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 28px; align-items: start; margin-top: 28px; }
.sidebar {
  position: sticky; top: 16px;
  max-height: calc(100vh - 32px); overflow: auto;
  padding: 16px 18px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.side-head h2 { margin: 0; font-size: 15px; }
.side-actions { display: flex; align-items: center; gap: 4px; }
.ghost { background: none; border: 0; padding: 4px 8px; border-radius: 6px; font-size: 13px; color: var(--accent); }
.ghost:not(:disabled):hover { background: var(--accent-soft); }
.ghost:disabled { color: var(--muted); opacity: .6; cursor: default; }
.toggle { display: none; border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 12px; background: var(--surface); color: var(--ink); }
.group { margin-top: 18px; }
.group h3 { margin: 0 0 8px; font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.opt-list { display: grid; gap: 4px; }
.opt {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 7px 10px; border: 1px solid transparent; border-radius: 8px;
  background: none; text-align: left;
}
.opt:hover { background: var(--accent-soft); }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-on); }
.n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt[aria-pressed="true"] .n, .chip[aria-pressed="true"] .n { color: #d5e6df; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px; border: 1px solid var(--line-strong); border-radius: 999px;
  background: var(--surface); font-size: 14px;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
.group .hint { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--surface);
}

/* main */
.main { min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 16px; }
.search { flex: 1 1 280px; min-width: 0; }
.search input {
  width: 100%; padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: 10px;
  background: var(--surface);
}
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.count { margin: 0; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }

/* card */
.card {
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
  padding: 18px 20px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.card-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; font-size: 13px; color: var(--muted); }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 10px 2px 8px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; color: var(--c); background: var(--cbg);
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.title { margin: 0; font-family: var(--font-serif); font-size: 18px; font-weight: 700; line-height: 1.45; overflow-wrap: break-word; }
.title a {
  color: var(--ink); text-decoration: none;
  background: linear-gradient(var(--line-strong), var(--line-strong)) 0 100% / 100% 1px no-repeat;
}
.title a:hover { color: var(--accent); background-image: linear-gradient(var(--accent), var(--accent)); }
.authors { margin: 0; font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.more-authors summary { font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
.more-authors p { margin: 4px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 1px 9px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--note-bg); font-size: 14px; }
.note .label { display: block; margin-bottom: 2px; font-size: 12px; color: var(--muted); }
.note p { margin: 0; }
.note.empty { background: none; border: 1px dashed var(--line-strong); color: var(--muted); font-size: 13px; }
.abs summary { font-size: 13px; color: var(--muted); cursor: pointer; }
.abs p { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); }
.card-foot {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px;
  margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line);
  font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.empty {
  grid-column: 1 / -1; padding: 40px 16px; text-align: center;
  border: 1px dashed var(--line-strong); border-radius: 12px; color: var(--muted);
}
.foot { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }

/* responsive */
@media (max-width: 899px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 22px; }
  .sidebar { position: static; max-height: none; overflow: visible; }
  .toggle { display: inline-flex; }
  .filter-body { display: none; }
  .sidebar.open .filter-body { display: block; margin-top: 4px; }
}
@media (max-width: 599px) {
  .page { padding: 20px 16px 44px; }
  h1 { font-size: 24px; }
  .card { padding: 16px; }
}

</div>

function matches(p) {
  if (state.status !== '全部' && p.my_status !== state.status) return false;
  if (state.topics.size && !p.topics.some(t => state.topics.has(t))) return false;
  if (state.query) {
    const hay = [p.title, p.authors.join(' '), p.venue || '', p.topics.join(' '), p.my_note || '', p.abstract_first_sentence, p.arxiv_id]
      .join(' ').toLowerCase();
    if (!hay.includes(state.query)) return false;
  }
  return true;
}

function sorted(list) {
  const byAdded = (a, b) => b.added_on.localeCompare(a.added_on);
  const cmp = {
    default: (a, b) => (STATUS_RANK[a.my_status] - STATUS_RANK[b.my_status]) || byAdded(a, b),
    added: byAdded,
    year: (a, b) => (b.year - a.year) || byAdded(a, b),
    title: (a, b) => a.title.localeCompare(b.title, 'en'),
  }[state.sort];
  return [...list].sort(cmp);
}

function renderCard(p) {
  const cls = STATUS_CLASS[p.my_status] || '';
  const venue = p.venue ? esc(p.venue) : '<span>发表处未确认</span>';
  const authors = p.authors.length <= 3
    ? `<p class="authors">${esc(p.authors.join(', '))}</p>`
    : `<details class="more-authors"><summary>${esc(p.authors.slice(0, 3).join(', '))} 等 ${p.authors.length} 位作者</summary><p>${esc(p.authors.join(', '))}</p></details>`;
  const note = p.my_note
    ? `<div class="note"><span class="label">我的笔记</span><p>${esc(p.my_note)}</p></div>`
    : `<div class="note empty">还没有笔记</div>`;
  return `
    <article class="card">
      <div class="card-top"><span class="pill ${cls}">${esc(p.my_status)}</span><span>${esc(p.year)} · ${venue}</span></div>
      <h2 class="title"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.title)}</a></h2>
      ${authors}
      <div class="tags">${p.topics.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      ${note}
      <details class="abs"><summary>摘要首句（英文）</summary><p>${esc(p.abstract_first_sentence)}</p></details>
      <div class="card-foot"><span>arXiv ${esc(p.arxiv_id)}</span><span>加入于 ${esc(p.added_on)}</span></div>
    </article>`;
}

function buildControls() {
  $('#status-opts').innerHTML = STATUSES.map(s =>
    `<button type="button" class="opt" data-status="${esc(s)}" aria-pressed="false"><span>${esc(s)}</span><span class="n">${countStatus(s)}</span></button>`
  ).join('');
  $('#topic-chips').innerHTML = TOPICS.map(t =>
    `<button type="button" class="chip" data-topic="${esc(t)}" aria-pressed="false">${esc(t)}<span class="n">${countTopic(t)}</span></button>`
  ).join('');
  $('#sort').innerHTML = SORTS.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('');
}

function buildProgress() {
  const total = PAPERS.length;
  const seg = [['已读', 'p-read', 's-read'], ['在读', 'p-reading', 's-reading'], ['未读', 'p-unread', 's-unread']];
  $('#bar').innerHTML = seg.map(([s, pc]) =>
    `<span class="${pc}" style="width:${(countStatus(s) / total * 100).toFixed(2)}%"></span>`).join('');
  $('#legend').innerHTML = seg.map(([s, , sc]) =>
    `<li><i class="dot ${sc}"></i>${s} ${countStatus(s)}</li>`).join('') + `<li>共 ${total} 篇</li>`;
}

function renderControls() {
  document.querySelectorAll('[data-status]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.status === state.status)));
  document.querySelectorAll('[data-topic]').forEach(b =>
    b.setAttribute('aria-pressed', String(state.topics.has(b.dataset.topic))));
  const active = (state.status !== '全部' ? 1 : 0) + state.topics.size;
  $('#clear').disabled = !(active || state.query || state.sort !== 'default');
  $('#toggle').textContent = active ? `筛选（已选 ${active}）` : '筛选';
  $('#sort').value = state.sort;
}

function update() {
  const list = sorted(PAPERS.filter(matches));
  renderControls();
  $('#list').innerHTML = list.length
    ? list.map(renderCard).join('')
    : `<div class="empty">没有符合条件的论文。<br><button type="button" class="ghost" data-reset>清空筛选</button></div>`;
  $('#count').textContent = `显示 ${list.length} / ${PAPERS.length} 篇`;
}

function resetFilters() {
  state.status = '全部';
  state.topics.clear();
  state.query = '';
  state.sort = 'default';
  $('#q').value = '';
  update();
}

$('#status-opts').addEventListener('click', e => {
  const b = e.target.closest('[data-status]');
  if (!b) return;
  state.status = b.dataset.status;
  update();
});
$('#topic-chips').addEventListener('click', e => {
  const b = e.target.closest('[data-topic]');
  if (!b) return;
  const t = b.dataset.topic;
  if (state.topics.has(t)) state.topics.delete(t); else state.topics.add(t);
  update();
});
$('#q').addEventListener('input', e => {
  state.query = e.target.value.trim().toLowerCase();
  update();
});
$('#sort').addEventListener('change', e => {
  state.sort = e.target.value;
  update();
});
$('#clear').addEventListener('click', resetFilters);
$('#list').addEventListener('click', e => {
  if (e.target.closest('[data-reset]')) resetFilters();
});
$('#toggle').addEventListener('click', () => {
  const open = $('#sidebar').classList.toggle('open');
  $('#toggle').setAttribute('aria-expanded', String(open));
});

buildControls();
buildProgress();
update();
</script>
</body>
</html>
