<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>慢火咖啡 · 订单后台</title>
<style>
:root{
  --bg:#f5f3ee;
  --surface:#ffffff;
  --surface-2:#faf8f4;
  --ink:#1f1b16;
  --ink-2:#575047;
  --ink-3:#8a8277;
  --line:#e5e0d6;
  --line-2:#d6cfc2;
  --accent:#7b4419;
  --accent-ink:#ffffff;
  --accent-soft:#f4ebe1;
  --amber:#9a5b00;   --amber-bg:#fcf1dc;
  --red:#b3261e;     --red-bg:#fbe9e7;
  --blue:#24589a;    --blue-bg:#e8eff8;
  --green:#2e6a3c;   --green-bg:#e6f2e8;
  --grey:#6b645a;    --grey-bg:#eeebe5;
  --radius:10px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:20px 0 14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.02em}
.brand span{color:var(--ink-3)}
.today{color:var(--ink-2)}
.today b{color:var(--ink);font-weight:600}

/* today tasks */
.tasks{display:grid;grid-template-columns:1.25fr 1fr 1fr .8fr;gap:12px;margin-bottom:20px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,box-shadow .15s;position:relative}
button.task:hover{border-color:var(--line-2);box-shadow:0 1px 0 rgba(0,0,0,.03),0 4px 14px rgba(60,40,20,.06)}
.task .label{color:var(--ink-2);font-size:13px;display:flex;align-items:center;gap:6px}
.task .dot{width:8px;height:8px;border-radius:50%}
.task .big{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.task .big small{font-size:14px;font-weight:500;color:var(--ink-2);margin-left:3px}
.task .sub{color:var(--ink-2);font-size:13px;line-height:1.5}
.task .sub em{font-style:normal;color:var(--red);font-weight:600}
.task .go{position:absolute;right:14px;top:13px;font-size:13px;color:var(--accent)}
.task.primary{border-color:#e2cdb8;background:linear-gradient(#fffdfa,#fff)}
.task.quiet{background:transparent;border-style:dashed}
.task.quiet .big{color:var(--ink-2)}
.task.done .big{color:var(--green)}

/* workspace */
.work{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start;padding-bottom:40px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}

.toolbar{padding:12px 12px 0;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 64px 0 36px;background:var(--surface-2)}
.search input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:11px;top:11px;color:var(--ink-3)}
.search kbd{position:absolute;right:10px;top:9px;font:12px var(--mono);color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;background:#fff}
.search .clear{position:absolute;right:6px;top:6px;height:28px;padding:0 10px;border:0;background:var(--grey-bg);border-radius:6px;color:var(--ink-2);font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 10px 10px;border-bottom:2px solid transparent;color:var(--ink-2);white-space:nowrap;margin-bottom:-1px}
.tab .c{margin-left:4px;color:var(--ink-3);font-size:12px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab[aria-selected="true"] .c{color:var(--accent)}

.listhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;color:var(--ink-2);font-size:13px;flex-wrap:wrap}
.listhead .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--red-bg);border-color:#efc3bd;color:var(--red)}
.listhead select{border:1px solid var(--line-2);border-radius:6px;background:#fff;padding:2px 6px;font-size:12px;color:var(--ink-2)}

.cols,.row{display:grid;grid-template-columns:150px 112px minmax(0,1fr) 78px 72px;gap:14px;align-items:start}
.cols{padding:6px 14px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cols .r,.row .amt{text-align:right}
.rows{list-style:none;margin:0;padding:0}
.row{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 14px;border-left:3px solid transparent}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.rows li:last-child .row{border-bottom:0}
.ono{font-family:var(--mono);font-size:13px;color:var(--ink-3);letter-spacing:.01em}
.ono b{color:var(--ink);font-weight:600}
.when{font-size:12px;color:var(--ink-3);margin-top:1px}
.when.late{color:var(--red);font-weight:600}
.who{line-height:1.45}
.who small{display:block;color:var(--ink-3);font-size:12px}
.items{min-width:0}
.items .names{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.iq{display:inline-block;font-size:12px;line-height:17px;padding:0 5px;margin-left:4px;border-radius:4px;background:var(--grey-bg);color:var(--ink);font-weight:600;vertical-align:1px}
.c-id{display:flex;flex-direction:column;min-width:0}
.items .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.flag{font-size:12px;line-height:1.5;padding:0 6px;border-radius:4px;white-space:nowrap}
.flag.check{background:var(--red-bg);color:var(--red)}
.flag.pack{background:var(--amber-bg);color:var(--amber)}
.amt{font-weight:600}
.amt small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.status{display:inline-block;font-size:12px;line-height:20px;padding:0 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.s-待发货{background:var(--amber-bg);color:var(--amber)}
.s-退款中{background:var(--red-bg);color:var(--red)}
.s-已发货{background:var(--blue-bg);color:var(--blue)}
.s-已完成{background:var(--green-bg);color:var(--green)}
.s-待付款{background:var(--grey-bg);color:var(--grey)}
.s-已退款{background:var(--grey-bg);color:var(--grey)}
mark{background:#ffe7a8;color:inherit;border-radius:2px;padding:0 1px}
.empty{padding:40px 16px;text-align:center;color:var(--ink-3)}
.empty button{margin-top:10px}

/* detail */
.detail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.d-head .ono{font-size:16px}
.d-head .when{font-size:13px}
.iconbtn{border:0;background:none;width:32px;height:32px;border-radius:6px;color:var(--ink-3);display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--grey-bg);color:var(--ink)}
.d-sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.d-sec:last-child{border-bottom:0}
.d-sec h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.kv{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.alert{border-radius:8px;padding:9px 12px;margin:0 0 8px;line-height:1.5}
.alert:last-child{margin-bottom:0}
.alert b{display:block;font-weight:600}
.alert span{color:var(--ink-2);font-size:13px}
.alert.check{background:var(--red-bg)}
.alert.check b{color:var(--red)}
.alert.pack{background:var(--amber-bg)}
.alert.pack b{color:var(--amber)}
.alert.info{background:var(--grey-bg)}
.lines{width:100%;border-collapse:collapse}
.lines td{padding:5px 0;vertical-align:top}
.lines td.q{width:44px;text-align:right;color:var(--ink-2);white-space:nowrap}
.lines td.p{width:70px;text-align:right;white-space:nowrap}
.lines .qbig{font-weight:700;color:var(--ink)}
.lines tfoot td{color:var(--ink-2);padding-top:4px}
.lines tfoot tr:first-child td{border-top:1px solid var(--line);padding-top:8px}
.lines tfoot .total td{color:var(--ink);font-weight:700;font-size:15px}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.field textarea{resize:vertical;min-height:64px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .hint{font-size:12px;color:var(--ink-3)}
.field .err{font-size:12px;color:var(--red)}
.field.bad input{border-color:var(--red)}
.inline{display:grid;grid-template-columns:118px 1fr;gap:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--line-2);background:#fff;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#673813}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{background:#97201a}
.btn.wide{flex:1}
.link{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.link:hover{color:var(--ink)}
.confirm{border:1px solid #efc3bd;background:#fff8f7;border-radius:8px;padding:12px}
.confirm p{margin:0 0 10px}
.log{list-style:none;margin:0;padding:0;font-size:13px;color:var(--ink-2)}
.log li{display:flex;gap:10px;padding:2px 0}
.log time{color:var(--ink-3);font-family:var(--mono);font-size:12px;flex:none;padding-top:1px}

/* pick list (detail empty state) */
.pick-head{padding:16px 16px 4px}
.pick-head h2{margin:0;font-size:15px}
.pick-head p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.pick{list-style:none;margin:0;padding:6px 16px 4px}
.pick li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.pick li:last-child{border-bottom:0}
.pick li b{font-size:15px}
.pick-foot{padding:10px 16px 16px;color:var(--ink-3);font-size:12px}

.foot{color:var(--ink-3);font-size:12px;padding:0 0 32px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2a241d;color:#fff;border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.2);z-index:50;max-width:calc(100vw - 32px)}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:6px;padding:4px 10px}

.mback{display:none}

@media (max-width:1080px){
  .tasks{grid-template-columns:1fr 1fr}
  .work{grid-template-columns:minmax(0,1fr) 360px}
  .cols,.row{grid-template-columns:136px minmax(0,1fr) 74px 68px}
  .cols .c-who,.row .who{display:none}
}
@media (max-width:820px){
  .wrap{padding:0 16px}
  .top{padding:14px 0 10px}
  .tasks{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .task{padding:11px 12px}
  .task .big{font-size:22px}
  .task .go{display:none}
  .task .sub{font-size:12px}
  .work{grid-template-columns:minmax(0,1fr)}
  .cols{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px}
  .row .c-id{grid-column:1;grid-row:1;flex-direction:row;gap:8px;align-items:baseline;flex-wrap:wrap}
  .row .c-st{grid-column:2;grid-row:1;text-align:right}
  .row .items{grid-column:1 / -1;grid-row:2}
  .row .who{display:block;grid-column:1;grid-row:3;color:var(--ink-2)}
  .row .who small{display:inline;margin-left:6px}
  .row .amt{grid-column:2;grid-row:3}
  .row .amt small{display:none}
  .detail{position:fixed;inset:0;max-height:none;border-radius:0;border:0;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
  .detail.idle{display:none}
  .mback{display:inline-flex}
  .search kbd{display:none}
  .search input{padding-right:56px}
  .tab{padding:8px 7px 10px}
  .tab .c{margin-left:2px}
  .dclose{display:none}
  body.sheet-open{overflow:hidden}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>慢火咖啡</h1><span>订单后台</span></div>
    <div class="today" id="today"></div>
  </header>

  <section class="tasks" id="tasks" aria-label="今天要处理"></section>

  <div class="work">
    <section class="panel" aria-label="订单列表">
      <div class="toolbar">
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" autocomplete="off" placeholder="订单号后 4 位、买家、城市、商品或运单号" aria-label="搜索订单">
          <kbd id="kbd">/</kbd>
          <button class="clear" id="clearQ" hidden>清除</button>
        </div>
        <div class="tabs" role="tablist" id="tabs"></div>
      </div>
      <div class="listhead">
        <span id="summary"></span>
        <span class="filters">
          <button class="chip" id="onlyCheck" aria-pressed="false">只看需核实</button>
          <select id="sort" aria-label="排序">
            <option value="old">最早下单在前</option>
            <option value="new">最新下单在前</option>
          </select>
        </span>
      </div>
      <div class="cols" aria-hidden="true">
        <span>订单号 · 下单</span><span class="c-who">买家</span><span>商品</span><span class="r">实付</span><span>状态</span>
      </div>
      <ul class="rows" id="rows"></ul>
    </section>

    <aside class="panel detail idle" id="detail" aria-live="polite"></aside>
  </div>

  <footer class="foot">
    <span>数据：最近 4 天共 <span id="totalCount"></span> 单。发货、退款等操作只保存在这台电脑的浏览器里，尚未连接店铺平台。</span>
    <button class="link" id="reset">恢复原始数据</button>
  </footer>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastUndo">撤销</button></div>

g_no":"SF583345511130","note":null},{"order_no":"KF2610121629","created_at":"2026-10-12 08:26","customer":"王*","city":"广州 天河区","items":[{"item":"手冲咖啡豆 · 云南保山小粒 500g","price":96,"qty":1},{"item":"手冲咖啡豆 · 埃塞俄比亚耶加雪菲 250g","price":88,"qty":2},{"item":"手冲壶 细口 600ml","price":199,"qty":1}],"subtotal":471,"shipping_fee":0,"paid":0,"status":"待付款","tracking_no":null,"note":null}]};
const TODAY = "2026-10-15";
const STORE_KEY = "slowfire-orders-v1";
const CARRIERS = ["顺丰速运","中通快递","圆通速递","韵达快递","京东物流","EMS"];
const STATUSES = ["待发货","退款中","已发货","已完成","待付款","已退款"];

/* ---------- state ---------- */
const base = DATA.orders.map(o => ({...o, items:o.items.map(i=>({...i}))}));
let orders, log;
function loadState(){
  orders = base.map(o => ({...o, carrier: o.tracking_no ? "顺丰速运" : null, refund:null}));
  log = [];
  try{
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if(saved && saved.patch){
      for(const o of orders){ if(saved.patch[o.order_no]) Object.assign(o, saved.patch[o.order_no]); }
      log = saved.log || [];
    }
  }catch(e){}
}
function saveState(){
  const patch = {};
  for(const o of orders){
    const b = base.find(x=>x.order_no===o.order_no);
    if(o.status!==b.status || o.tracking_no!==b.tracking_no || o.refund){
      patch[o.order_no] = {status:o.status, tracking_no:o.tracking_no, carrier:o.carrier, refund:o.refund};
    }
  }
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({patch, log})); }catch(e){}
}
loadState();

const ui = { tab:"待发货", q:"", onlyCheck:false, sort:"old", selected:null, mode:null };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yuan = n => "¥" + Number(n).toLocaleString("zh-CN", {minimumFractionDigits: Number.isInteger(n)?0:2, maximumFractionDigits:2});
const dayIndex = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)) / 864e5;
const ageDays = o => dayIndex(TODAY) - dayIndex(o.created_at.slice(0,10));
function whenLabel(o){
  const d = ageDays(o), t = o.created_at.slice(11);
  if(d===0) return "今天 " + t;
  if(d===1) return "昨天 " + t;
  return o.created_at.slice(5,10) + " " + t;
}
const noteText = o => o.note ? o.note.replace(/^(买家留言|买家申请退款)[:：]\s*/, "") : "";
const hasItem = (o, word) => o.items.some(i => i.item.includes(word));
const qtyOf = o => o.items.reduce((s,i)=>s+i.qty,0);

/* Things the shop owner should notice on an order. level: check = verify before acting, pack = packing instruction */
function alertsOf(o){
  const a = [];
  const n = noteText(o);
  if(o.note && o.note.startsWith("买家留言")){
    if(n.includes("研磨") && !hasItem(o,"咖啡豆")){
      a.push({level:"check", short:"留言与商品不符", title:"留言要研磨豆子，但订单里没有咖啡豆", body:"买家留言「"+n+"」。可能拍错了商品或留错了订单，发货前先联系买家确认。"});
    }else if(n.includes("研磨")){
      a.push({level:"pack", short:"豆子需研磨", title:"咖啡豆研磨成手冲粗细", body:"买家留言「"+n+"」。"});
    }else if(n.includes("发票")){
      a.push({level:"pack", short:"不放发票", title:"不要放发票", body:"买家留言「"+n+"」。"});
    }else{
      a.push({level:"pack", short:"有留言", title:"买家留言", body:n});
    }
  }
  if(o.status==="退款中" || (o.refund && o.refund.requested)){
    const reason = o.refund && o.refund.reason ? o.refund.reason : n;
    if(reason.includes("滤杯") && !hasItem(o,"滤杯")){
      a.push({level:"check", short:"退款理由与商品不符", title:"退款理由提到滤杯，但订单里没有滤杯", body:"买家理由「"+reason+"」。核对是否申请错了订单，必要时请买家补拍照片。"});
    }
    if(reason.includes("收到") && !o.tracking_no && o.status==="退款中"){
      a.push({level:"check", short:"无发货记录", title:"买家说已收到，但订单没有运单号", body:"这单在系统里没有发货记录，先确认是否线下发出或漏录单号。"});
    }
  }
  if(o.status==="待发货" && ageDays(o)>=2){
    a.unshift({level:"check", short:"已等 "+ageDays(o)+" 天", title:"已付款 "+ageDays(o)+" 天未发货", body:"建议优先发出，避免买家催单或平台判定延迟发货。"});
  }
  return a;
}
const needsCheck = o => alertsOf(o).some(a => a.level==="check");

/* ---------- search ---------- */
function matches(o, q){
  if(!q) return true;
  const hay = [o.order_no, o.customer, o.city, o.tracking_no||"", o.note||"", o.status, ...o.items.map(i=>i.item)].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));
}
function hl(text, q){
  const s = esc(text);
  if(!q) return s;
  const terms = q.split(/\s+/).filter(Boolean).map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(!terms.length) return s;
  return s.replace(new RegExp("(" + terms.join("|") + ")", "gi"), "<mark>$1</mark>");
}
function onoHTML(no, q){
  if(q && no.toLowerCase().includes(q.trim().toLowerCase()) && q.trim()) return hl(no, q.trim());
  return esc(no.slice(0,-4)) + "<b>" + esc(no.slice(-4)) + "</b>";
}

/* ---------- render: today ---------- */
function renderToday(){
  const wd = "日一二三四五六"[new Date(TODAY+"T00:00:00").getDay()];
  $("#today").innerHTML = "<b>10 月 15 日</b> 周" + wd + " · 今日新订单 " + orders.filter(o=>ageDays(o)===0).length + " 单";

  const ship = orders.filter(o=>o.status==="待发货");
  const late = ship.filter(o=>ageDays(o)>=2);
  const oldest = ship.reduce((m,o)=>!m||o.created_at<m.created_at?o:m, null);
  const refunds = orders.filter(o=>o.status==="退款中");
  const refundSum = refunds.reduce((s,o)=>s+o.paid,0);
  const refundOdd = refunds.filter(needsCheck).length;
  const contact = ship.filter(o=>alertsOf(o).some(a=>a.level==="check" && a.short==="留言与商品不符"));
  const unpaid = orders.filter(o=>o.status==="待付款");
  const unpaidSum = unpaid.reduce((s,o)=>s+o.subtotal+o.shipping_fee,0);

  let h = "";
  h += `<button class="task primary${ship.length?"":" done"}" data-go="ship">
    <span class="label"><i class="dot" style="background:var(--amber)"></i>待发货</span>
    <span class="big num">${ship.length}<small>单</small></span>
    <span class="sub">${ship.length ? (late.length ? `<em>${late.length} 单已等 2 天以上</em>，最早一单 ${oldest.created_at.slice(5,10)} 下单` : "都是近两天的订单") : "全部发完了"}</span>
    ${ship.length?'<span class="go">去发货 →</span>':""}
  </button>`;
  h += `<button class="task${refunds.length?"":" done"}" data-go="refund">
    <span class="label"><i class="dot" style="background:var(--red)"></i>退款申请</span>
    <span class="big num">${refunds.length}<small>单${refunds.length?" · "+yuan(refundSum):""}</small></span>
    <span class="sub">${refunds.length ? (refundOdd ? `<em>${refundOdd} 单理由与订单记录对不上</em>，先核实再退` : "等你同意或拒绝") : "没有待处理的申请"}</span>
    ${refunds.length?'<span class="go">去处理 →</span>':""}
  </button>`;
  h += `<button class="task${contact.length?"":" done"}" data-go="contact">
    <span class="label"><i class="dot" style="background:var(--red)"></i>发货前先联系买家</span>
    <span class="big num">${contact.length}<small>单</small></span>
    <span class="sub">${contact.length ? "留言要磨豆子，订单里却没有咖啡豆" : "没有需要确认的留言"}</span>
    ${contact.length?'<span class="go">查看 →</span>':""}
  </button>`;
  h += `<button class="task quiet" data-go="unpaid">
    <span class="label"><i class="dot" style="background:var(--grey)"></i>待买家付款</span>
    <span class="big num">${unpaid.length}<small>单 · ${yuan(unpaidSum)}</small></span>
    <span class="sub">不用处理，付款后会进入待发货</span>
  </button>`;
  $("#tasks").innerHTML = h;
}

/* ---------- render: list ---------- */
function visible(){
  const q = ui.q.trim();
  let list = orders.filter(o => matches(o,q));
  if(!q && ui.tab!=="全部") list = list.filter(o => o.status===ui.tab);
  if(ui.onlyCheck) list = list.filter(needsCheck);
  list.sort((a,b)=> ui.sort==="old" ? a.created_at.localeCompare(b.created_at) : b.created_at.localeCompare(a.created_at));
  return list;
}
function renderTabs(){
  const tabs = ["全部", ...STATUSES.filter(s => s!=="已退款" || orders.some(o=>o.status==="已退款"))];
  $("#tabs").innerHTML = tabs.map(t => {
    const c = t==="全部" ? orders.length : orders.filter(o=>o.status===t).length;
    const sel = !ui.q.trim() && ui.tab===t;
    return `<button class="tab" role="tab" aria-selected="${sel}" data-tab="${t}">${t}<span class="c num">${c}</span></button>`;
  }).join("");
}
function renderList(){
  const q = ui.q.trim();
  const list = visible();
  let s;
  if(q) s = `搜索「${esc(q)}」：在全部订单中找到 ${list.length} 单` + (list.length===1?"，按回车打开":"");
  else s = `${ui.tab} · ${list.length} 单`;
  if(ui.onlyCheck) s += "（只看需核实）";
  $("#summary").innerHTML = s;
  $("#onlyCheck").setAttribute("aria-pressed", ui.onlyCheck);
  $("#sort").value = ui.sort;

  if(!list.length){
    $("#rows").innerHTML = `<li class="empty">${q ? "没有匹配的订单。可以试试订单号后 4 位、买家姓氏或运单号。" : (ui.onlyCheck ? "这一栏没有需要核实的订单。" : "这一栏暂时没有订单。")}
      ${(q||ui.onlyCheck)?'<br><button class="btn" id="emptyReset">清除搜索和筛选</button>':""}</li>`;
    return;
  }
  $("#rows").innerHTML = list.map(o => {
    const al = alertsOf(o);
    const late = o.status==="待发货" && ageDays(o)>=2;
    const names = o.items.map(i => hl(i.item, q) + (i.qty>1?`<span class="iq">${i.qty} 件</span>`:"")).join("、");
    const flags = al.filter(a=>!(late && a.short.startsWith("已等"))).map(a=>`<span class="flag ${a.level}">${esc(a.short)}</span>`).join("");
    const trk = (o.tracking_no && q && o.tracking_no.toLowerCase().includes(q.toLowerCase())) ? `<span class="flag" style="background:var(--blue-bg);color:var(--blue)">运单 ${hl(o.tracking_no,q)}</span>` : "";
    return `<li><button class="row" data-no="${o.order_no}" aria-current="${ui.selected===o.order_no}">
      <span class="c-id"><span class="ono">${onoHTML(o.order_no,q)}</span><span class="when${late?" late":""}">${whenLabel(o)}${late?` · 已等 ${ageDays(o)} 天`:""}</span></span>
      <span class="who">${hl(o.customer,q)}<small>${hl(o.city,q)}</small></span>
      <span class="items"><span class="names">${names}</span>${(flags||trk)?`<span class="meta">${flags}${trk}</span>`:""}</span>
      <span class="amt num">${o.paid?yuan(o.paid):`<span style="color:var(--ink-3)">${yuan(o.subtotal+o.shipping_fee)}</span>`}<small>${qtyOf(o)} 件</small></span>
      <span class="c-st"><span class="status s-${o.status}">${o.status}</span></span>
    </button></li>`;
  }).join("");
}

/* ---------- render: detail ---------- */
function pickListHTML(){
  const ship = orders.filter(o=>o.status==="待发货");
  const hold = ship.filter(o=>alertsOf(o).some(a=>a.short==="留言与商品不符"));
  const tally = {};
  for(const o of ship) for(const i of o.items) tally[i.item] = (tally[i.item]||0) + i.qty;
  const rows = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  if(!ship.length) return `<div class="pick-head"><h2>待发货已清空</h2><p>点左侧任意订单查看详情。</p></div>`;
  return `<div class="pick-head"><h2>拣货汇总</h2><p>${ship.length} 单待发货共需备齐以下商品。点左侧订单可发货或退款。</p></div>
    <ul class="pick">${rows.map(([k,v])=>`<li><span>${esc(k)}</span><b class="num">× ${v}</b></li>`).join("")}</ul>
    <div class="pick-foot">${hold.length?`其中 ${hold.length} 单要先联系买家确认，可以晚点再备。`:""}</div>`;
}
function renderDetail(){
  const box = $("#detail");
  const o = orders.find(x=>x.order_no===ui.selected);
  box.classList.toggle("idle", !o);
  document.body.classList.toggle("sheet-open", !!o && matchMedia("(max-width:820px)").matches);
  if(!o){ box.innerHTML = pickListHTML(); return; }

  const al = alertsOf(o);
  const myLog = log.filter(l=>l.no===o.order_no);
  let h = `<div class="d-head">
    <button class="iconbtn mback" id="dBack" aria-label="返回列表"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
    <div style="flex:1;min-width:0">
      <div class="ono">${esc(o.order_no.slice(0,-4))}<b>${esc(o.order_no.slice(-4))}</b></div>
      <div class="when">${o.created_at} 下单 · <span class="status s-${o.status}">${o.status}</span></div>
    </div>
    <button class="iconbtn dclose" id="dClose" aria-label="关闭详情（Esc）"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>`;

  if(al.length) h += `<div class="d-sec">${al.map(a=>`<div class="alert ${a.level}"><b>${esc(a.title)}</b><span>${esc(a.body)}</span></div>`).join("")}</div>`;

  h += `<div class="d-sec"><h3>操作</h3>${actionHTML(o)}</div>`;

  h += `<div class="d-sec"><h3>商品</h3><table class="lines num"><tbody>
    ${o.items.map(i=>`<tr><td>${esc(i.item)}</td><td class="q">${i.qty>1?`<span class="qbig">× ${i.qty}</span>`:"× 1"}</td><td class="p">${yuan(i.price*i.qty)}</td></tr>`).join("")}
    </tbody><tfoot>
      <tr><td colspan="2">商品合计</td><td class="p">${yuan(o.subtotal)}</td></tr>
      <tr><td colspan="2">运费</td><td class="p">${o.shipping_fee?yuan(o.shipping_fee):"包邮"}</td></tr>
      <tr class="total"><td colspan="2">${o.paid?"实付":"应付（未付款）"}</td><td class="p">${yuan(o.paid||o.subtotal+o.shipping_fee)}</td></tr>
      ${o.refund && o.refund.amount?`<tr><td colspan="2" style="color:var(--red)">已退款</td><td class="p" style="color:var(--red)">−${yuan(o.refund.amount)}</td></tr>`:""}
    </tfoot></table></div>`;

  h += `<div class="d-sec"><h3>收货</h3><dl class="kv">
    <dt>买家</dt><dd>${esc(o.customer)}</dd>
    <dt>城市</dt><dd>${esc(o.city)}</dd>
    <dt>物流</dt><dd>${o.tracking_no?`${esc(o.carrier||"")} <span class="mono">${esc(o.tracking_no)}</span>`:'<span style="color:var(--ink-3)">未发货</span>'}</dd>
    ${o.note?`<dt>备注</dt><dd>${esc(o.note)}</dd>`:""}
  </dl></div>`;

  if(myLog.length) h += `<div class="d-sec"><h3>本机操作记录</h3><ul class="log">${myLog.map(l=>`<li><time>${l.t}</time><span>${esc(l.text)}</span></li>`).join("")}</ul></div>`;
  box.innerHTML = h;
}

function actionHTML(o){
  const m = ui.mode;
  if(o.status==="待发货"){
    if(m==="refund"||m==="refund-confirm") return refundForm(o, "取消订单并退款", "缺货、买家要求取消等情况使用。");
    const hold = alertsOf(o).some(a=>a.short==="留言与商品不符");
    return `<form id="shipForm" novalidate>
      ${hold?`<p class="alert check" style="margin-bottom:10px"><span>建议先联系买家确认留言，再填写运单号。</span></p>`:""}
      <div class="inline">
        <div class="field"><label for="carrier">快递</label><select id="carrier">${CARRIERS.map(c=>`<option>${c}</option>`).join("")}</select></div>
        <div class="field" id="trkField"><label for="trk">运单号</label><input id="trk" class="mono" inputmode="text" autocomplete="off" placeholder="如 SF123456789012"><span class="err" id="trkErr" hidden></span></div>
      </div>
      <div class="btns"><button class="btn primary wide" type="submit">确认发货</button></div>
      <p style="margin:10px 0 0"><button type="button" class="link" data-mode="refund">取消订单并退款…</button></p>
    </form>`;
  }
  if(o.status==="退款中"){
    if(m==="reject") return `<form id="rejectForm" novalidate>
      <div class="field" id="rjField"><label for="rj">拒绝理由（买家会看到）</label><textarea id="rj" placeholder="例如：订单中没有滤杯，请确认是否申请错了订单；如商品有问题请补充照片。"></textarea><span class="err" id="rjErr" hidden></span></div>
      <div class="btns"><button class="btn primary" type="submit">提交拒绝</button><button type="button" class="btn" data-mode="">返回</button></div>
    </form>`;
    const reason = noteText(o);
    return `<p style="margin:0 0 10px">买家申请退款：<b>${esc(reason)}</b></p>` +
      (m==="refund-confirm" ? refundForm(o) : `<div class="btns">
        <button class="btn danger wide" data-mode="refund-confirm">同意退款 ${yuan(o.paid)}</button>
        <button class="btn" data-mode="reject">拒绝</button></div>`);
  }
  if(o.status==="已发货"||o.status==="已完成"){
    if(m==="refund"||m==="refund-confirm") return refundForm(o, "售后退款", "退货退款或仅退款都在这里处理。");
    return `<p style="margin:0 0 10px;color:var(--ink-2)">${o.status==="已发货"?"已交给快递，等买家确认收货。":"买家已确认收货，订单完成。"}</p>
      <div class="btns">${o.status==="已发货"?`<button class="btn" data-act="complete">标记为已完成</button>`:""}<button class="btn" data-mode="refund">售后退款…</button></div>`;
  }
  if(o.status==="待付款") return `<p style="margin:0;color:var(--ink-2)">买家还没付款，不需要操作。付款后会自动出现在「待发货」。</p>`;
  if(o.status==="已退款") return `<p style="margin:0;color:var(--ink-2)">已退款 ${yuan(o.refund?o.refund.amount:o.paid)}，订单关闭。</p>`;
  return "";
}
function refundForm(o, title, hint){
  const confirming = ui.mode==="refund-confirm";
  return `<form id="refundForm" novalidate>
    ${title?`<p style="margin:0 0 8px"><b>${title}</b>${hint?`<br><span style="color:var(--ink-2);font-size:13px">${hint}</span>`:""}</p>`:""}
    <div class="field" id="amtField"><label for="amt">退款金额（最多 ${yuan(o.paid)}）</label><input id="amt" class="num" inputmode="decimal" value="${o.paid}"><span class="err" id="amtErr" hidden></span></div>
    ${confirming?`<div class="confirm"><p>退款会原路退回给 <b>${esc(o.customer)}</b>，提交后不能撤回。</p>
      <div class="btns"><button class="btn danger" type="submit">确认退款</button><button type="button" class="btn" data-mode="">取消</button></div></div>`
    :`<div class="btns"><button type="button" class="btn danger" data-mode="refund-confirm">下一步：确认退款</button><button type="button" class="btn" data-mode="">取消</button></div>`}
  </form>`;
}

/* ---------- actions ---------- */
let undoFn = null, toastTimer = null;
function toast(msg, undo){
  $("#toastMsg").textContent = msg;
  undoFn = undo || null;
  $("#toastUndo").hidden = !undo;
  $("#toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ $("#toast").hidden = true; undoFn = null; }, 6000);
}
function now(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function addLog(no, text){ const e={no,t:now(),text}; log.push(e); return e; }
function commit(){ saveState(); renderAll(); }

function doShip(o){
  const trkEl = $("#trk"), carrier = $("#carrier").value;
  const v = trkEl.value.replace(/\s+/g,"").toUpperCase();
  let err = "";
  if(!v) err = "请填写运单号";
  else if(!/^[A-Z0-9]{8,20}$/.test(v)) err = "运单号一般是 8–20 位字母或数字";
  else if(carrier==="顺丰速运" && !/^SF\d{12}$/.test(v)) err = "顺丰单号格式是 SF + 12 位数字";
  else { const dup = orders.find(x=>x.tracking_no===v && x.order_no!==o.order_no); if(dup) err = "这个运单号已经用在订单 " + dup.order_no; }
  if(err){ $("#trkErr").textContent = err; $("#trkErr").hidden = false; $("#trkField").classList.add("bad"); trkEl.focus(); return; }
  const prev = {status:o.status, tracking_no:o.tracking_no, carrier:o.carrier};
  Object.assign(o, {status:"已发货", tracking_no:v, carrier});
  const entry = addLog(o.order_no, `发货：${carrier} ${v}`);
  ui.mode = null;
  const next = nextInQueue(o);
  commit();
  toast(`${o.order_no.slice(-4)} 已发货`, () => { Object.assign(o, prev); log.splice(log.indexOf(entry),1); ui.selected = o.order_no; commit(); });
  if(next){ ui.selected = next; renderAll(); }
}
function nextInQueue(o){
  // after shipping, move on to the next order still waiting in the current view
  const list = visible().filter(x => x.order_no!==o.order_no && x.status==="待发货");
  return list.length ? list[0].order_no : null;
}
function doRefund(o){
  const a = parseFloat($("#amt").value);
  let err = "";
  if(!(a>0)) err = "请输入退款金额";
  else if(a > o.paid) err = "不能超过实付 " + yuan(o.paid);
  else if(Math.round(a*100)!==a*100) err = "最多两位小数";
  if(err){ $("#amtErr").textContent = err; $("#amtErr").hidden = false; $("#amtField").classList.add("bad"); return; }
  const reason = noteText(o);
  o.refund = {amount:a, reason: o.status==="退款中" ? reason : "商家操作"};
  o.status = "已退款";
  addLog(o.order_no, `退款 ${yuan(a)}` + (a<o.paid?`（部分退款，实付 ${yuan(o.paid)}）`:""));
  ui.mode = null;
  commit();
  toast(`${o.order_no.slice(-4)} 已退款 ${yuan(a)}`);
}
function doReject(o){
  const r = $("#rj").value.trim();
  if(!r){ $("#rjErr").textContent = "请写明拒绝理由"; $("#rjErr").hidden = false; $("#rjField").classList.add("bad"); $("#rj").focus(); return; }
  const prev = {status:o.status};
  o.status = o.tracking_no ? "已发货" : "待发货";
  const entry = addLog(o.order_no, `拒绝退款：${r}，订单回到「${o.status}」`);
  ui.mode = null;
  commit();
  toast(`已拒绝退款，订单回到${o.status}`, () => { Object.assign(o, prev); log.splice(log.indexOf(entry),1); commit(); });
}

/* ---------- render all & events ---------- */
function renderAll(){ renderToday(); renderTabs(); renderList(); renderDetail(); }

function select(no){
  ui.selected = no; ui.mode = null; renderList(); renderDetail();
  const d = $("#detail"); d.scrollTop = 0;
  if(no && matchMedia("(max-width:820px)").matches) setTimeout(()=>{ const b=$("#dBack"); b&&b.focus(); },0);
}

$("#tasks").addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if(!b) return;
  const go = b.dataset.go;
  ui.q = ""; $("#q").value = ""; ui.onlyCheck = false;
  if(go==="ship"){ ui.tab="待发货"; ui.sort="old"; }
  if(go==="refund"){ ui.tab="退款中"; ui.sort="old"; }
  if(go==="contact"){ ui.tab="待发货"; ui.onlyCheck=true; ui.sort="old"; }
  if(go==="unpaid"){ ui.tab="待付款"; ui.sort="new"; }
  syncSearchUI(); renderTabs(); renderList();
  const first = visible()[0];
  if(go!=="unpaid" && first) select(first.order_no);
  if(!matchMedia("(max-width:820px)").matches) $("#q").scrollIntoView({block:"nearest"});
  else document.querySelector(".tabs").scrollIntoView({behavior:"smooth", block:"start"});
});
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if(!b) return;
  ui.tab = b.dataset.tab; ui.q = ""; $("#q").value = "";
  ui.sort = (ui.tab==="待发货"||ui.tab==="退款中") ? "old" : "new";
  syncSearchUI(); renderTabs(); renderList();
});
$("#rows").addEventListener("click", e => {
  if(e.target.id==="emptyReset"){ ui.q=""; $("#q").value=""; ui.onlyCheck=false; syncSearchUI(); renderTabs(); renderList(); return; }
  const r = e.target.closest(".row"); if(r) select(r.dataset.no);
});
$("#onlyCheck").addEventListener("click", () => { ui.onlyCheck = !ui.onlyCheck; renderList(); });
$("#sort").addEventListener("change", e => { ui.sort = e.target.value; renderList(); });

function syncSearchUI(){ const has = !!$("#q").value; $("#clearQ").hidden = !has; $("#kbd").hidden = has; }
$("#q").addEventListener("input", e => { ui.q = e.target.value; syncSearchUI(); renderTabs(); renderList(); });
$("#q").addEventListener("keydown", e => {
  if(e.key==="Enter"){ const l = visible(); if(l.length) select(l[0].order_no); }
  if(e.key==="Escape"){ e.target.value=""; ui.q=""; syncSearchUI(); renderTabs(); renderList(); }
});
$("#clearQ").addEventListener("click", () => { $("#q").value=""; ui.q=""; syncSearchUI(); renderTabs(); renderList(); $("#q").focus(); });

$("#detail").addEventListener("click", e => {
  if(e.target.closest("#dClose") || e.target.closest("#dBack")){ select(null); return; }
  const mb = e.target.closest("[data-mode]");
  if(mb){
    e.preventDefault();
    // keep any amount the user typed when moving to the confirm step
    const amt = $("#amt") ? $("#amt").value : null;
    ui.mode = mb.dataset.mode || null; renderDetail();
    if(amt!==null && $("#amt")) $("#amt").value = amt;
    const f = $("#detail").querySelector("#trk,#rj,#amt,.confirm .btn"); if(f && ui.mode) f.focus();
    return;
  }
  const ab = e.target.closest("[data-act]");
  if(ab && ab.dataset.act==="complete"){
    const o = orders.find(x=>x.order_no===ui.selected);
    o.status = "已完成"; const entry = addLog(o.order_no, "标记为已完成"); commit();
    toast(`${o.order_no.slice(-4)} 已完成`, () => { o.status="已发货"; log.splice(log.indexOf(entry),1); commit(); });
  }
});
$("#detail").addEventListener("submit", e => {
  e.preventDefault();
  const o = orders.find(x=>x.order_no===ui.selected); if(!o) return;
  if(e.target.id==="shipForm") doShip(o);
  if(e.target.id==="refundForm"){
    if(ui.mode!=="refund-confirm"){ ui.mode="refund-confirm"; const v=$("#amt").value; renderDetail(); $("#amt").value=v; return; }
    doRefund(o);
  }
  if(e.target.id==="rejectForm") doReject(o);
});
$("#detail").addEventListener("input", e => {
  const f = e.target.closest(".field"); if(f && f.classList.contains("bad")){ f.classList.remove("bad"); const er=f.querySelector(".err"); if(er) er.hidden=true; }
});

$("#toastUndo").addEventListener("click", () => { if(undoFn){ undoFn(); undoFn=null; } $("#toast").hidden = true; toast("已撤销"); $("#toastUndo").hidden = true; });

$("#reset").addEventListener("click", e => {
  const b = e.target;
  if(b.dataset.armed){ try{ localStorage.removeItem(STORE_KEY); }catch(_){} loadState(); ui.selected=null; ui.mode=null; renderAll(); b.textContent="恢复原始数据"; delete b.dataset.armed; toast("已恢复为原始订单数据"); return; }
  b.dataset.armed = "1"; b.textContent = "再点一次确认：清除本机的所有操作";
  setTimeout(()=>{ if(b.dataset.armed){ delete b.dataset.armed; b.textContent="恢复原始数据"; } }, 4000);
});

document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key==="/" && !typing){ e.preventDefault(); $("#q").focus(); $("#q").select(); }
  if(e.key==="Escape" && !typing && ui.selected){ select(null); }
});

$("#totalCount").textContent = orders.length;
renderAll();
</script>
</body>
</html>
