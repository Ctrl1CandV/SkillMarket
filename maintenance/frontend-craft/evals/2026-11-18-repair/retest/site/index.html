<!--
学生公寓报修处理台；从 queue / settings / dashboard 起步样例的结构决定改写。
1. 列表是单人值班分派队列，不是展示型后台：不设侧栏和指标横幅；详情是对象工作台；新建是电话录入表单；统计是主管自助分析看板。
2. 列表和详情的颜色只给时间压力（紧急、逾期），其余状态和操作保持中性色；统计用同一强调色表示报修数量。
3. 因为有7种状态但值班任务分为派单、跟进、回访，所以列表用任务标签并保留精确状态筛选。
   因为房间号是学生来电时的定位信息，所以楼栋房间突出、工单号次要；描述保留真实长度。
   因为5位师傅有工种限制，所以右栏显示负荷，详情仅提供匹配师傅，空调只派韩师傅。
   因为紧急单30分钟内派出，所以按紧急待派、超时、普通待派、维修跟进、待确认排序，时间原因直接出现在行内。
   因为照片只有数量没有文件，所以详情只说明学生自述数量，不生成虚构缩略图。
   因为主管需要独立比较，所以统计提供14天每日量、楼栋/类别分布、修好耗时分布和明确定义的积压，不写结论。
-->
