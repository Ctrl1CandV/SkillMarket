<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#185b4b">
  <title>录集 · 导入作业</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./" aria-label="录集，导入作业首页"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>录集<span class="brand-en">IMPORT DESK</span></span></a>
    <div class="header-route">工作空间 <span>/</span> <strong>导入作业</strong></div>
    <div class="demo-tag"><span></span>本地演示</div>
  </header>
  <main>
    <section class="page-heading">
      <div><div class="eyebrow">团队数据工作台</div><h1>导入作业</h1><p>查看队列，核对问题，继续处理。</p></div>
      <div class="heading-aside"><span class="snapshot">初始快照 · 2026.10.26 09:35</span><button class="button quiet" id="reset-button">↺ <span>恢复演示队列</span></button></div>
    </section>
    <section class="queue-panel" aria-label="导入作业队列">
      <div id="status-tabs" class="status-tabs" aria-label="按作业状态筛选"></div>
      <div class="filters">
        <label class="search-field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索编号、作业或源文件" aria-label="搜索编号、作业名称或源文件名" autocomplete="off"></label>
        <label class="select-field"><span>负责人</span><select id="owner-filter" aria-label="按负责人筛选"></select></label>
        <label class="select-field sort-field"><span>排序</span><select id="sort" aria-label="排序方式"><option value="submitted_at-desc">提交时间 · 最新</option><option value="submitted_at-asc">提交时间 · 最早</option><option value="priority-asc">优先级 · 高到低</option><option value="priority-desc">优先级 · 低到高</option><option value="records_total-desc">记录总数 · 多到少</option><option value="records_total-asc">记录总数 · 少到多</option></select></label>
      </div>
      <div class="results-line"><div id="result-count" aria-live="polite"></div><button id="clear-filters" class="text-button" hidden>清除筛选</button><label class="mobile-select"><input type="checkbox" id="mobile-select-all">选择当前结果</label></div>
      <div id="queue-content"></div>
      <footer class="table-footer"><span id="footer-count"></span><span>全部展示，无分页</span></footer>
    </section>
    <div class="page-note"><span>ⓘ 原创虚构数据，仅在本浏览器内保存操作。</span><span>时间均为北京时间（UTC+8）</span></div>
    <div id="storage-warning" class="storage-warning" role="alert" hidden></div>
  </main>
  <aside id="selection-bar" class="selection-bar" aria-label="批量操作" hidden><div><strong id="selection-count"></strong><span id="hidden-count"></span></div><button id="inspect-selection" class="text-button">查看已选</button><button id="clear-selection" class="text-button">清空选择</button><button id="retry-selected" class="button primary">批量重试 <span aria-hidden="true">↗</span></button></aside>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
  <dialog id="action-dialog" class="action-dialog" aria-labelledby="action-title"><div id="action-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
