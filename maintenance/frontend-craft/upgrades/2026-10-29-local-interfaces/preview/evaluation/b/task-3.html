 <section class="hero"><div><div class="eyebrow">周末 · 社区见面计划</div><h1>把好书带到街角</h1></div><div class="event-meta"><strong>周末外摆选书</strong>最多携带 18 册</div></section>
 <aside class="brief" aria-label="活动说明"><strong>这次带什么</strong><p>来访者多为附近居民，请保留适合边翻边聊的书。西店图书由另一位同事带来，数量变化要能说清楚。</p></aside>
 <nav class="mobile-switch" aria-label="工作区切换"><button id="browseTab" aria-selected="true" data-view="browse">浏览书目</button><button id="trayTab" aria-selected="false" data-view="tray">携带清单 <span id="mobileCount">3</span><span id="mobileOutside" class="badge outside" hidden></span></button></nav>

 {id:'B01',title:'沿着消失的河流走：一座城市的水与人的记忆',author:'许澜',publisher:'青石出版',theme:'城市',store:'东店',stock:7,reserved:2,initial:2,recommendation:'适合从熟悉的街名谈起；附录较长，介绍时可引导读者先看旧河道地图。'},
 {id:'B02',title:'阳台上的一年：从第一粒种子到最后一场霜',author:'罗芮',publisher:'慢木出版',theme:'自然',store:'西店',stock:5,reserved:1,initial:0},
 {id:'B03',title:'下班以后，我们怎样重新学会画画',author:'周遇',publisher:'斑点出版',theme:'手作',store:'东店',stock:4,reserved:4,initial:0},
 {id:'B04',title:'门牌号背后的人：老街口述生活史',author:'沈宜',publisher:'青石出版',theme:'城市',store:'西店',stock:6,reserved:1,initial:1},
 {id:'B05',title:'给孩子看的夜行动物观察笔记',author:'岑禾',publisher:'溪岸出版',theme:'自然',store:'东店',stock:8,reserved:2,initial:0},
 {id:'B06',title:'缝补不是为了遮住破洞：衣物修复小练习',author:'林简',publisher:'慢木出版',theme:'手作',store:'西店',stock:3,reserved:0,initial:2,note:'请带封面无折痕的版本，现场会演示书里的布贴步骤。'},
 {id:'B07',title:'骑车经过的二十四座小桥',author:'姚青',publisher:'溪岸出版',theme:'城市',store:'东店',stock:2,reserved:2,initial:0},
 {id:'B08',title:'落叶、苔藓和石头的名字',author:'顾庭',publisher:'斑点出版',theme:'自然',store:'西店',stock:6,reserved:0,initial:0}
].map(book=>({...book,available:book.stock-book.reserved,selected:book.initial>0,qty:book.initial||1,note:book.note||'',paused:false,resumeSelected:false}));

let trayMode='selected',detailId=null,detailOpener=null,savedDraft=null,isSaved=false;
const errors={};
const total=()=>books.reduce((sum,b)=>sum+(b.selected?b.qty:0),0);
const selected=()=>books.filter(b=>b.selected);
const storeTotal=store=>selected().filter(b=>b.store===store).reduce((sum,b)=>sum+b.qty,0);
function matches(book){const q=$('search').value.trim().toLocaleLowerCase();return (!q||[book.title,book.author,book.publisher].some(v=>v.toLocaleLowerCase().includes(q)))&&(!$('theme').value||book.theme===$('theme').value)&&(!$('store').value||book.store===$('store').value)&&(!$('availability').value||($('availability').value==='yes'?book.available>0:book.available===0));}
function results(){const list=books.filter(matches);const sort=$('sort').value;return list.sort((a,b)=>sort.startsWith('title')?a.title.localeCompare(b.title,'zh-CN')*(sort==='title-desc'?-1:1):sort.startsWith('avail')?(a.available-b.available)*(sort==='avail-desc'?-1:1)||a.id.localeCompare(b.id):a.id.localeCompare(b.id));}
function notify(text,error=false){$('message').hidden=false;$('message').classList.toggle('error',error);$('messageText').textContent=text;}
function dirty(){isSaved=false;$('message').hidden=true;renderSaved();}
function renderSaved(){$('saveState').textContent=isSaved?'✓ 已保存 · '+savedDraft.time:'● 尚未保存';$('saveState').classList.toggle('saved',isSaved);}
function errorMarkup(b){return '<p class="inline-error" data-error="'+b.id+'" role="alert" '+(errors[b.id]?'':'hidden')+'>'+escapeHtml(errors[b.id]||'')+'</p>';}
function quantity(b,area){return '<div class="quantity" aria-label="'+b.id+' 携带数量"><button data-action="decrease" data-id="'+b.id+'" data-key="'+area+'-'+b.id+'-decrease" aria-label="减少 '+b.id+' 携带数量">−</button><input type="number" inputmode="numeric" min="1" max="'+b.available+'" step="1" value="'+b.qty+'" data-quantity="'+b.id+'" data-key="'+area+'-'+b.id+'-quantity" aria-label="'+b.id+' 携带册数" '+(errors[b.id]?'aria-invalid="true"':'')+'><button data-action="increase" data-id="'+b.id+'" data-key="'+area+'-'+b.id+'-increase" aria-label="增加 '+b.id+' 携带数量">+</button></div>';}
function renderCatalog(){const list=results();$('resultCount').textContent='找到 '+list.length+' 种书';const count=list.filter(b=>b.selected).length;$('visibleSelection').textContent='当前结果已选 '+count+' 种';$('clearVisible').disabled=count===0;$('clearFilters').disabled=![$('search').value,$('theme').value,$('store').value,$('availability').value].some(Boolean);$('bookList').innerHTML=list.length?list.map(b=>'<article class="book-row '+(b.selected?'selected':'')+'" aria-label="'+b.id+' '+escapeHtml(b.title)+'"><span class="book-id">'+b.id+'</span><div><h3><button class="book-title" data-action="detail" data-id="'+b.id+'" data-key="catalog-'+b.id+'-detail">'+escapeHtml(b.title)+'</button></h3><p class="book-meta">'+b.author+' / '+b.publisher+' <span aria-hidden="true">·</span> '+b.theme+' / '+b.store+'</p><div class="book-bottom"><span class="book-stock '+(!b.available?'zero':'')+'">'+(b.available?'余量 <strong>'+b.available+'</strong> 册':'无可携带余量')+' <span class="muted">（在库 '+b.stock+' − 预留 '+b.reserved+'）</span></span><div class="row-tools"><button class="quiet note-link" data-action="detail" data-id="'+b.id+'" data-key="catalog-'+b.id+'-note">'+(b.note?'查看备注':b.recommendation?'荐语与备注':'详情与备注')+'</button><button class="select-button '+(b.selected?'is-selected':'')+'" data-action="'+(b.paused?'restore':'toggle')+'" data-id="'+b.id+'" data-key="catalog-'+b.id+'-select" '+(!b.available&&!b.paused?'aria-disabled="true"':'')+' '+(!b.paused?'aria-pressed="'+b.selected+'"':'')+'>'+(b.paused?'暂缓中 · 恢复':b.selected?'✓ 已选 '+b.qty+' 册':b.available?'+ 加入清单':'无余量')+'</button></div></div></div>'+errorMarkup(b)+'</article>').join(''):'<div class="empty"><strong>没有符合条件的书</strong><p>试试减少一个条件，已选清单仍会保留。</p><button class="quiet" data-action="reset">清除筛选</button></div>';}
function renderTray(){const picked=selected(),paused=books.filter(b=>b.paused),outside=picked.filter(b=>!matches(b));$('totalLarge').textContent=total();$('remaining').textContent=total()===18?'携带量已满':'还可带 '+(18-total())+' 册';$('capacity').setAttribute('aria-valuenow',total());$('capacityFill').style.width=total()/18*100+'%';$('eastTotal').textContent=storeTotal('东店')+' 册';$('westTotal').textContent=storeTotal('西店')+' 册';$('selectedCount').textContent=picked.length;$('pausedCount').textContent=paused.length;$('mobileCount').textContent=picked.length;$('mobileOutside').hidden=outside.length===0;$('mobileOutside').textContent='筛选外 '+outside.length;$('selectedTab').setAttribute('aria-selected',trayMode==='selected');$('pausedTab').setAttribute('aria-selected',trayMode==='paused');$('pickedList').setAttribute('aria-labelledby',trayMode==='selected'?'selectedTab':'pausedTab');$('clearAll').hidden=trayMode==='paused';$('clearAll').disabled=picked.length===0;$('trayHint').textContent=trayMode==='selected'?(outside.length?'含筛选外 '+outside.length+' 种 · 选择均保留':'全部已选 · 不受筛选影响'):'保留数量与备注，恢复时重新校验';const list=trayMode==='selected'?picked:paused;
 $('pickedList').innerHTML=list.length?list.map(b=>'<article class="picked-row"><div class="picked-title"><span class="picked-id">'+b.id+'</span><button class="book-title" data-action="detail" data-id="'+b.id+'" data-key="tray-'+b.id+'-detail">'+escapeHtml(b.title)+'</button></div><div class="picked-meta"><span>'+b.store+' · 余量 '+b.available+' 册</span>'+(!matches(b)?'<span class="badge outside">筛选外</span>':'')+(b.paused?'<span class="badge paused">本次暂缓</span>':'')+'</div>'+(b.note?'<p class="note-preview">'+escapeHtml(b.note)+'</p>':'')+(b.paused?'<p class="paused-text">'+(b.resumeSelected?'原携带 '+b.qty+' 册，恢复后计入总量。':'原未选，恢复后回到待选书目。')+'</p><div class="picked-actions"><button class="quiet small" data-action="detail" data-id="'+b.id+'">编辑备注</button><button class="small" data-action="restore" data-id="'+b.id+'" data-key="tray-'+b.id+'-restore">恢复'+(b.resumeSelected?' '+b.qty+' 册':'待选')+'</button></div>':'<div class="picked-actions">'+quantity(b,'tray')+'<div><button class="quiet small" data-action="pause" data-id="'+b.id+'" data-key="tray-'+b.id+'-pause">暂缓</button><button class="quiet small" data-action="detail" data-id="'+b.id+'">编辑</button><button class="quiet small" data-action="remove" data-id="'+b.id+'" aria-label="取消选择 '+b.id+'">移除</button></div></div>')+errorMarkup(b)+'</article>').join(''):'<div class="empty"><strong>'+(trayMode==='selected'?'还没有要带的书':'暂无暂缓图书')+'</strong><p>'+(trayMode==='selected'?'从书目中挑选这次要带的书。':'单书的「暂缓」会保留数量与备注。')+'</p></div>';
 renderChanges();
 $('footerTotal').textContent=picked.length+' 种 · '+total()+' / 18 册';$('footerSub').textContent=outside.length?'含筛选外 '+outside.length+' 种 · 查看完整清单 ↗':'查看完整清单 ↗';}
function renderChanges(){const changes=books.filter(b=>(b.selected?b.qty:0)!==b.initial),west=storeTotal('西店')-3;const wasOpen=$('changeSummary').querySelector('details')?.open;$('changeSummary').innerHTML=changes.length?'<details class="change-summary" '+(wasOpen?'open':'')+'><summary>数量变化 · 西店'+(west===0?'无净变化':west>0?'增加 '+west+' 册':'减少 '+Math.abs(west)+' 册')+'</summary><ul>'+changes.map(b=>'<li>'+b.id+' '+b.store+'：初选 '+b.initial+' → 本次 '+(b.selected?b.qty:0)+' 册'+(b.paused?'（暂缓）':'')+'</li>').join('')+'</ul></details>':'';}
function render(){renderCatalog();renderTray();renderSaved();}
function preserveFocusRender(){const key=document.activeElement?.dataset.key;render();if(detailId&&$('bookDialog').open)renderDetail();if(key){const target=Array.from(document.querySelectorAll('[data-key]')).find(el=>el.dataset.key===key);target?.focus({preventScroll:true});}}
function invalidReason(book,qty,restoring=false){if(book.available===0)return '在库 '+book.stock+' 册已全部预留，可携带余量为 0，不能加入清单。';if(!Number.isInteger(qty)||qty<1)return '携带数量必须是大于 0 的整数；若不携带，请移除或暂缓。';if(qty>book.available)return '可携带余量只有 '+book.available+' 册（在库 '+book.stock+' − 预留 '+book.reserved+'），不能设为 '+qty+' 册。';const next=total()-(book.selected?book.qty:0)+qty;if(next>18)return (restoring?'恢复 '+qty+' 册后':'调整后')+'合计 '+next+' 册，超过上限 18 册；请先减少 '+(next-18)+' 册再试。';return '';}
// Quantity edits keep the live input/button nodes so blur validation does not swallow the next click.
function refreshNumbers(){
 $('totalLarge').textContent=total();$('remaining').textContent=total()===18?'携带量已满':'还可带 '+(18-total())+' 册';$('capacity').setAttribute('aria-valuenow',total());$('capacityFill').style.width=total()/18*100+'%';$('eastTotal').textContent=storeTotal('东店')+' 册';$('westTotal').textContent=storeTotal('西店')+' 册';$('footerTotal').textContent=selected().length+' 种 · '+total()+' / 18 册';
 document.querySelectorAll('[data-quantity]').forEach(input=>{const b=books.find(b=>b.id===input.dataset.quantity);input.value=b.qty;input.setAttribute('aria-invalid',Boolean(errors[b.id]));});
 document.querySelectorAll('[data-error]').forEach(el=>{el.textContent=errors[el.dataset.error]||'';el.hidden=!errors[el.dataset.error];});
 document.querySelectorAll('.select-button[data-action="toggle"]').forEach(button=>{const b=books.find(b=>b.id===button.dataset.id);if(b.selected)button.textContent='✓ 已选 '+b.qty+' 册';});
 renderChanges();
}
function fail(book,reason){errors[book.id]=reason;notify(book.id+'：'+reason+(book.paused?' 仍保持暂缓。':book.selected?' 已保留原值 '+book.qty+' 册。':' 未加入清单。'),true);refreshNumbers();}
function applyQuantity(book,raw){const qty=String(raw).trim()===''?NaN:Number(raw);const reason=invalidReason(book,qty);if(reason){fail(book,reason);return;}if(qty===book.qty){delete errors[book.id];refreshNumbers();return;}book.qty=qty;delete errors[book.id];dirty();notify(book.id+' 已调整为 '+qty+' 册；'+book.store+'共携带 '+storeTotal(book.store)+' 册。');refreshNumbers();}
function toggle(book){if(book.selected){remove(book);return;}const reason=invalidReason(book,book.qty);if(reason){fail(book,reason);return;}book.selected=true;delete errors[book.id];dirty();notify(book.id+' 已加入 '+book.qty+' 册；本次共 '+total()+' 册。');preserveFocusRender();}
function remove(book){if(!book.selected)return;book.selected=false;delete errors[book.id];dirty();notify(book.id+' 已取消选择，备注保留；'+book.store+'共携带 '+storeTotal(book.store)+' 册。');preserveFocusRender();}
function pause(book){if(book.paused)return;book.resumeSelected=book.selected;book.selected=false;book.paused=true;delete errors[book.id];dirty();notify(book.id+' 已暂缓，数量与备注已保留，不计入携带量。');preserveFocusRender();}
function restore(book){if(!book.paused)return;if(book.resumeSelected){const reason=invalidReason(book,book.qty,true);if(reason){fail(book,reason);return;}}book.selected=book.resumeSelected;book.paused=false;book.resumeSelected=false;delete errors[book.id];dirty();notify(book.id+(book.selected?' 已恢复 '+book.qty+' 册，备注保留。':' 已恢复为待选，备注保留。'));preserveFocusRender();}
function resetFilters(){['search','theme','store','availability'].forEach(id=>$(id).value='');render();}
function changeView(view){$('workspace').dataset.mobile=view;$('browseTab').setAttribute('aria-selected',view==='browse');$('trayTab').setAttribute('aria-selected',view==='tray');}
function renderDetail(){const b=books.find(book=>book.id===detailId);if(!b)return;$('dialogContent').innerHTML='<header class="dialog-header"><p class="eyebrow">'+b.id+' · '+b.theme+' / '+b.store+'</p><h2 id="detailTitle">'+escapeHtml(b.title)+'</h2><p class="book-meta">'+b.author+' / '+b.publisher+'</p><button class="close-dialog" data-action="close" aria-label="关闭单书详情">×</button></header><div class="dialog-body"><div class="dialog-facts"><div><span>在库</span><strong>'+b.stock+' <small>册</small></strong></div><div><span>已预留</span><strong>'+b.reserved+' <small>册</small></strong></div><div><span>可携带余量</span><strong>'+b.available+' <small>册</small></strong></div></div>'+(b.recommendation?'<blockquote class="recommendation"><strong>书店荐语</strong>'+escapeHtml(b.recommendation)+'</blockquote>':'')+'<div class="note-label"><label for="bookNote">单书备注</label><span>取书提醒、现场介绍等</span></div><textarea id="bookNote" placeholder="记录这本书的取书提醒或介绍思路……" data-note="'+b.id+'">'+escapeHtml(b.note)+'</textarea><div class="detail-selection"><div><strong>'+(b.paused?'本次暂缓':b.selected?'本次携带':'尚未选择')+'</strong><span class="muted">'+(b.paused?(b.resumeSelected?'保留原数量 '+b.qty+' 册，恢复时检查容量':'恢复后回到待选书目'):'余量 = 在库 − 已预留')+'</span></div>'+(b.paused?'<button data-action="restore" data-id="'+b.id+'" data-key="detail-'+b.id+'-restore">恢复'+(b.resumeSelected?' '+b.qty+' 册':'待选')+'</button>':b.selected?quantity(b,'detail'):'<button data-action="toggle" data-id="'+b.id+'" data-key="detail-'+b.id+'-select" '+(!b.available?'aria-disabled="true"':'')+'>'+(b.available?'加入清单':'无余量 · 不可选择')+'</button>')+'</div>'+errorMarkup(b)+'</div><footer class="dialog-footer"><div>'+(b.paused?'<span class="badge paused">暂缓中 · 不计入携带量</span>':'<button class="quiet" data-action="pause" data-id="'+b.id+'" data-key="detail-'+b.id+'-pause">本次暂缓</button>'+(b.selected?'<button class="quiet" data-action="remove" data-id="'+b.id+'">移除</button>':''))+'</div><button class="primary" data-action="close">完成</button></footer>';}
function openDetail(id,opener){detailId=id;detailOpener=opener?.dataset.key;renderDetail();$('bookDialog').showModal();}
function closeDetail(){$('bookDialog').close();}
document.addEventListener('click',event=>{const control=event.target.closest('button');if(!control)return;if(control.dataset.view){changeView(control.dataset.view);return;}if(control.dataset.tray){trayMode=control.dataset.tray;renderTray();return;}const action=control.dataset.action;if(!action)return;if(action==='close'){closeDetail();return;}if(action==='reset'){resetFilters();return;}const book=books.find(b=>b.id===control.dataset.id);if(!book)return;switch(action){case'detail':openDetail(book.id,control);break;case'toggle':toggle(book);break;case'remove':remove(book);break;case'pause':pause(book);break;case'restore':restore(book);break;case'increase':applyQuantity(book,book.qty+1);break;case'decrease':applyQuantity(book,book.qty-1);break;}});
document.addEventListener('change',event=>{if(!event.target.dataset.quantity)return;const book=books.find(b=>b.id===event.target.dataset.quantity);applyQuantity(book,event.target.value);});
document.addEventListener('input',event=>{if(!event.target.dataset.note)return;const book=books.find(b=>b.id===event.target.dataset.note);book.note=event.target.value;dirty();renderCatalog();renderTray();});
document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.dataset.quantity){event.preventDefault();event.target.blur();}});
$('search').addEventListener('input',render);['theme','store','availability','sort'].forEach(id=>$(id).addEventListener('change',render));$('clearFilters').addEventListener('click',resetFilters);
$('clearVisible').addEventListener('click',()=>{const list=results().filter(b=>b.selected);if(!list.length)return;list.forEach(b=>{b.selected=false;delete errors[b.id];});dirty();notify('已取消当前结果中的 '+list.length+' 种选择；筛选外的已选图书与所有备注保留。');render();});
$('clearAll').addEventListener('click',()=>{const count=selected().length;if(!count)return;books.forEach(b=>{if(b.selected){b.selected=false;delete errors[b.id];}});dirty();notify('已取消全部 '+count+' 种选择；备注及暂缓图书保留。');render();});
$('saveDraft').addEventListener('click',()=>{savedDraft={books:books.map(b=>({...b})),time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})};isSaved=true;renderSaved();notify('已保存选书草稿：'+selected().length+' 种 '+total()+' 册。仅在当前页面保留，不会调拨库存。');});
$('showTray').addEventListener('click',()=>{changeView('tray');trayMode='selected';renderTray();$('trayHeading').scrollIntoView({block:'start',behavior:'auto'});});$('dismissMessage').addEventListener('click',()=>{$('message').hidden=true;});
$('bookDialog').addEventListener('close',()=>{detailId=null;render();if(detailOpener){Array.from(document.querySelectorAll('[data-key]')).find(el=>el.dataset.key===detailOpener)?.focus({preventScroll:true});}});
render();
</script>
</body>
</html>
