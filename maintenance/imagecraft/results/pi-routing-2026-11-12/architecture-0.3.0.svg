<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="t d">
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB',sans-serif;}</style>
<title id="t">系统架构</title>
<desc id="d">浏览器前端经 Nginx 网关访问用户、订单、检索三个后端服务；用户与订单服务读写 PostgreSQL，三个服务共用 Redis 缓存，检索服务查询 Elasticsearch；订单服务下单后向 RabbitMQ 发送消息，通知服务消费并发送邮件；所有服务日志写入 Loki。</desc>
<defs>
